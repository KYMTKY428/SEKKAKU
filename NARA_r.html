<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>NARA（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* NARA 既存スタイル（元 NARA.html から無変更で切り出し） */
:root {
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #FFFFFF; --ink: #111418; --muted: #8A9099; --soft: #F5F6F8; --line: #ECEEF1; --btn: #111418; --btn-ink: #FFFFFF; --page: #EDEFF2;
  --shadow: 0 10px 30px rgba(17, 20, 24, .07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1013; --ink: #F2F4F6; --muted: #8B929B; --soft: #171A1E; --line: #23272C; --btn: #F2F4F6; --btn-ink: #111418; --page: #07080A; --shadow: 0 10px 30px rgba(0, 0, 0, .4); } }
:root[data-theme="dark"] { --bg: #0E1013; --ink: #F2F4F6; --muted: #8B929B; --soft: #171A1E; --line: #23272C; --btn: #F2F4F6; --btn-ink: #111418; --page: #07080A; --shadow: 0 10px 30px rgba(0, 0, 0, .4); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.7; font-weight: 500; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent, #111418); outline-offset: 3px; border-radius: 14px; }
button:disabled { cursor: default; }
img { display: block; }
.phone { --accent: #111418; --on-accent: #fff; position: relative; width: 100%; max-width: 430px; height: 100%; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 520px) { body { display: flex; align-items: center; justify-content: center; } .phone { height: min(880px, 100%); border-radius: 36px; box-shadow: 0 30px 80px rgba(17, 20, 24, .18); border: 1px solid var(--line); } }

.top { flex: none; padding: 18px 28px 0; min-height: 44px; }
.wm { font-weight: 900; font-size: 13px; letter-spacing: .32em; color: var(--muted); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 28px 56px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 12px 8px; border-top: 1px solid var(--line); background: var(--bg); }
.tab { position: relative; display: grid; place-items: center; min-height: 56px; color: var(--muted); transition: color .2s, transform .15s; }
.tab:active { transform: scale(.88); }
.tab i { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] i { transform: scale(1); }

/* character */
.nara { display: block; margin: 0 auto; overflow: visible; }
.nara .cb { fill: var(--c); transition: fill .55s ease; } .nara .cs { fill: var(--s); transition: fill .55s ease; } .nara .cst { stroke: var(--c); transition: stroke .55s ease; }
.nara.idle { animation: bob 3.4s ease-in-out infinite; }
.nara .tail { transform-origin: 90px 38px; animation: tailw 2.6s ease-in-out infinite; }
.nara .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.nara .wv { transform-origin: 108px 62px; animation: wave 1.1s ease-in-out infinite; }
.nara.hop { animation: hop .7s cubic-bezier(.3, .8, .4, 1); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes tailw { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(8deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-16deg); } }
@keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 25% { transform: translateY(0) scale(1.1, .88); } 55% { transform: translateY(-16px) scale(.94, 1.08); } 80% { transform: translateY(0) scale(1.06, .94); } 100% { transform: scale(1); } }

/* home */
.home { padding-top: 6px; }
.hero { display: flex; justify-content: center; min-height: 40px; margin-top: 8px; }
.q { font-size: 24px; font-weight: 900; text-align: center; margin: 28px 0 24px; letter-spacing: .02em; }
.moods { display: flex; justify-content: center; gap: 12px; }
.md { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; }
.md i { display: block; width: 36px; height: 36px; border-radius: 12px; background: var(--mc); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1), box-shadow .25s; }
.md:active i { transform: scale(.85); }
.md[aria-pressed="true"] i { transform: scale(1.3); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--mc); }
.mk-md { display: grid; } .mk-md.sel i { transform: scale(1.3); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--mc); }
.moodname { text-align: center; color: var(--muted); font-weight: 700; height: 28px; margin-top: 12px; }
.cta { width: 100%; min-height: 60px; border-radius: 20px; background: var(--btn); color: var(--btn-ink); font-size: 17px; font-weight: 900; letter-spacing: .04em; display: flex; align-items: center; justify-content: center; margin-top: 20px; transition: transform .15s, opacity .3s; }
.cta:active:not(:disabled) { transform: scale(.97); }
.cta:disabled { opacity: .18; }
.cta.ready { animation: ctaIn .5s cubic-bezier(.3, 1.5, .5, 1) both, ring 2.4s ease-out 1s infinite; }
@keyframes ctaIn { from { transform: scale(.94); } to { transform: scale(1); } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 16px transparent; } }
.btn { min-height: 48px; padding: 0 20px; border-radius: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s, background .25s, color .25s; white-space: nowrap; }
.btn:active { transform: scale(.94); }
.btn.dark { background: var(--btn); color: var(--btn-ink); } .btn.line { border: 1.5px solid var(--line); background: var(--bg); }
.btn.ghost { color: var(--muted); } .btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; } .btn.big { min-height: 56px; font-size: 16px; }
.btn.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn[aria-pressed="true"].big { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.pop { animation: popb .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes popb { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.acts { display: flex; gap: 10px; margin-top: 18px; } .acts .btn { flex: 1; }
.sec { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .12em; margin: 48px 0 14px; }
.sub { color: var(--muted); font-size: 13px; } .c { text-align: center; } .mut { color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.sugs { margin-top: 40px; display: grid; gap: 16px; }
.sug { background: var(--soft); border-radius: 28px; padding: 28px 24px 24px; }
.sug.anim { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; } .sug.dim { opacity: .6; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.sug h3, .post h3 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.5; }
.hk { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.mis { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; color: var(--muted); font-size: 13px; font-weight: 700; } .mis.c { justify-content: center; }
.mi { display: inline-flex; align-items: center; gap: 5px; }
.done-tag { margin-top: 16px; font-weight: 900; }
.again { text-align: center; margin-top: 4px; }
.doing { background: var(--soft); border-radius: 24px; padding: 20px 22px; margin-top: 8px; }
.rows { display: grid; } .row2 { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; }
.btnrow { width: 100%; } .rt { font-weight: 900; line-height: 1.5; } .rs { color: var(--muted); font-size: 13px; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 12px; } .chev { color: var(--muted); font-size: 22px; }
.dots3 { display: flex; gap: 6px; margin-top: 8px; } .dots3 i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); } .dots3 i.on { background: var(--accent); }
.week { display: flex; justify-content: space-between; } .week i { width: 30px; height: 30px; border-radius: 10px; background: var(--soft); } .week i.on { background: var(--accent); } .week i.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .bar b { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s; }

/* feed */
.page { padding-top: 6px; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 6px -28px 8px; padding: 6px 28px; scrollbar-width: none; } .filters::-webkit-scrollbar { display: none; }
.fl { flex: none; min-height: 40px; padding: 0 16px; border-radius: 20px; font-weight: 700; color: var(--muted); background: var(--soft); }
.fl[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.post { padding: 28px 0 26px; border-bottom: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; } .who b { font-weight: 900; }
.tag { margin-left: 8px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 8px; background: var(--soft); color: var(--muted); }
.lvt { font-size: 12px; color: var(--muted); font-weight: 700; }
.note { margin: 8px 0 0; color: var(--muted); }
.post > .btn { margin-top: 18px; }
.nice { flex: 1; min-height: 48px; border-radius: 16px; border: 1.5px solid var(--line); font-weight: 900; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, background .25s, color .25s; }
.nice:active { transform: scale(.94); }
.cube { width: 15px; height: 15px; border-radius: 5px; background: var(--muted); transition: background .25s; display: inline-block; }
.nice[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.nice[aria-pressed="true"] .cube { background: var(--on-accent); }
.bst { position: absolute; width: 8px; height: 8px; border-radius: 3px; pointer-events: none; z-index: 70; animation: burst .7s ease-out forwards; }
@keyframes burst { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2) rotate(120deg); opacity: 0; } }

/* log */
.count { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 20px; } .count b { font-size: 56px; font-weight: 900; line-height: 1; } .count span { color: var(--muted); font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tile { display: block; aspect-ratio: 1; border-radius: 28%; } .tile.empty { background: var(--soft); } .tile.pop { animation: tilepop .8s cubic-bezier(.3, 1.8, .5, 1) .2s both; }
@keyframes tilepop { from { transform: scale(0) rotate(-20deg); } to { transform: none; } }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; } .cal .w { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; } .cal i { display: block; }
.cal-d { position: relative; aspect-ratio: 1; border-radius: 28%; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.cal-d.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); } .cal-d b { position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.insight { display: flex; align-items: baseline; gap: 12px; margin-top: 32px; } .insight b { font-size: 36px; font-weight: 900; } .insight span { color: var(--muted); font-size: 13px; }
.tl { list-style: none; margin: 0; padding: 0; } .tl li { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.dotc { width: 14px; height: 14px; border-radius: 5px; flex: none; }
.pubb { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 12px; background: var(--soft); color: var(--muted); } .pubb[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

/* me */
.me-prof { width: 100%; display: flex; align-items: center; gap: 18px; padding: 16px 0; text-align: left; } .me-prof b { font-size: 20px; }
.seg { display: flex; gap: 6px; padding: 5px; background: var(--soft); border-radius: 18px; } .seg button { flex: 1; min-height: 46px; border-radius: 14px; font-weight: 700; font-size: 14px; color: var(--muted); transition: background .25s, color .25s; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 2px 8px rgba(17, 20, 24, .08); }

/* overlays */
.overlay { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20; }
.overlay.enter { animation: oin .38s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes oin { from { transform: translateY(22px); } to { transform: none; } }
.ohead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; min-height: 60px; } .back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: var(--ink); } .ottl { font-weight: 900; flex: 1; text-align: center; padding-right: 44px; }
.ibody { flex: 1; overflow-y: auto; padding: 8px 28px 24px; } .ibody.c { text-align: center; }
.ifoot { flex: none; padding: 8px 28px calc(24px + env(safe-area-inset-bottom, 0px) * 0); } .ifoot .cta { margin-top: 14px; }
.it { font-size: 28px; font-weight: 900; line-height: 1.4; margin: 20px 0 26px; } .it.c { text-align: center; } .tt { text-align: center; color: var(--muted); margin: -12px 0 0; }
.pages { display: flex; justify-content: center; gap: 6px; } .pages i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .3s, background .3s; } .pages i.on { width: 20px; background: var(--ink); } .pages.inline { flex: 1; }
.txt { width: 100%; min-height: 56px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 18px; font: inherit; font-size: 16px; }
.bigopts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; } .bo { min-height: 104px; border-radius: 24px; background: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 700; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background .2s, color .2s; color: var(--ink); }
.bo:active { transform: scale(.94); } .bo[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); transform: scale(1.03); }
.bigopts.mini { grid-template-columns: repeat(4, 1fr); gap: 8px; } .bigopts.mini .bo { min-height: 80px; font-size: 12px; border-radius: 18px; } .bigopts.mini .bo svg { width: 22px; height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; } .chips.c { justify-content: center; } .chp { min-height: 48px; padding: 0 20px; border-radius: 16px; background: var(--soft); font-weight: 700; transition: background .2s, color .2s, transform .2s cubic-bezier(.3, 1.6, .5, 1); } .chp:active { transform: scale(.94); } .chp[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.lab { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin: 30px 0 12px; } .lab.c { text-align: center; }
.stack { display: grid; gap: 12px; } .pace { text-align: left; padding: 22px; border-radius: 24px; background: var(--soft); display: grid; gap: 2px; transition: background .2s, color .2s; } .pace span { font-size: 13px; opacity: .7; } .pace b { font-size: 18px; } .pace[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.row3 { display: flex; gap: 10px; align-items: center; } .row3 .cta { margin-top: 0; }
.mini-nara { height: 76px; display: flex; justify-content: center; margin-bottom: 4px; }
.tutchar { display: flex; justify-content: center; min-height: 24px; margin-top: 8px; } .tutm { min-height: 240px; display: grid; align-content: center; gap: 22px; margin-top: 12px; }
.tuthead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0 28px; min-height: 56px; } .tuthead button { min-height: 44px; padding: 0 8px; font-weight: 700; color: var(--muted); }
.tutbody { flex: 1; overflow-y: auto; padding: 0 28px 12px; }
.mini.sug, .mini.post { padding: 20px; border-radius: 22px; border: 0; } .mini.post { background: var(--soft); }
.tiles.mini { max-width: 260px; margin: 0 auto; }
.timer { font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; margin: 8px 0 4px; letter-spacing: .02em; }
.bignum { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 12px; } .bignum .tile { width: 44px; } .bignum b { font-size: 64px; font-weight: 900; line-height: 1; }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px 10px 20px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 80; animation: toastin .35s cubic-bezier(.3, 1.4, .5, 1) both; max-width: 92%; display: flex; gap: 14px; align-items: center; white-space: nowrap; }
.toast button { font-weight: 900; color: var(--bg); text-decoration: underline; min-height: 32px; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
.confetti { position: absolute; top: -10px; width: 9px; height: 13px; border-radius: 3px; animation: fall 1.8s ease-in forwards; z-index: 90; pointer-events: none; } @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

/* splash */
.splash { background: #111418; color: #fff; z-index: 30; }
.splash .box { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 32px 20px; gap: 34px; }
.splash .ln { opacity: 0; animation: lnIn .55s cubic-bezier(.2, .7, .2, 1) forwards; font-weight: 700; line-height: 1.6; }
.splash .l1 { font-size: 27px; font-weight: 900; line-height: 1.55; animation-delay: .2s; }
.splash .l2 { font-size: 17px; color: #A9B1BA; animation-delay: .8s; }
.splash .l3 { font-size: 34px; font-weight: 900; line-height: 1.5; animation-delay: 1.4s; }
.splash .em { position: relative; display: inline-block; background: linear-gradient(90deg, #2F6FD6, #38B28A, #F2C230, #F28A2E); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
.splash .em::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #2F6FD6, #38B28A, #F2C230, #F28A2E); transform: scaleX(0); transform-origin: left; animation: uline .6s cubic-bezier(.3, .8, .2, 1) 1.9s forwards; }
.splash .l4 { display: flex; align-items: baseline; gap: 12px; animation-delay: 2.1s; }
.splash .l4 b { font-size: 22px; font-weight: 900; letter-spacing: .34em; }
.splash .l4 span { font-size: 14px; color: #A9B1BA; letter-spacing: .2em; }
@keyframes uline { to { transform: scaleX(1); } }
.splash .ctaw { opacity: 0; animation: lnIn .5s ease forwards; animation-delay: 2.5s; padding: 0 28px calc(28px + env(safe-area-inset-bottom, 0px) * 0); }
.splash .cta { background: #fff; color: #111418; margin-top: 0; }
.splash.skip .ln, .splash.skip .ctaw { animation: none; opacity: 1; transform: none; filter: none; }
.splash.skip .em::after { animation: none; transform: scaleX(1); }
@keyframes lnIn { from { opacity: 0; transform: translateY(14px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }

/* avatar + maker */
.avs { display: inline-block; border-radius: 50%; overflow: hidden; flex: none; vertical-align: middle; } .avs svg { display: block; width: 100%; height: 100%; }
.mkprev { display: flex; justify-content: center; margin: 22px 0 18px; }
.mktabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -28px; padding: 0 28px; } .mktabs::-webkit-scrollbar { display: none; } .mktabs button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 14px; font-weight: 700; font-size: 14px; color: var(--muted); } .mktabs button[aria-selected="true"] { background: var(--soft); color: var(--ink); }
.mkbody { margin-top: 18px; min-height: 150px; }

  const LOCATION_LABEL = { home: 'おうち', near: '近所', far: '少し遠く' };
  const split = (s, d) => (s ? String(s).split(d).map(x => x.trim()).filter(Boolean) : []);

  /* 旧データ構造 → Experience 型（＋旧UI互換のエイリアス） */
  function normalize(r) {
    const [id, cat, title, min, pl, cost, diff, nov, soc, en, tags, sur, exc, flags, mLv, k, d, steps, notes] = r;
    const f = split(flags, ',');
    return {
      /* Experience 型 */
      id, title, description: d, category: cat, categoryLabel: CATEGORIES[cat],
      durationMinutes: min, estimatedCost: cost, locationType: pl,
      difficulty: diff, noveltyLevel: nov, socialLevel: soc,
      interestTags: split(tags, ','), surpriseTags: split(sur, ','), exclusionTags: split(exc, ','),
      steps: split(steps, '|'), safetyNotes: split(notes, '|'),
      requiresReservation: f.includes('r'), requiresVerification: f.includes('v'),
      /* 追加属性 */
      energy: en, outdoor: f.includes('o'), nightOk: f.includes('n'), planAhead: f.includes('p'),
      masakaLevel: mLv || 0, hook: k, riskTags: [],
      /* 旧UI互換（t,g,min,pl,cost,lv,en,k,d,tip,out,soc） */
      t: title, g: cat, min, pl, cost, lv: diff, en, k, d, tip: split(notes, '|')[0] || '', out: f.includes('o') ? 1 : 0,
      soc: soc === 'group' ? 1 : 0, pr: f.includes('r') ? 1 : 0, wild: id >= 200 && id < 300 ? 1 : 0
    };
  }

  /* 外部（AI API など）から来た体験データを Experience 型に寄せる変換 */
  function fromExternal(x) {
    if (!x || typeof x !== 'object') return null;
    const arr = (v) => Array.isArray(v) ? v.map(String) : [];
    const num = (v, def) => (typeof v === 'number' && isFinite(v) ? v : def);
    const clamp3 = (v) => Math.min(3, Math.max(1, Math.round(num(v, 2))));
    const cat = CATEGORIES[x.category] ? x.category : 'touch';
    const pl = ['home', 'near', 'far'].includes(x.locationType) ? x.locationType : 'far';
    const e = normalize([String(x.id || 'ext-' + Math.random().toString(36).slice(2, 8)), cat, String(x.title || ''), num(x.durationMinutes, 9999),
      pl, num(x.estimatedCost, 999999), clamp3(x.difficulty), clamp3(x.noveltyLevel),
      ['solo', 'group', 'either'].includes(x.socialLevel) ? x.socialLevel : 'either', clamp3(x.energy || x.difficulty),
      arr(x.interestTags).join(','), arr(x.surpriseTags).join(','), arr(x.exclusionTags).join(','),
      [x.requiresReservation ? 'r' : '', x.requiresVerification !== false ? 'v' : '', 'p'].filter(Boolean).join(','),
      Math.min(3, Math.max(0, Math.round(num(x.masakaLevel, 0)))), String(x.hook || ''), String(x.description || ''),
      arr(x.steps).join('|'), arr(x.safetyNotes).join('|')]);
    e.riskTags = arr(x.riskTags); e.external = true;
    return e;
  }

  const SCHEMA_VERSION = 5;   // v2: MBTI・性格傾向・行動履歴 / v3: 睡眠・休息 / v4: 施設検索 / v5: アプリv2.0（時間別提案・ポイント・アバター装飾）
  const MAX_EVENTS = 600;

  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);

  function defaultProfile() {
    return { mbti: null, mbtiStatus: null, social: null, range: null, openness: null, interests: [], avoid: [], adventure: null, surpriseLevel: 2 };
  }

  function defaultSleep() {
    return { usualBedtime: null, usualWakeTime: null, desiredSleepMinutes: null, lifestyleType: null, sleepSuggestionsEnabled: true };
  }
  const HM = /^\d{1,2}:\d{2}$/;
  const REST_TYPES = ['sleep', 'early_sleep', 'do_nothing', 'relax', 'digital_detox', 'free'];

  /* 型の崩れた値を既定値に戻す（不正データ対策） */
  function sanitize(s, defaults) {
    const d = defaults();
    if (!isObj(s)) return d;
    Object.keys(d).forEach(k => {
      if (s[k] === undefined || s[k] === null && d[k] !== null) { s[k] = d[k]; return; }
      if (Array.isArray(d[k]) && !Array.isArray(s[k])) s[k] = d[k];
      else if (isObj(d[k]) && !isObj(s[k])) s[k] = d[k];
      else if (typeof d[k] === 'number' && typeof s[k] !== 'number') s[k] = d[k];
      else if (typeof d[k] === 'boolean' && typeof s[k] !== 'boolean') s[k] = d[k];
    });
    s.records = s.records.filter(r => isObj(r) && (r.kind === 'done' || r.kind === 'skip') && typeof r.date === 'string');
    s.later = s.later.filter(x => isObj(x) && x.evId !== undefined);
    s.events = s.events.filter(isObj).slice(-MAX_EVENTS);
    const p = Object.assign(defaultProfile(), isObj(s.profile) ? s.profile : {});
    if (!Array.isArray(p.interests)) p.interests = [];
    if (!Array.isArray(p.avoid)) p.avoid = [];
    if (![1, 2, 3].includes(p.surpriseLevel)) p.surpriseLevel = 2;
    if (p.adventure !== null && ![1, 2, 3, 4, 5].includes(p.adventure)) p.adventure = null;
    s.profile = p;
    const sl = Object.assign(defaultSleep(), isObj(s.sleep) ? s.sleep : {});
    if (sl.usualBedtime && !HM.test(sl.usualBedtime)) sl.usualBedtime = null;
    if (sl.usualWakeTime && !HM.test(sl.usualWakeTime)) sl.usualWakeTime = null;
    if (sl.desiredSleepMinutes !== null && !(sl.desiredSleepMinutes > 0 && sl.desiredSleepMinutes <= 720)) sl.desiredSleepMinutes = null;
    if (!['morning', 'night', 'irregular', 'shift', null].includes(sl.lifestyleType)) sl.lifestyleType = null;
    sl.sleepSuggestionsEnabled = sl.sleepSuggestionsEnabled !== false;
    s.sleep = sl;
    s.rests = (Array.isArray(s.rests) ? s.rests : []).filter(r => isObj(r) && typeof r.date === 'string' && REST_TYPES.includes(r.restType));
    if (s.dailyMode && !(isObj(s.dailyMode) && typeof s.dailyMode.date === 'string' && ['normal', 'rest'].includes(s.dailyMode.mode))) s.dailyMode = null;
    if (s.facPrefs && !(isObj(s.facPrefs) && typeof s.facPrefs.lat === 'number' && typeof s.facPrefs.lng === 'number')) s.facPrefs = null;
    if (s.v2 !== null && s.v2 !== undefined) {   // v2.0 の状態：型の崩れを直す（残高は ledger から毎回計算するので、直接の書き換えは効かない）
      if (!isObj(s.v2)) s.v2 = null;
      else {
        ['completions', 'skips', 'ledger', 'owned', 'shown', 'condHistory'].forEach(k => { if (!Array.isArray(s.v2[k])) s.v2[k] = []; });
        s.v2.ledger = s.v2.ledger.filter(l => isObj(l) && (l.type === 'earn' || l.type === 'spend') && typeof l.pts === 'number' && l.pts >= 0);
        s.v2.owned = [...new Set(s.v2.owned.filter(x => typeof x === 'string'))];
        if (!isObj(s.v2.conds)) s.v2.conds = {};
      }
    }
    if (s.plan && (!isObj(s.plan) || !Array.isArray(s.plan.slots))) s.plan = null;
    if (s.planned && (!isObj(s.planned) || s.planned.evId === undefined)) s.planned = null;
    s.schemaVersion = SCHEMA_VERSION;
    return s;
  }

  /* v1 → v2 */
  function migrateV1(old) {
    const s = Object.assign({}, old);
    s.profile = defaultProfile();
    s.profileAsked = !old.onboarded;          // 既存ユーザーには「プロフィールを教えて」の案内を出す
    s.events = [];
    s.records = (old.records || []).map(r => Object.assign({}, r, {
      sat: r.sat || (r.feeling === 'good' ? 3 : r.feeling === 'ok' ? 2 : r.feeling === 'meh' ? 1 : null),
      recType: r.recType || null
    }));
    s.later = (old.later || []).map(x => Object.assign({ at: null, recType: null }, x));
    s.plan = null;                             // 旧形式の「きょうの3つ」は日替わりのため破棄（再提案で復元）
    s.migratedFrom = 1;
    return s;
  }
  function migrate(raw) {
    let s = raw; const v = (isObj(s) && s.schemaVersion) || 1;
    if (v < 2) s = migrateV1(s);
    if (v < 3) { s = Object.assign({}, s); s.sleep = s.sleep || defaultSleep(); s.rests = s.rests || []; s.dailyMode = s.dailyMode || null; }
    if (v < 4) { s = Object.assign({}, s); s.facPrefs = s.facPrefs || null; s.tracking = Array.isArray(s.tracking) ? s.tracking : []; }
    if (v < 5) { s = Object.assign({}, s); s.v2 = s.v2 || null; s.migratedToV2 = true; }   // v2.0 の状態は、アプリ側で旧データから作る

  function create(opts) {
    const storage = opts.storage; const defaults = opts.defaults;
    function read(key) { try { return storage.getItem(key); } catch (e) { return null; } }
    function write(key, val) { try { storage.setItem(key, val); return true; } catch (e) { return false; } }
    function load() {
      const info = { source: 'seed', warnings: [] };
      const rawNew = read(KEY);
      if (rawNew) {
        try {
          const obj = JSON.parse(rawNew);
          if (!isObj(obj)) throw new Error('not-object');
          if (obj.schemaVersion > SCHEMA_VERSION) info.warnings.push('newer-schema');
          info.source = 'v' + (obj.schemaVersion || 1);
          return { state: sanitize(migrate(obj), defaults), info };
        } catch (e) {
          write(KEY + '-corrupt-' + Date.now(), rawNew);   // 退避
          info.warnings.push('corrupt');
        }
      }
      const rawOld = read(LEGACY_KEY);
      if (rawOld) {
        try {
          const obj = JSON.parse(rawOld);
          if (!isObj(obj)) throw new Error('not-object');
          const st = sanitize(migrate(obj), defaults);
          info.source = info.warnings.length ? 'recovered-from-v1' : 'migrated-v1';
          write(KEY, JSON.stringify(st));                  // 旧キーは残したまま新キーに保存
          return { state: st, info };
        } catch (e) { info.warnings.push('legacy-corrupt'); }
      }
      if (info.warnings.length) info.source = 'recovered-seed';
      return { state: sanitize(defaults(), defaults), info };
    }
    function save(state) {
      if (state && Array.isArray(state.events) && state.events.length > MAX_EVENTS) state.events = state.events.slice(-MAX_EVENTS);
      return write(KEY, JSON.stringify(state));
    }
    return { load, save };
  }

  NS.storage = { KEY, LEGACY_KEY, SCHEMA_VERSION, MAX_EVENTS, defaultProfile, defaultSleep, REST_TYPES, sanitize, migrate, migrateV1, create };
  if (typeof module !== 'undefined' && module.exports) module.exports = NS.storage;
})(typeof window !== 'undefined' ? window : globalThis);

/* ============================================================

 *  ※ ここに含まれる施設・案件・評価・料金・URL はすべて架空のサンプルです。

    ethnic:      { label: '各国料理レストラン', category: '飲食店', tags: ['restaurant_ethnic', 'restaurant'], price: [1000, 2500] },

  /* 決定的な疑似乱数（毎回同じサンプルを生成するため） */
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const z2 = (n) => String(n).padStart(2, '0');
  const ALL_DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

          });

  const expired = campaigns.find(c => facilities.find(f => f.facility_id === c.facility_id && f.type === 'climbing' && f.area === '渋谷'));

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ============================================================
 * NARA v2.0 時間別の提案エンジン（F02 / F03 / F04）
 *  - 条件を入れなくても、5分・30分・1時間・半日・1日の各枠に1つずつ提案

(function (global) {

/* ============================================================
 * NARA v2.0 ポイント・アイテム（F06〜F13）

(function (global) {

  const NS = global.NARA = global.NARA || {};

 *  装飾スロット：hat（帽子）／glasses（メガネ）／acc（アクセサリー）／outfit（服装）／bg（背景）／effect（エフェクト）

const CLOTH_STYLES = [[0, 'クルーネック'], [2, 'パーカー'], [3, '丸襟シャツ'], [5, 'ジップ']];
const BG_BASE = [0, 1, 2, 3, 8];   // BGS の単色背景（無料）
const EQUIP_SLOTS = ['hat', 'glasses', 'acc', 'outfit', 'bg', 'effect'];
const defAv = () => ({ v: 3, face: 0, skin: 1, hair: 1, hc: 0, brow: 0, eye: 0, mouth: 0, beard: 0, clothStyle: 0, clothColor: 0, bgBase: 0,
  equip: { hat: null, glasses: null, acc: null, outfit: null, bg: null, effect: null } });

/* 旧形式（v2）→ v3。以前選んでいたメガネ・背景・アイテムは「所有済み」として引き継ぐ（取り上げない） */
const V2_GLASS = [null, 'glass_round', 'glass_square', 'glass_sun', 'glass_thin', 'glass_small'];
const V2_ITEM = [null, 'hat_cap', 'hat_headphones', 'acc_pc', 'acc_coffee', 'acc_game', 'acc_camera', 'acc_book', 'acc_dog', 'acc_cat', 'acc_ball', 'acc_guitar', 'acc_plant'];
const V2_BG = { 4: 'bg_sky', 5: 'bg_sunset', 6: 'bg_mountain', 7: 'bg_check', 9: 'bg_dark' };
function toAv3(a) {
  if (a && a.v === 3) return { av: a, grants: [] };
  const d = defAv(); if (!a || typeof a !== 'object') return { av: d, grants: [] };
  const grants = [];
  ['face', 'skin', 'hair', 'hc', 'brow', 'eye', 'mouth', 'beard'].forEach(k => { if (typeof a[k] === 'number') d[k] = a[k]; });
  d.clothStyle = Math.max(0, CLOTH_STYLES.findIndex(s => s[0] === (FACES[d.face] || FACES[0]).cloth));
  d.clothColor = (FACES[d.face] || FACES[0]).cloth % CLOTH6.length;
  if (V2_GLASS[a.glass]) { d.equip.glasses = V2_GLASS[a.glass]; grants.push(V2_GLASS[a.glass]); }
  const it = V2_ITEM[a.item]; if (it) { if (it.startsWith('hat_')) d.equip.hat = it; else d.equip.acc = it; grants.push(it); }
  if (V2_BG[a.bg]) { d.equip.bg = V2_BG[a.bg]; grants.push(V2_BG[a.bg]); }
  else { const bi = BG_BASE.indexOf(a.bg); d.bgBase = bi >= 0 ? bi : 0; }
  return { av: d, grants };
}

function itemArt(id) { return ART[id] || null; }

function browColor(hc) { const c = HAIRC9[hc] || HAIRC9[0]; return lumC(c) > 140 ? darkC(c, 0.45) : darkC(c, 0.15); }
function avInner(a0) {
  const a = toAv3(a0).av;
  const eq = a.equip || {};
  const sk = SKIN6[a.skin] || SKIN6[1], F = FACES[a.face] || FACES[0], H = HAIRS[a.hair] || HAIRS[0];
  const P = hairPal(HAIRC9[a.hc] || HAIRC9[0]);
  const art = (slot) => { const id = eq[slot]; const A = id && ART[id]; return A ? A : null; };
  const L = (slot, layer) => { const A = art(slot); return A && A.layer === layer ? A.f(a, sk) : ''; };
  const all = (layer) => EQUIP_SLOTS.map(s => L(s, layer)).join('');
  const bgA = art('bg');
  const bg = bgA ? bgA.f(a, sk) : (BGS[BG_BASE[a.bgBase] || 0] || BGS[0]).f();
  const outfitA = art('outfit');
  const cs = CLOTH_STYLES[a.clothStyle] || CLOTH_STYLES[0];
  const body = outfitA ? outfitA.f(a, sk) : clothSVG(cs[0], CLOTH6[a.clothColor] || CLOTH6[0], sk);
  const skLine = darkC(sk, 0.22), skShade = darkC(sk, 0.1), ear = mixC(sk, '#E07B5F', 0.28);

  const earSVG = `<ellipse cx="${50 - ex}" cy="55.4" rx="4.7" ry="6" fill="${sk}" stroke="${skLine}" stroke-width=".7"/><path d="M${50 - ex + 1.6} 51.6C${50 - ex - 1.8} 52.6 ${50 - ex - 1.6} 58 ${50 - ex + 1.4} 59" fill="none" stroke="${ear}" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>`;
  const beardC = (a.hc >= 4 && a.hc !== 8) ? '#4A3326' : P.line;
  const hand = all('hand');
  return `${bg}${all('fxBack')}${H.back(P)}
    ${body}${all('body')}
    <path d="M44.6 66V81.4Q50 84.4 55.4 81.4V66Z" fill="${skShade}"/><path d="M44.6 72.6Q50 76.6 55.4 72.6V69H44.6Z" fill="${darkC(sk, 0.18)}" opacity=".45"/>
    ${earSVG}${MIR(earSVG)}
    <path d="${F.p}" fill="${sk}" stroke="${skLine}" stroke-width=".75"/>
    <ellipse cx="35" cy="60.2" rx="4.6" ry="2.7" fill="#F39A8C" fill-opacity=".22"/><ellipse cx="65" cy="60.2" rx="4.6" ry="2.7" fill="#F39A8C" fill-opacity=".22"/>
    <circle cx="50" cy="58.6" r=".95" fill="#E3957C"/>
    ${(BEARDS[a.beard] || BEARDS[0]).f(beardC)}${(MOUTHS[a.mouth] || MOUTHS[0]).f()}${(EYES[a.eye] || EYES[0]).f()}${(BROWS[a.brow] || BROWS[0]).f(browColor(a.hc))}
    ${all('face')}${H.front(P)}${all('glasses')}${all('hat')}${hand ? handWrap(hand) : ''}${all('fxFront')}`;
}
function avHTML(a, size, label, vb) {
  const px = size || 40;
  if (a === 'anon' || !a) return `<span class="avs" style="width:${px}px;height:${px}px;background:#E9ECEF" role="img" aria-label="${esc(label || '匿名')}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="44" r="19" fill="#B8BFC7"/><path d="M12 100C14 78 32 72 50 72S86 78 88 100Z" fill="#B8BFC7"/></svg></span>`;
  return `<span class="avs" style="width:${px}px;height:${px}px" role="img" aria-label="${esc(label || 'アイコン')}"><svg viewBox="${vb || '0 0 100 100'}" aria-hidden="true">${avInner(a)}</svg></span>`;
}
/* ショップ用：アイテムを試着したアバターのプレビュー */
function avWith(a, slot, id) { const b = JSON.parse(JSON.stringify(toAv3(a).av)); b.equip[slot] = id; return b; }

/* ---- アバターメーカー（無料の基本パーツ） ---- */
let makerTab = 'face';
const MAKER_TABS = [['face', '顔型'], ['skin', '肌'], ['hair', '髪型'], ['hc', '髪色'], ['eye', '目'], ['brow', '眉'], ['mouth', '口'], ['beard', 'ひげ'], ['clothStyle', '服'], ['clothColor', '服の色'], ['bgBase', '背景']];
function makerHTML(a0) {
  const a = toAv3(a0).av;
  const VB = { brow: '30 33 40 40', eye: '30 34 40 40', mouth: '32 46 36 36', beard: '24 42 52 52', clothStyle: '20 60 60 40' };
  const plain = Object.assign({}, a, { equip: { hat: null, glasses: null, acc: null, outfit: null, bg: null, effect: null } });
  const opt = (key, i, label, cur) => `<button class="mk ${VB[key] ? 'crop' : ''}" data-act="mk" data-key="${key}" data-v="${i}" aria-pressed="${cur === i}" aria-label="${esc(label)}">${avHTML(Object.assign({}, plain, { [key]: i }), VB[key] ? 64 : 56, label, VB[key])}</button>`;
  const sw = (key, i, col, label, cur) => `<button class="sw" data-act="mk" data-key="${key}" data-v="${i}" aria-pressed="${cur === i}" aria-label="${esc(label)}" style="background:${col}"></button>`;
  const lists = { face: FACES, hair: HAIRS, brow: BROWS, eye: EYES, mouth: MOUTHS, beard: BEARDS, clothStyle: CLOTH_STYLES.map(s => ({ n: s[1] })) };
  let body = '';
  if (makerTab === 'skin') body = `<div class="swrow">${SKIN6.map((c, i) => sw('skin', i, c, '肌の色', a.skin)).join('')}</div>`;
  else if (makerTab === 'hc') body = `<div class="swrow">${HAIRC9.map((c, i) => sw('hc', i, c, '髪の色', a.hc)).join('')}</div>`;
  else if (makerTab === 'clothColor') body = `<div class="swrow">${CLOTH6.map((c, i) => sw('clothColor', i, c, '服の色', a.clothColor)).join('')}</div>`;
  else if (makerTab === 'bgBase') body = `<div class="mkgrid">${BG_BASE.map((bi, i) => opt('bgBase', i, BGS[bi].n, a.bgBase)).join('')}</div>`;
  else { const Ls = lists[makerTab]; body = `<div class="mkgrid">${Ls.map((f, i) => opt(makerTab, i, f.n, a[makerTab])).join('')}</div>`; }
  return `<div class="mkprev" id="mkprev">${avHTML(a, 132, 'プレビュー')}</div>
    <div class="mktabs" role="tablist">${MAKER_TABS.map(t => `<button role="tab" data-act="mk-tab" data-v="${t[0]}" aria-selected="${makerTab === t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="mkbody">${body}</div>${a.equip && Object.values(a.equip).some(Boolean) ? '<p class="sub c" style="margin-top:12px">装飾アイテムは「ショップ」で付け外しできます</p>' : ''}`;
}

</script>
<script>
/* ============================================================
 * NARA アプリ v2.0 ―― 空いた時間に、いつもと違うことを。
 *  画面：ホーム（時間別の提案・条件設定）／体験詳細（確認・実行・完了）／マイページ（アバター・ポイント・履歴）
 *  原則：迷わせない・入力させない・すぐ行動できる
 *  旧版（v1）の画面は src/app/app-v1.js に残している（読み込みはしない）
 * ============================================================ */
const D = NARA.data, STORE = NARA.storage, SLP = NARA.sleep, G = NARA.suggest, RW = NARA.rewards, IT = NARA.items;
const FAC = NARA.facility, AFFDB = NARA.affiliateDB;
const _cfg = window.NARA_CONFIG || {};

/* ============ 状態 ============ */
function blankV2() {
  return { conds: { budget: null, time: null, level: null, place: null, area: '' }, condHistory: [], shown: [], completions: [], skips: [],
    ledger: [], owned: [], home: null, current: null, introSeen: false };
}
function seed() {
  return {
    schemaVersion: STORE.SCHEMA_VERSION, onboarded: true, nick: 'あなた', av: defAv(), theme: 'auto', sid: 100,
    records: [], later: [], events: [], profile: STORE.defaultProfile(), sleep: STORE.defaultSleep(), rests: [], dailyMode: null,
    plan: null, planned: null, facPrefs: null, tracking: [], moods: {}, customEvs: {}, v2: blankV2()
  };
}
function safeStorage() {
  try { const ls = window.localStorage; const k = '__nara_t'; ls.setItem(k, '1'); ls.removeItem(k); return ls; }
  catch (e) { const m = {}; return { getItem: (k) => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: (k) => { delete m[k]; } }; }
}
const store = STORE.create({ storage: safeStorage(), defaults: seed });
let S, loadInfo;
/* 旧データ（v1 の体験記録・アバター）を v2.0 に引き継ぐ。ポイントは過去分には付けない */
function migrateToV2() {
  const v2 = blankV2();
  (S.records || []).filter(r => r.kind === 'done' && !r.sample && r.g !== 'rest').forEach(r => {
    const e = D.byId(r.evId);
    v2.completions.push({ id: 'm' + r.id, evId: r.evId, title: r.t, category: e ? e.cat9 : 'その他', level: e ? e.level : 1,
      at: new Date(r.date + 'T12:00:00+09:00').toISOString(), date: r.date, points: 0, feeling: r.feeling || null, migrated: true });
  });
  const conv = toAv3(S.av); S.av = conv.av; v2.owned = conv.grants.slice();
  S.v2 = v2;
}
function load() {
  const r = store.load(); S = r.state; loadInfo = r.info;
  if (!S.v2 || S.migratedToV2) { migrateToV2(); delete S.migratedToV2; save(); }
  if (!S.av || S.av.v !== 3) { const c = toAv3(S.av); S.av = c.av; c.grants.forEach(g => { if (!S.v2.owned.includes(g)) S.v2.owned.push(g); }); }
  S.v2.conds = G.normConds(S.v2.conds);
}
function save() { store.save(S); }
load();
function applyTheme() { const r = document.documentElement; if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }
applyTheme();

const facDB = AFFDB.create({ storage: safeStorage(), domains: _cfg.affiliateDomains });
const facSvc = FAC.createFacilityService({ config: { endpoint: _cfg.placesEndpoint || null, timeoutMs: 8000, simulatePlacesError: !!_cfg.simulatePlacesError, affiliateDomains: _cfg.affiliateDomains }, db: facDB });
const MAX_TRACK = 2000;
function track(name, props) { S.tracking.push(Object.assign({ ts: new Date().toISOString(), name }, props || {})); if (S.tracking.length > MAX_TRACK) S.tracking = S.tracking.slice(-MAX_TRACK); }

/* ============ ユーティリティ ============ */
const todayStr = () => SLP.jstYmd();
const evById = (id) => D.byId(id) || (S.customEvs || {})[id] || null;
const yen = (n) => n.toLocaleString() + '円';
const costText = (c) => c === 0 ? '無料' : '約' + yen(c);
const levelText = (lv) => (D.LEVELS.find(l => l[0] === lv) || D.LEVELS[0])[1];
function durText(e) { const m = G.effMinutes(e); return m >= 360 ? '1日' : m >= 120 ? '半日くらい' : m >= 60 ? '約1時間' : `約${m}分`; }
const isRestToday = () => !!(S.dailyMode && S.dailyMode.date === todayStr() && S.dailyMode.mode === 'rest');
const balance = () => RW.balance(S.v2);
const ctxNow = () => ({ today: todayStr(), hour: SLP.jstHour(), seed: (S.v2.home && S.v2.home.seed) || 1, avoid: (S.profile && S.profile.avoid) || [] });
const hist = () => S.v2;

/* ============ アイコン ============ */
const I = (p, w) => `<svg viewBox="0 0 24 24" width="${w || 22}" height="${w || 22}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICO = {
  home: I('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>', 24), me: I('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4-6.5 8-6.5s7 2.3 8 6.5"/>', 24),
  back: I('<path d="M15 5l-7 7 7 7"/>', 24), x: I('<path d="M6 6l12 12M18 6L6 18"/>', 20), sliders: I('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>', 18),
  clock: I('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', 15), yen: I('<path d="M6 4l6 9 6-9M12 13v8M7.5 15.5h9M7.5 12h9"/>', 15), pin: I('<path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z"/><circle cx="12" cy="11" r="2.2"/>', 15),
  step: I('<path d="M5 19c2-6 5-9 14-14M14 5h5v5"/>', 15), moon: I('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', 18), lock: I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 14),
  check: I('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 16)
};
const CAT_ICON = {
  '食': '<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/>', '散歩・街歩き': '<path d="M13 4a2 2 0 1 0 0 .1M11 21l1.5-6-2.5-2 1-5 4 3 2 1M9 13l-2 8"/>',
  '音楽': '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>', 'アート・文化': '<path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.8 1.3-1.7-.5-1.4.3-2.3 1.7-2.3H18a3 3 0 0 0 3-3c0-6-4-11-9-11z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="11" r="1"/>',
  'スポーツ': '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/>', '学び': '<path d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5V19c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5z"/><path d="M12 6v13.5"/>',
  'お出かけ・旅行': '<path d="M3 13l18-7-7 18-2.5-8z"/>', 'リラックス': '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', 'その他': '<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>'
};
const catIcon = (c, w) => I(CAT_ICON[c] || CAT_ICON['その他'], w || 26);
const SLOT_COLOR = { '5': '#38B28A', '15': '#38B28A', '30': '#F2C230', '60': '#F28A2E', half: '#2F6FD6', day: '#7D86D4' };

/* ============ 提案（ホームのキャッシュ） ============ */
function homeKey() { return JSON.stringify(S.v2.conds); }
function ensureHome(force) {
  const t = todayStr(); const h = S.v2.home;
  if (!force && h && h.date === t && h.key === homeKey()) return h;
  const seedN = Math.floor(Math.random() * 1e9) + 1;
  S.v2.home = { date: t, key: homeKey(), seed: seedN, picks: {} };
  const res = G.home(S.v2.conds, hist(), Object.assign(ctxNow(), { seed: seedN }));
  res.slots.forEach(s => { S.v2.home.picks[s.k] = s.items.map(e => e.id); s.items.forEach(e => markShown(e.id, s.k)); });
  S.v2.home.focus = !!res.focus;
  save();
  return S.v2.home;
}
function markShown(evId, slot) {
  const t = todayStr();
  if (!S.v2.shown.some(x => x.evId === evId && x.date === t)) S.v2.shown.push({ evId, date: t, slot });
  if (S.v2.shown.length > 400) S.v2.shown = S.v2.shown.slice(-400);
}

/* ============ 画面の状態 ============ */
let tab = 'home', ov = null, toastT = null, lastOvKey = '';
let det = null;           // { evId, slot, seen:[ids] }
let doneInfo = null;      // 完了画面の情報
let condDraft = null;     // 条件シートの下書き
let shopCat = 'hat', confirmItem = null;
let fx = null, facDetail = null;
const root = document.getElementById('phone');

function toast(t) {
  clearTimeout(toastT); const old = root.querySelector('.toast'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.innerHTML = `<span>${esc(t)}</span>`;
  root.appendChild(d); toastT = setTimeout(() => d.remove(), 2400);
}

/* ============ 描画 ============ */
function render() {
  const sc = document.getElementById('scroll'); const top = sc ? sc.scrollTop : 0;
  root.setAttribute('data-app', 'v2');
  const body = tab === 'home' ? viewHome() : viewMe();
  root.innerHTML = `
    <header class="top v2top"><span class="wm">NARA</span>
      <button class="mini-me" data-act="tab" data-v="me" aria-label="マイページ（ポイント ${balance()}pt）"><span class="ptpill">${balance()}<small>pt</small></span>${avHTML(S.av, 32, 'アイコン')}</button></header>
    <main class="scroll" id="scroll">${body}</main>
    <nav class="tabbar two" aria-label="メニュー">${[['home', 'ホーム'], ['me', 'マイページ']].map(t => `<button class="tab" data-act="tab" data-v="${t[0]}" aria-label="${t[1]}" ${tab === t[0] ? 'aria-current="page"' : ''}>${ICO[t[0]]}<span class="tabl">${t[1]}</span><i></i></button>`).join('')}</nav>
    ${ov ? renderOverlay() : ''}`;
  const key = ov ? ov + ':' + (det ? det.evId : '') : '';
  if (key && key !== lastOvKey) { const el = root.querySelector('.overlay'); if (el) el.classList.add('enter'); }
  lastOvKey = key;
  const nsc = document.getElementById('scroll'); if (nsc) nsc.scrollTop = top;
}

/* ---- ホーム（F01〜F03） ---- */
function condSummary() {
  const c = S.v2.conds; const a = [];
  if (c.budget !== null) a.push((G.BUDGETS.find(b => b[0] === c.budget) || [])[1]);
  if (c.time) a.push(G.slotOf(c.time).label);
  if (c.level) a.push(levelText(c.level));
  if (c.place && c.place !== 'any') a.push(c.place === 'area' && c.area ? c.area : (G.PLACES.find(p => p[0] === c.place) || [])[1]);
  return a;
}
function card(e, slotKey, big) {
  const sl = G.slotOf(slotKey);
  return `<button class="scard ${big ? 'big' : 'small'}" data-act="open" data-v="${e.id}" data-slot="${slotKey}" style="--sc:${SLOT_COLOR[slotKey]}">
    <span class="sbadge">${sl.label}</span>
    <span class="sicon" aria-hidden="true">${catIcon(e.cat9, big ? 28 : 22)}</span>
    <span class="stitle">${esc(e.title)}</span>
    ${big ? `<span class="smeta">${costText(e.estimatedCost)}・${levelText(e.level)}</span>` : ''}
  </button>`;
}
function emptyCard(slotKey) {
  return `<div class="scard empty" style="--sc:${SLOT_COLOR[slotKey]}"><span class="sbadge">${G.slotOf(slotKey).label}</span><span class="stitle mut">この条件に合う提案がありません</span><button class="link" data-act="conds">条件を変える</button></div>`;
}
function viewHome() {
  const h = ensureHome(false);
  const cur = S.v2.current && evById(S.v2.current.evId);
  const sum = condSummary();
  const head = `<div class="hhead"><h1 class="hq">せっかくなら、何する？</h1><p class="hsub">空いた時間に、いつもと違うことを。</p></div>`;
  const doing = cur ? `<button class="doingbar" data-act="open-current"><b>体験中</b><span>${esc(cur.title)}</span><span class="chev">›</span></button>` : '';
  const rest = isRestToday() ? `<div class="restnote">${ICO.moon}<div><b>今日はゆっくりする日</b><span>気が向いたら、下の提案もどうぞ。</span></div></div>` : '';
  const condBar = `<div class="condbar"><button class="btn line sm condbtn" data-act="conds">${ICO.sliders}${sum.length ? '条件を変更' : '条件を設定する'}</button>${sum.length ? `<span class="condsum">${esc(sum.join('・'))}</span><button class="ib" data-act="cond-clear" aria-label="条件をリセット">${ICO.x}</button>` : ''}</div>`;
  let list = '';
  if (h.focus) {
    const k = Object.keys(h.picks)[0]; const ids = h.picks[k] || [];
    list = `<h2 class="sec2">${G.slotOf(k).label}でできること</h2><div class="cards">${ids.length ? ids.map(id => evById(id)).filter(Boolean).map(e => card(e, k, true)).join('') : emptyCard(k)}</div>`;
  } else {
    const main = ['5', '30', '60'].map(k => { const e = evById((h.picks[k] || [])[0]); return e ? card(e, k, true) : emptyCard(k); }).join('');
    const sub = ['half', 'day'].map(k => { const e = evById((h.picks[k] || [])[0]); return e ? card(e, k, false) : emptyCard(k); }).join('');
    const late = SLP.jstHour() >= 15 ? '次のお休みに' : '時間があるなら';
    list = `<div class="cards">${main}</div><h2 class="sec2">${late}</h2><div class="cards two">${sub}</div>`;
  }
  return `<div class="home2">${head}${doing}${rest}${condBar}${list}
    <div class="restline2"><button class="btn ghost" data-act="rest">${ICO.moon}今日は休む</button></div></div>`;
}

/* ---- マイページ（F09〜F13） ---- */
function itemState(it) {
  const owned = S.v2.owned.includes(it.id); const on = S.av.equip && S.av.equip[it.cat] === it.id;
  if (on) return { k: 'on', t: '装着中' };

/* ============ 操作 ============ */
function openDetail(evId, slot) { det = { evId, slot, seen: [evId] }; ov = 'detail'; render(); }
function startCurrent(facility) {
  const e = evById(det.evId);
  S.v2.current = { evId: e.id, slot: det.slot, startedAt: new Date().toISOString(), facility: facility || null };
  track('experience_started', { evId: e.id, slot: det.slot, facility_id: facility ? facility.facility_id : null });
  save(); ov = 'detail'; render();
}
function finishCurrent() {
  const e = evById(det.evId); const cur = S.v2.current || {};
  const res = RW.complete(S.v2, e, { date: todayStr(), slot: det.slot, facility: cur.facility || null });
  S.v2.current = null;
  track('experience_completed', { evId: e.id, points: res.points, facility_id: cur.facility ? cur.facility.facility_id : null });
  // 完了した枠は新しい提案に入れ替える
  if (S.v2.home && S.v2.home.picks[det.slot]) { const nx = G.another(det.slot, S.v2.conds, hist(), ctxNow(), [e.id]); S.v2.home.picks[det.slot] = nx ? [nx.id] : []; if (nx) markShown(nx.id, det.slot); }
  doneInfo = { recId: res.record.id, points: res.points, reason: res.reason, newlyUnlocked: res.newlyUnlocked, feeling: null };
  save(); ov = 'done'; render();
}

async function handle(t) {
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'tab': tab = v; ov = null; render(); break;
    case 'open': openDetail(parseId(v), t.dataset.slot); break;
    case 'open-current': { const c = S.v2.current; if (c) openDetail(c.evId, c.slot); break; }
    case 'detail-close': ov = null; det = null; render(); break;
    case 'start': track('experience_selected', { evId: det.evId, slot: det.slot }); startCurrent(null); break;
    case 'done': finishCurrent(); break;
    case 'quit': {
      const e = evById(det.evId); S.v2.skips.push({ evId: e.id, category: e.cat9, date: todayStr(), at: new Date().toISOString() });
      S.v2.current = null; save(); ov = null; det = null; render(); toast('また気が向いたときに。何も減りません'); break;
    }
    case 'another': {
      const nx = G.another(det.slot, S.v2.conds, hist(), ctxNow(), det.seen);
      if (!nx) { toast('この時間で出せる提案は、いまはここまでです'); break; }
      det.evId = nx.id; det.seen.push(nx.id); markShown(nx.id, det.slot);
      if (S.v2.home && S.v2.home.picks[det.slot] && !S.v2.home.focus) S.v2.home.picks[det.slot] = [nx.id];
      save(); render(); break;
    }
    case 'conds': case 'conds-from-detail': condDraft = Object.assign({}, S.v2.conds); ov = 'conds'; render(); break;
    case 'conds-close': ov = null; render(); break;
    case 'cd-budget': condDraft.budget = v === 'null' ? null : +v; render(); break;
    case 'cd-time': condDraft.time = v === 'null' ? null : v; render(); break;
    case 'cd-level': condDraft.level = v === 'null' ? null : +v; render(); break;
    case 'cd-place': condDraft.place = v === 'null' ? null : v; render(); break;
    case 'cond-reset': condDraft = { budget: null, time: null, level: null, place: null, area: '' }; render(); break;
    case 'cond-apply': {
      const inp = document.getElementById('cd-area'); if (inp) condDraft.area = inp.value.trim();
      S.v2.conds = G.normConds(condDraft); S.v2.condHistory.push(Object.assign({ at: new Date().toISOString() }, S.v2.conds));
      if (S.v2.condHistory.length > 50) S.v2.condHistory = S.v2.condHistory.slice(-50);
      ensureHome(true); ov = null; det = null; tab = 'home'; render(); break;
    }
    case 'cond-clear': S.v2.conds = G.normConds({}); ensureHome(true); render(); break;
    case 'feel': { doneInfo.feeling = v; const r = S.v2.completions.find(c => c.id === doneInfo.recId); if (r) r.feeling = v; save(); render(); break; }
    case 'done-close': ov = null; det = null; doneInfo = null; tab = 'home'; render(); break;
    case 'done-me': ov = null; det = null; doneInfo = null; tab = 'me'; render(); break;
    case 'rest': ov = 'rest'; render(); break;
    case 'rest-close': ov = null; render(); break;
    case 'rest-ok': {
      if (!isRestToday()) S.rests.push({ id: 'rest-' + (++S.sid), userId: 'local', date: todayStr(), selectedAt: new Date().toISOString(), hour: SLP.jstHour(), restType: 'free', status: 'planned', reflection: '', modeUsed: true });
      S.dailyMode = { date: todayStr(), mode: 'rest', line: 0 }; save(); ov = null; render(); toast('今日はゆっくりする日。いい一日を。'); break;
    }
    /* マイページ・ショップ */
    case 'shopcat': shopCat = v; render(); break;
    case 'item': {
      const it = IT.byId(v); const s = itemState(it);
      if (s.k === 'on' || s.k === 'owned') { RW.toggleEquip(S.av, S.v2, it.id); save(); render(); break; }
      if (s.k === 'locked') { toast(s.t); break; }
      if (balance() < it.price) { toast(`あと${it.price - balance()}pt で交換できます`); break; }
      confirmItem = it.id; ov = 'confirm'; render(); break;
    }
    case 'buy': {
      const r = RW.purchase(S.v2, v, { date: todayStr() });
      if (!r.ok) { toast({ owned: 'すでに持っています', locked: 'まだ解放されていません', insufficient: 'ポイントが足りません', unknown: 'アイテムが見つかりません' }[r.error]); ov = null; render(); break; }
      RW.toggleEquip(S.av, S.v2, v); track('item_exchanged', { item: v }); save(); confirmItem = null; ov = null; render(); toast('交換しました'); break;
    }
    case 'confirm-close': confirmItem = null; ov = null; render(); break;
    case 'maker': ov = 'maker'; render(); break;
    case 'maker-close': ov = null; save(); render(); break;
    case 'mk-tab': makerTab = v; document.getElementById('maker').innerHTML = makerHTML(S.av); break;
    case 'mk': { const key = t.dataset.key; S.av[key] = +v; save(); const m = document.getElementById('maker'); if (m) m.innerHTML = makerHTML(S.av); break; }
    case 'theme': S.theme = v; applyTheme(); save(); render(); break;
    case 'reset': if (!window._ra) { window._ra = true; toast('もう一度押すと、最初からやり直します'); setTimeout(() => { window._ra = false; }, 3000); } else { window._ra = false; S = seed(); save(); applyTheme(); tab = 'home'; ov = null; render(); } break;
    /* 施設 */
    case 'fac-open': openFacility(); break;
    case 'fac-close': fx = null; ov = 'detail'; render(); break;
    case 'fac-back': if (fx.step === 'results') { fx.step = 'where'; render(); } else { fx = null; ov = 'detail'; render(); } break;
    case 'fac-geo': {
      fx.geo = 'busy'; render();
      try { fx.loc = await FAC.getCurrentPosition(navigator.geolocation); fx.geo = 'ok'; } catch (err) { fx.geo = err.message === 'denied' ? 'denied' : 'unavailable'; }
      render(); break;
    }
    case 'fac-area': {
      const inp = document.getElementById('fac-area'); fx.areaQ = inp ? inp.value.trim() : fx.areaQ; if (!fx.areaQ) break;
      try { fx.areaRes = await facSvc.geocode(fx.areaQ); } catch (err) { fx.areaRes = []; }
      if (fx.areaRes.length === 1) { fx.loc = fx.areaRes[0]; S.facPrefs = { label: fx.loc.label, lat: FAC.roundCoord(fx.loc.lat), lng: FAC.roundCoord(fx.loc.lng), source: 'area', range: fx.range }; save(); }
      render(); break;
    }
    case 'fac-area-pick': { const r = fx.areaRes[+v]; if (r) { fx.loc = r; S.facPrefs = { label: r.label, lat: FAC.roundCoord(r.lat), lng: FAC.roundCoord(r.lng), source: 'area', range: fx.range }; save(); } render(); break; }
    case 'fac-range': fx.range = v; render(); break;
    case 'fac-search': if (fx.loc && !fx.busy) await runFacilitySearch(); break;
    case 'fac-sort': fx.sort = v; fx.items = FAC.sortItems(fx.items, v); fx.page = 0; render(); break;
    case 'fac-more': fx.page++; render(); break;
    case 'fac-other': { fx = null; ov = 'detail'; await handle({ dataset: { act: 'another' } }); break; }
    case 'fac-detail': { const f = facById(v); if (!f) break; facDetail = f; track('facility_clicked', { evId: fx.evId, facility_id: f.facility_id, affiliate_id: f.campaign ? f.campaign.affiliate_id : null }); save(); ov = 'facdetail'; render(); break; }
    case 'fac-detail-close': ov = 'fac'; render(); break;
    case 'fac-link': {
      const f = facById(v) || facDetail; if (!f) break; const ty = t.dataset.type;
      const url = ty === 'affiliate' ? f.campaign && f.campaign.affiliate_url : ty === 'maps' ? f.maps_url : f.official_url; if (!url) break;
      if (ty === 'affiliate' && !AFFDB.allowedUrl(url, _cfg.affiliateDomains)) { toast('このリンクは表示できません'); break; }
      const base = { evId: fx && fx.evId, facility_id: f.facility_id, affiliate_id: f.campaign ? f.campaign.affiliate_id : null };
      if (ty === 'affiliate') { track('affiliate_clicked', base); track('reservation_clicked', base); } else track(ty === 'maps' ? 'maps_clicked' : 'official_clicked', base);
      save();
      if (f.demo) toast('デモのため外部サイトには移動しません'); else if (typeof window.open === 'function') window.open(url, '_blank', 'noopener,noreferrer');
      break;
    }
    case 'fac-use': { const f = facById(v) || facDetail; const snap = f ? { facility_id: f.facility_id, name: f.facility_name, affiliate_id: f.campaign ? f.campaign.affiliate_id : null, demo: !!f.demo } : null; fx = null; facDetail = null; track('experience_selected', { evId: det.evId, via: 'facility' }); startCurrent(snap); break; }
  }
}
root.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t || t.disabled) return;
  return handle(t).catch(err => { console.error(err); toast('うまく処理できませんでした。もう一度お試しください'); });
});
root.addEventListener('input', (e) => {
  if (e.target.id === 'nick') { S.nick = e.target.value.trim() || 'あなた'; save(); }
  if (e.target.id === 'cd-area' && condDraft) condDraft.area = e.target.value;
  if (e.target.id === 'fac-area' && fx) fx.areaQ = e.target.value;
});
render();
if (loadInfo && loadInfo.warnings.includes('corrupt')) toast('保存データを読み込めなかったため、復旧しました');

window.NARA_APP = { get state() { return S; }, handle, render, save, get ov() { return ov; }, get tab() { return tab; }, get det() { return det; }, get doneInfo() { return doneInfo; }, ensureHome, facSvc, facDB };

</script>
</body>
</html>
