<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>NARA（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* NARA 既存スタイル（元 NARA.html から無変更で切り出し） */
:root {
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #FFFFFF; --ink: #111418; --muted: #8A9099; --soft: #F5F6F8; --line: #ECEEF1; --btn: #111418; --btn-ink: #FFFFFF; --page: #EDEFF2;
  --shadow: 0 10px 30px rgba(17, 20, 24, .07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1013; --ink: #F2F4F6; --muted: #8B929B; --soft: #171A1E; --line: #23272C; --btn: #F2F4F6; --btn-ink: #111418; --page: #07080A; --shadow: 0 10px 30px rgba(0, 0, 0, .4); } }
:root[data-theme="dark"] { --bg: #0E1013; --ink: #F2F4F6; --muted: #8B929B; --soft: #171A1E; --line: #23272C; --btn: #F2F4F6; --btn-ink: #111418; --page: #07080A; --shadow: 0 10px 30px rgba(0, 0, 0, .4); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.7; font-weight: 500; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent, #111418); outline-offset: 3px; border-radius: 14px; }
button:disabled { cursor: default; }
img { display: block; }
.phone { --accent: #111418; --on-accent: #fff; position: relative; width: 100%; max-width: 430px; height: 100%; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 520px) { body { display: flex; align-items: center; justify-content: center; } .phone { height: min(880px, 100%); border-radius: 36px; box-shadow: 0 30px 80px rgba(17, 20, 24, .18); border: 1px solid var(--line); } }

.top { flex: none; padding: 18px 28px 0; min-height: 44px; }
.wm { font-weight: 900; font-size: 13px; letter-spacing: .32em; color: var(--muted); }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 28px 56px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 12px 8px; border-top: 1px solid var(--line); background: var(--bg); }
.tab { position: relative; display: grid; place-items: center; min-height: 56px; color: var(--muted); transition: color .2s, transform .15s; }
.tab:active { transform: scale(.88); }
.tab i { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] i { transform: scale(1); }

/* character */
.nara { display: block; margin: 0 auto; overflow: visible; }
.nara .cb { fill: var(--c); transition: fill .55s ease; } .nara .cs { fill: var(--s); transition: fill .55s ease; } .nara .cst { stroke: var(--c); transition: stroke .55s ease; }
.nara.idle { animation: bob 3.4s ease-in-out infinite; }
.nara .tail { transform-origin: 90px 38px; animation: tailw 2.6s ease-in-out infinite; }
.nara .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.nara .wv { transform-origin: 108px 62px; animation: wave 1.1s ease-in-out infinite; }
.nara.hop { animation: hop .7s cubic-bezier(.3, .8, .4, 1); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes tailw { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(8deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-16deg); } }
@keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 25% { transform: translateY(0) scale(1.1, .88); } 55% { transform: translateY(-16px) scale(.94, 1.08); } 80% { transform: translateY(0) scale(1.06, .94); } 100% { transform: scale(1); } }

/* home */
.home { padding-top: 6px; }
.hero { display: flex; justify-content: center; min-height: 40px; margin-top: 8px; }
.q { font-size: 24px; font-weight: 900; text-align: center; margin: 28px 0 24px; letter-spacing: .02em; }
.moods { display: flex; justify-content: center; gap: 12px; }
.md { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; }
.md i { display: block; width: 36px; height: 36px; border-radius: 12px; background: var(--mc); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1), box-shadow .25s; }
.md:active i { transform: scale(.85); }
.md[aria-pressed="true"] i { transform: scale(1.3); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--mc); }
.mk-md { display: grid; } .mk-md.sel i { transform: scale(1.3); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--mc); }
.moodname { text-align: center; color: var(--muted); font-weight: 700; height: 28px; margin-top: 12px; }
.cta { width: 100%; min-height: 60px; border-radius: 20px; background: var(--btn); color: var(--btn-ink); font-size: 17px; font-weight: 900; letter-spacing: .04em; display: flex; align-items: center; justify-content: center; margin-top: 20px; transition: transform .15s, opacity .3s; }
.cta:active:not(:disabled) { transform: scale(.97); }
.cta:disabled { opacity: .18; }
.cta.ready { animation: ctaIn .5s cubic-bezier(.3, 1.5, .5, 1) both, ring 2.4s ease-out 1s infinite; }
@keyframes ctaIn { from { transform: scale(.94); } to { transform: scale(1); } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 16px transparent; } }
.btn { min-height: 48px; padding: 0 20px; border-radius: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s, background .25s, color .25s; white-space: nowrap; }
.btn:active { transform: scale(.94); }
.btn.dark { background: var(--btn); color: var(--btn-ink); } .btn.line { border: 1.5px solid var(--line); background: var(--bg); }
.btn.ghost { color: var(--muted); } .btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; } .btn.big { min-height: 56px; font-size: 16px; }
.btn.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn[aria-pressed="true"].big { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.pop { animation: popb .5s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes popb { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.acts { display: flex; gap: 10px; margin-top: 18px; } .acts .btn { flex: 1; }
.sec { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .12em; margin: 48px 0 14px; }
.sub { color: var(--muted); font-size: 13px; } .c { text-align: center; } .mut { color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.sugs { margin-top: 40px; display: grid; gap: 16px; }
.sug { background: var(--soft); border-radius: 28px; padding: 28px 24px 24px; }
.sug.anim { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; } .sug.dim { opacity: .6; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.sug h3, .post h3 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.5; }
.hk { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.mis { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; color: var(--muted); font-size: 13px; font-weight: 700; } .mis.c { justify-content: center; }
.mi { display: inline-flex; align-items: center; gap: 5px; }
.done-tag { margin-top: 16px; font-weight: 900; }
.again { text-align: center; margin-top: 4px; }
.doing { background: var(--soft); border-radius: 24px; padding: 20px 22px; margin-top: 8px; }
.rows { display: grid; } .row2 { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; }
.btnrow { width: 100%; } .rt { font-weight: 900; line-height: 1.5; } .rs { color: var(--muted); font-size: 13px; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 12px; } .chev { color: var(--muted); font-size: 22px; }
.dots3 { display: flex; gap: 6px; margin-top: 8px; } .dots3 i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); } .dots3 i.on { background: var(--accent); }
.week { display: flex; justify-content: space-between; } .week i { width: 30px; height: 30px; border-radius: 10px; background: var(--soft); } .week i.on { background: var(--accent); } .week i.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .bar b { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s; }

/* feed */
.page { padding-top: 6px; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 6px -28px 8px; padding: 6px 28px; scrollbar-width: none; } .filters::-webkit-scrollbar { display: none; }
.fl { flex: none; min-height: 40px; padding: 0 16px; border-radius: 20px; font-weight: 700; color: var(--muted); background: var(--soft); }
.fl[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.post { padding: 28px 0 26px; border-bottom: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; } .who b { font-weight: 900; }
.tag { margin-left: 8px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 8px; background: var(--soft); color: var(--muted); }
.lvt { font-size: 12px; color: var(--muted); font-weight: 700; }
.note { margin: 8px 0 0; color: var(--muted); }
.post > .btn { margin-top: 18px; }
.nice { flex: 1; min-height: 48px; border-radius: 16px; border: 1.5px solid var(--line); font-weight: 900; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, background .25s, color .25s; }
.nice:active { transform: scale(.94); }
.cube { width: 15px; height: 15px; border-radius: 5px; background: var(--muted); transition: background .25s; display: inline-block; }
.nice[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.nice[aria-pressed="true"] .cube { background: var(--on-accent); }
.bst { position: absolute; width: 8px; height: 8px; border-radius: 3px; pointer-events: none; z-index: 70; animation: burst .7s ease-out forwards; }
@keyframes burst { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2) rotate(120deg); opacity: 0; } }

/* log */
.count { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 20px; } .count b { font-size: 56px; font-weight: 900; line-height: 1; } .count span { color: var(--muted); font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tile { display: block; aspect-ratio: 1; border-radius: 28%; } .tile.empty { background: var(--soft); } .tile.pop { animation: tilepop .8s cubic-bezier(.3, 1.8, .5, 1) .2s both; }
@keyframes tilepop { from { transform: scale(0) rotate(-20deg); } to { transform: none; } }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; } .cal .w { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; } .cal i { display: block; }
.cal-d { position: relative; aspect-ratio: 1; border-radius: 28%; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.cal-d.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); } .cal-d b { position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.insight { display: flex; align-items: baseline; gap: 12px; margin-top: 32px; } .insight b { font-size: 36px; font-weight: 900; } .insight span { color: var(--muted); font-size: 13px; }
.tl { list-style: none; margin: 0; padding: 0; } .tl li { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.dotc { width: 14px; height: 14px; border-radius: 5px; flex: none; }
.pubb { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 12px; background: var(--soft); color: var(--muted); } .pubb[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

/* me */
.me-prof { width: 100%; display: flex; align-items: center; gap: 18px; padding: 16px 0; text-align: left; } .me-prof b { font-size: 20px; }
.seg { display: flex; gap: 6px; padding: 5px; background: var(--soft); border-radius: 18px; } .seg button { flex: 1; min-height: 46px; border-radius: 14px; font-weight: 700; font-size: 14px; color: var(--muted); transition: background .25s, color .25s; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 2px 8px rgba(17, 20, 24, .08); }

/* overlays */
.overlay { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20; }
.overlay.enter { animation: oin .38s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes oin { from { transform: translateY(22px); } to { transform: none; } }
.ohead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; min-height: 60px; } .back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: var(--ink); } .ottl { font-weight: 900; flex: 1; text-align: center; padding-right: 44px; }
.ibody { flex: 1; overflow-y: auto; padding: 8px 28px 24px; } .ibody.c { text-align: center; }
.ifoot { flex: none; padding: 8px 28px calc(24px + env(safe-area-inset-bottom, 0px) * 0); } .ifoot .cta { margin-top: 14px; }
.it { font-size: 28px; font-weight: 900; line-height: 1.4; margin: 20px 0 26px; } .it.c { text-align: center; } .tt { text-align: center; color: var(--muted); margin: -12px 0 0; }
.pages { display: flex; justify-content: center; gap: 6px; } .pages i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .3s, background .3s; } .pages i.on { width: 20px; background: var(--ink); } .pages.inline { flex: 1; }
.txt { width: 100%; min-height: 56px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 18px; font: inherit; font-size: 16px; }
.bigopts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; } .bo { min-height: 104px; border-radius: 24px; background: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-weight: 700; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background .2s, color .2s; color: var(--ink); }
.bo:active { transform: scale(.94); } .bo[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); transform: scale(1.03); }
.bigopts.mini { grid-template-columns: repeat(4, 1fr); gap: 8px; } .bigopts.mini .bo { min-height: 80px; font-size: 12px; border-radius: 18px; } .bigopts.mini .bo svg { width: 22px; height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; } .chips.c { justify-content: center; } .chp { min-height: 48px; padding: 0 20px; border-radius: 16px; background: var(--soft); font-weight: 700; transition: background .2s, color .2s, transform .2s cubic-bezier(.3, 1.6, .5, 1); } .chp:active { transform: scale(.94); } .chp[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.lab { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin: 30px 0 12px; } .lab.c { text-align: center; }
.stack { display: grid; gap: 12px; } .pace { text-align: left; padding: 22px; border-radius: 24px; background: var(--soft); display: grid; gap: 2px; transition: background .2s, color .2s; } .pace span { font-size: 13px; opacity: .7; } .pace b { font-size: 18px; } .pace[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.row3 { display: flex; gap: 10px; align-items: center; } .row3 .cta { margin-top: 0; }
.mini-nara { height: 76px; display: flex; justify-content: center; margin-bottom: 4px; }
.tutchar { display: flex; justify-content: center; min-height: 24px; margin-top: 8px; } .tutm { min-height: 240px; display: grid; align-content: center; gap: 22px; margin-top: 12px; }
.tuthead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 0 28px; min-height: 56px; } .tuthead button { min-height: 44px; padding: 0 8px; font-weight: 700; color: var(--muted); }
.tutbody { flex: 1; overflow-y: auto; padding: 0 28px 12px; }
.mini.sug, .mini.post { padding: 20px; border-radius: 22px; border: 0; } .mini.post { background: var(--soft); }
.tiles.mini { max-width: 260px; margin: 0 auto; }
.timer { font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; margin: 8px 0 4px; letter-spacing: .02em; }
.bignum { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 12px; } .bignum .tile { width: 44px; } .bignum b { font-size: 64px; font-weight: 900; line-height: 1; }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px 10px 20px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 80; animation: toastin .35s cubic-bezier(.3, 1.4, .5, 1) both; max-width: 92%; display: flex; gap: 14px; align-items: center; white-space: nowrap; }
.toast button { font-weight: 900; color: var(--bg); text-decoration: underline; min-height: 32px; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
.confetti { position: absolute; top: -10px; width: 9px; height: 13px; border-radius: 3px; animation: fall 1.8s ease-in forwards; z-index: 90; pointer-events: none; } @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

/* splash */
.splash { background: #111418; color: #fff; z-index: 30; }
.splash .box { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 32px 20px; gap: 34px; }
.splash .ln { opacity: 0; animation: lnIn .55s cubic-bezier(.2, .7, .2, 1) forwards; font-weight: 700; line-height: 1.6; }
.splash .l1 { font-size: 27px; font-weight: 900; line-height: 1.55; animation-delay: .2s; }
.splash .l2 { font-size: 17px; color: #A9B1BA; animation-delay: .8s; }
.splash .l3 { font-size: 34px; font-weight: 900; line-height: 1.5; animation-delay: 1.4s; }
.splash .em { position: relative; display: inline-block; background: linear-gradient(90deg, #2F6FD6, #38B28A, #F2C230, #F28A2E); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
.splash .em::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #2F6FD6, #38B28A, #F2C230, #F28A2E); transform: scaleX(0); transform-origin: left; animation: uline .6s cubic-bezier(.3, .8, .2, 1) 1.9s forwards; }
.splash .l4 { display: flex; align-items: baseline; gap: 12px; animation-delay: 2.1s; }
.splash .l4 b { font-size: 22px; font-weight: 900; letter-spacing: .34em; }
.splash .l4 span { font-size: 14px; color: #A9B1BA; letter-spacing: .2em; }
@keyframes uline { to { transform: scaleX(1); } }
.splash .ctaw { opacity: 0; animation: lnIn .5s ease forwards; animation-delay: 2.5s; padding: 0 28px calc(28px + env(safe-area-inset-bottom, 0px) * 0); }
.splash .cta { background: #fff; color: #111418; margin-top: 0; }
.splash.skip .ln, .splash.skip .ctaw { animation: none; opacity: 1; transform: none; filter: none; }
.splash.skip .em::after { animation: none; transform: scaleX(1); }
@keyframes lnIn { from { opacity: 0; transform: translateY(14px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }

/* avatar + maker */
.avs { display: inline-block; border-radius: 50%; overflow: hidden; flex: none; vertical-align: middle; } .avs svg { display: block; width: 100%; height: 100%; }
.mkprev { display: flex; justify-content: center; margin: 22px 0 18px; }
.mktabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -28px; padding: 0 28px; } .mktabs::-webkit-scrollbar { display: none; } .mktabs button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 14px; font-weight: 700; font-size: 14px; color: var(--muted); } .mktabs button[aria-selected="true"] { background: var(--soft); color: var(--ink); }
.mkbody { margin-top: 18px; min-height: 150px; }
.mkgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-items: center; } .mk { border-radius: 50%; padding: 3px; border: 3px solid transparent; line-height: 0; min-width: 48px; min-height: 48px; } .mk[aria-pressed="true"] { border-color: var(--ink); }
.swrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; justify-items: center; } .sw { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(17, 20, 24, .12); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); } .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); transform: scale(1.1); }

  const LOCATION_LABEL = { home: 'おうち', near: '近所', far: '少し遠く' };
  const split = (s, d) => (s ? String(s).split(d).map(x => x.trim()).filter(Boolean) : []);

  /* 旧データ構造 → Experience 型（＋旧UI互換のエイリアス） */
  function normalize(r) {
    const [id, cat, title, min, pl, cost, diff, nov, soc, en, tags, sur, exc, flags, mLv, k, d, steps, notes] = r;
    const f = split(flags, ',');
    return {
      /* Experience 型 */
      id, title, description: d, category: cat, categoryLabel: CATEGORIES[cat],
      durationMinutes: min, estimatedCost: cost, locationType: pl,
      difficulty: diff, noveltyLevel: nov, socialLevel: soc,
      interestTags: split(tags, ','), surpriseTags: split(sur, ','), exclusionTags: split(exc, ','),
      steps: split(steps, '|'), safetyNotes: split(notes, '|'),
      requiresReservation: f.includes('r'), requiresVerification: f.includes('v'),
      /* 追加属性 */
      energy: en, outdoor: f.includes('o'), nightOk: f.includes('n'), planAhead: f.includes('p'),
      masakaLevel: mLv || 0, hook: k, riskTags: [],
      /* 旧UI互換（t,g,min,pl,cost,lv,en,k,d,tip,out,soc） */
      t: title, g: cat, min, pl, cost, lv: diff, en, k, d, tip: split(notes, '|')[0] || '', out: f.includes('o') ? 1 : 0,
      soc: soc === 'group' ? 1 : 0, pr: f.includes('r') ? 1 : 0, wild: id >= 200 && id < 300 ? 1 : 0
    };
  }

  /* 外部（AI API など）から来た体験データを Experience 型に寄せる変換 */
  function fromExternal(x) {
    if (!x || typeof x !== 'object') return null;
    const arr = (v) => Array.isArray(v) ? v.map(String) : [];
    const num = (v, def) => (typeof v === 'number' && isFinite(v) ? v : def);
    const clamp3 = (v) => Math.min(3, Math.max(1, Math.round(num(v, 2))));
    const cat = CATEGORIES[x.category] ? x.category : 'touch';
    const pl = ['home', 'near', 'far'].includes(x.locationType) ? x.locationType : 'far';
    const e = normalize([String(x.id || 'ext-' + Math.random().toString(36).slice(2, 8)), cat, String(x.title || ''), num(x.durationMinutes, 9999),
      pl, num(x.estimatedCost, 999999), clamp3(x.difficulty), clamp3(x.noveltyLevel),
      ['solo', 'group', 'either'].includes(x.socialLevel) ? x.socialLevel : 'either', clamp3(x.energy || x.difficulty),
      arr(x.interestTags).join(','), arr(x.surpriseTags).join(','), arr(x.exclusionTags).join(','),
      [x.requiresReservation ? 'r' : '', x.requiresVerification !== false ? 'v' : '', 'p'].filter(Boolean).join(','),
      Math.min(3, Math.max(0, Math.round(num(x.masakaLevel, 0)))), String(x.hook || ''), String(x.description || ''),
      arr(x.steps).join('|'), arr(x.safetyNotes).join('|')]);
    e.riskTags = arr(x.riskTags); e.external = true;
    return e;
  }

      if (learned.length) return `前に楽しめた「${TAG_LABEL[learned[0]] || learned[0]}」の流れで、もう一歩。`;
      if (profile.social === 'solo' && e.socialLevel === 'solo') return 'ひとりでゆっくり過ごすのが好きなあなたに、いつもと少し違う時間を。';
      if (liked.length) return `${TAG_LABEL[liked[0]]}が好きなあなたに、ちょうどいい${timeLabel(e.durationMinutes)}。`;
      if (profile.social === 'group' && e.socialLevel !== 'solo') return '誰かと過ごすのが好きなあなたに、気軽な「初めて」を。';
      return `いまの気分と${timeLabel(ctx.time)}に、無理なく合う「初めて」を。`;
    }
    if (slot === 'stretch') {
      if (profile.range === 'home' && e.locationType !== 'home') return '普段はおうち時間が多いなら、今日は少しだけ外へ。';
      if (profile.social === 'solo' && e.socialLevel !== 'solo') return '普段はひとりの時間が多いから、今日は少しだけ新しい刺激を。';
      if (liked.length && !(L.doneCats[e.category])) return `${TAG_LABEL[liked[0]]}が好きなあなたなら、ここから一歩だけ広げてみるのもいいかも。`;
      if (profile.openness === 'careful') return '無理のない範囲で、少しだけ新しい刺激を。';
      return 'いつもの好みの、すぐとなりにある「初めて」を。';
    }
    if (L.masakaSuccess) return '前の「まさか」を楽しめたあなたに、もうひとつ。';
    if (e.masakaLevel >= 3) return 'まったくの想定外かもしれない。だからこそ、1回だけ試す価値がありそう。';
    if (e.masakaLevel === 1) return 'いつもを少しだけずらすと、見える景色が変わるかも。';
    return 'いつものあなたなら選ばないかもしれない。でも、やってみたら新しい発見がありそう。';
  }

  /* ---- 候補不足時の案内（条件は勝手に緩めない） ---- */
  const SUGGEST = {
    budget: '予算を上げる', time: '時間を長くする', place: '場所を広げる', genre: 'ジャンルを「おまかせ」にする',
    companion: '同行者を「どちらでも」にする', difficulty: '「わたし」でペースを上げる', 'needs-planning': 'タイミングを「今日」や「別の日」にする',
    'late-night': '明日以降の予定にする', 'time-window': 'タイミングを変える', energy: '元気な日に、もう一度',
    'night-far': '時間帯を変える', 'night-outdoor': '時間帯を変える',
    'sleep-conflict': '別の日の予定にする', 'sleep-window': '別の日の予定にする'
  };
  function diagnose(allV) {
    const counts = {};
    allV.forEach(v => { if (v.includes('unsafe') || v.includes('avoid')) return; if (v.length === 1) counts[v[0]] = (counts[v[0]] || 0) + 2; else if (v.length === 2) v.forEach(k => { counts[k] = (counts[k] || 0) + 1; }); });
    return Object.entries(counts).filter(([k]) => SUGGEST[k]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => ({ key: k, label: SUGGEST[k] }));
  }

  /* ---- 本体 ---- */
  function recommendSync(profileIn, contextIn, history, opts) {
    opts = opts || {};
    const experiences = opts.experiences || data.EXPERIENCES;
    const lookup = opts.lookup || ((id) => experiences.find(e => e.id === id) || null);
    const profile = normalizeProfile(profileIn); const ctx = normalizeContext(contextIn);
    const h = splitHistory(history);
    const L = P.buildLearning(h.records, h.events, lookup, opts.now);
    const mbtiW = P.mbtiWeight(L.historyN);
    const appetite = P.noveltyAppetite(profile, ctx.mode, L, mbtiW);
    const targetLv = targetMasakaLevel(profile, ctx, L);
    const rand = rng(ctx.seed);

    /* Step1・2 */
    const allV = []; const filteredOut = {}; const eligible = [];
    experiences.forEach(e => {
      const v = violations(e, ctx, profile); allV.push(v);
      if (v.length) v.forEach(k => { filteredOut[k] = (filteredOut[k] || 0) + 1; }); else eligible.push(e);
    });

    /* Step3 */
    const scored = eligible.map(e => {
      const personal = P.personalFit(e, profile, L, mbtiW);
      const sc = { personal, situation: situationScore(e, ctx, L, profile), novelty: noveltyScore(e, L), surprise: surpriseScore(e, personal, targetLv, L), ease: easeScore(e), past: pastScore(e, L) };
      let penalty = 0;
      if (e.exclusionTags.includes('crowd')) penalty += TUNING.CROWD_SKIP_PENALTY * L.skip.crowd;
      penalty += TUNING.HURDLE_SKIP_PENALTY * L.skip.hurdle * (e.difficulty - 1);
      penalty -= restAdjust(e, ctx, L, profile);
      const jitter = rand() * TUNING.JITTER;
      const totals = {};
      SLOT_ORDER.forEach(slot => { const w = weightsFor(slot, appetite); totals[slot] = Object.keys(w).reduce((a, k) => a + w[k] * sc[k], 0) - penalty + jitter; });
      return { e, sc, totals };
    });

    /* Step4：枠ごとの候補条件（好ましさ）→ 選定 */
    const slotPool = {
      self: (x) => true,
      stretch: (x) => !L.doneIds.has(x.e.id) && x.sc.personal >= 35 && (x.e.noveltyLevel >= 2 || !L.doneCats[x.e.category]),
      surprise: (x) => x.e.masakaLevel > 0 && Math.abs(x.e.masakaLevel - targetLv) <= 1 && !L.doneIds.has(x.e.id) && x.sc.personal <= 80
    };
    const slotFallback = {
      self: null,
      stretch: (x) => !L.doneIds.has(x.e.id),
      surprise: (x) => x.e.masakaLevel > 0
    };
    const picks = []; const pickedIds = new Set(); const pickedCats = [];
    const exclude = new Set(ctx.excludeIds);
    SLOT_ORDER.forEach(slot => {
      const tiers = [
        { f: slotPool[slot], ex: true }, slotFallback[slot] && { f: slotFallback[slot], ex: true },
        { f: slotPool[slot], ex: false }, slotFallback[slot] && { f: slotFallback[slot], ex: false }
      ].filter(Boolean);
      let best = null, repeated = false, strict = true;
      for (let i = 0; i < tiers.length && !best; i++) {
        const tier = tiers[i];
        const cands = scored.filter(x => !pickedIds.has(x.e.id) && (!tier.ex || !exclude.has(x.e.id)) && tier.f(x));
        cands.forEach(x => {
          const v = x.totals[slot] - (pickedCats.includes(x.e.category) ? TUNING.SAME_CATEGORY_PENALTY : 0);
          if (!best || v > best.v) best = { x, v };
        });
        if (best) { repeated = !tier.ex && exclude.has(best.x.e.id); strict = tier.f === slotPool[slot]; }
      }
      if (best) {
        const e = best.x.e; pickedIds.add(e.id); pickedCats.push(e.category);
        const plan = SL.sleepPlan(profile.sleep);
        let sleepNote = '';
        if (plan && e.id === 'S001') sleepNote = `就寝目安 ${plan.bedHM}（睡眠のために確保する時間の目安です）`;
        else if (plan && e.id === 'S002' && SL.parseHM(profile.sleep.usualBedtime) != null) sleepNote = `いつもの${profile.sleep.usualBedtime}より30分早い ${SL.fmtHM(SL.parseHM(profile.sleep.usualBedtime) - 30)} を目安に`;
        else if (plan && !e.isRest && ctx.timing !== 'now' && e.durationMinutes >= 90) sleepNote = `就寝目安の${plan.bedHM}までに無理なく終えられるか、予定を立てるときに確認してね。`;
        picks.push({ type: slot, label: SLOT_LABEL[slot], experience: e, scores: Object.assign({}, best.x.sc, { total: Math.round(best.x.totals[slot]) }), reason: reasonFor(slot, e, ctx, profile, L), hook: hookText(e, ctx), repeated, strict, masakaLabel: slot === 'surprise' ? MASAKA_LABEL[e.masakaLevel] || '' : '', sleepNote, isRest: !!e.isRest });
      } else picks.push({ type: slot, label: SLOT_LABEL[slot], experience: null });
    });

    const missing = picks.filter(p => !p.experience).map(p => p.type);
    return {
      slots: picks,
      shortage: missing.length ? { missing, message: missing.length === 3 ? 'いまの条件に合う案が見つかりませんでした。' : '条件に合う案が' + (3 - missing.length) + '件だけ見つかりました。', suggestions: diagnose(allV) } : null,
      meta: { source: 'local', eligible: eligible.length, eligibleIds: eligible.map(e => e.id), filteredOut, timeBand: SL.timeBand(ctx.hour, profile.sleep.lifestyleType), bedtime: (SL.sleepPlan(profile.sleep) || {}).bedHM || null, mbtiWeight: Math.round(mbtiW * 1000) / 1000, appetite: Math.round(appetite * 100) / 100, targetMasakaLevel: targetLv, historyN: L.historyN, context: ctx }
    };
  }

  /* ---- RecommendationService インターフェース ----
   *  interface RecommendationService {
   *    recommend(userProfile, context, history: ActionHistory[]): Promise<RecommendationResult>
   *  }
   */
  class LocalRecommendationService {
    constructor(opts) { this.opts = opts || {}; this.name = 'local'; }
    recommend(userProfile, context, history) { return Promise.resolve(recommendSync(userProfile, context, history, this.opts)); }
  }

  /* 将来の AI API 接続用。API キーはブラウザに置かず、自社バックエンド（endpoint）経由で呼ぶ。
   * 応答は必ず fromExternal で正規化し、安全フィルタ・必須条件フィルタを再適用する。
   * 未設定・失敗・不正な応答の枠はローカルエンジンの結果で置き換える。 */
  class RemoteRecommendationService {
    constructor(opts) {
      opts = opts || {};
      this.endpoint = opts.endpoint || null; this.timeoutMs = opts.timeoutMs || 8000; this.name = 'remote';
      this.fetchImpl = opts.fetchImpl || (typeof fetch !== 'undefined' ? fetch.bind(global) : null);
      this.fallback = opts.fallback || new LocalRecommendationService(opts.localOpts);
    }
    async recommend(userProfile, context, history) {
      const local = await this.fallback.recommend(userProfile, context, history);
      if (!this.endpoint || !this.fetchImpl) return local;
      try {
        const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = ctl ? setTimeout(() => ctl.abort(), this.timeoutMs) : null;
        const res = await this.fetchImpl(this.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: userProfile, context, history }), signal: ctl ? ctl.signal : undefined });
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const body = await res.json();
        const profile = normalizeProfile(userProfile); const ctx = normalizeContext(context);
        const slots = local.slots.map(ls => {
          const r = (body.slots || []).find(s => s && s.type === ls.type);
          const e = r && data.fromExternal(r.experience);
          if (!e || violations(e, ctx, profile).length) return ls;   // 安全・条件を満たさない枠はローカル結果
          return Object.assign({}, ls, { experience: e, reason: String(r.reason || ls.reason).slice(0, 120), hook: hookText(e, ctx), source: 'remote' });
        });
        return Object.assign({}, local, { slots, meta: Object.assign({}, local.meta, { source: 'remote+local' }) });
      } catch (err) {
        return Object.assign({}, local, { meta: Object.assign({}, local.meta, { source: 'local', remoteError: String(err && err.message || err) }) });
      }
    }
  }
  function createRecommendationService(config) {
    config = config || {};
    return config.endpoint ? new RemoteRecommendationService(config) : new LocalRecommendationService(config);
  }

  NS.recommendation = {
    WEIGHTS, TUNING, REST_TUNING, normalizeSleep, sleepConflict, SLOT_ORDER, SLOT_LABEL, TIME_OPTIONS, BUDGET_OPTIONS, MASAKA_LABEL,
    normalizeContext, normalizeProfile, violations, recommendSync, hookText,
    LocalRecommendationService, RemoteRecommendationService, createRecommendationService
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = NS.recommendation;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ============================================================
 * NARA 保存処理（localStorage デモ用）
 *  - スキーマバージョン管理（schemaVersion）
 *  - v1（nara-demo-v1）→ v2 への移行。旧キーは消さずに残す
 *  - 壊れた保存データは退避してから安全に復旧
 *  ※ 端末内のみの保存。複数端末同期・アカウント管理には別途バックエンドが必要
 * ============================================================ */
(function (global) {
  'use strict';
  const NS = global.NARA = global.NARA || {};

  const KEY = 'nara-app';
  const LEGACY_KEY = 'nara-demo-v1';
  const SCHEMA_VERSION = 4;   // v2: MBTI・性格傾向・行動履歴 / v3: 睡眠・休息 / v4: 施設検索（エリア設定・計測イベント）
  const MAX_EVENTS = 600;

  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);

  function defaultProfile() {
    return { mbti: null, mbtiStatus: null, social: null, range: null, openness: null, interests: [], avoid: [], adventure: null, surpriseLevel: 2 };
  }

  function defaultSleep() {
    return { usualBedtime: null, usualWakeTime: null, desiredSleepMinutes: null, lifestyleType: null, sleepSuggestionsEnabled: true };
  }
  const HM = /^\d{1,2}:\d{2}$/;
  const REST_TYPES = ['sleep', 'early_sleep', 'do_nothing', 'relax', 'digital_detox', 'free'];

  /* 型の崩れた値を既定値に戻す（不正データ対策） */
  function sanitize(s, defaults) {
    const d = defaults();
    if (!isObj(s)) return d;
    Object.keys(d).forEach(k => {
      if (s[k] === undefined || s[k] === null && d[k] !== null) { s[k] = d[k]; return; }
      if (Array.isArray(d[k]) && !Array.isArray(s[k])) s[k] = d[k];
      else if (isObj(d[k]) && !isObj(s[k])) s[k] = d[k];
      else if (typeof d[k] === 'number' && typeof s[k] !== 'number') s[k] = d[k];
      else if (typeof d[k] === 'boolean' && typeof s[k] !== 'boolean') s[k] = d[k];
    });
    s.records = s.records.filter(r => isObj(r) && (r.kind === 'done' || r.kind === 'skip') && typeof r.date === 'string');
    s.later = s.later.filter(x => isObj(x) && x.evId !== undefined);
    s.events = s.events.filter(isObj).slice(-MAX_EVENTS);
    const p = Object.assign(defaultProfile(), isObj(s.profile) ? s.profile : {});
    if (!Array.isArray(p.interests)) p.interests = [];
    if (!Array.isArray(p.avoid)) p.avoid = [];
    if (![1, 2, 3].includes(p.surpriseLevel)) p.surpriseLevel = 2;
    if (p.adventure !== null && ![1, 2, 3, 4, 5].includes(p.adventure)) p.adventure = null;
    s.profile = p;
    const sl = Object.assign(defaultSleep(), isObj(s.sleep) ? s.sleep : {});
    if (sl.usualBedtime && !HM.test(sl.usualBedtime)) sl.usualBedtime = null;
    if (sl.usualWakeTime && !HM.test(sl.usualWakeTime)) sl.usualWakeTime = null;
    if (sl.desiredSleepMinutes !== null && !(sl.desiredSleepMinutes > 0 && sl.desiredSleepMinutes <= 720)) sl.desiredSleepMinutes = null;
    if (!['morning', 'night', 'irregular', 'shift', null].includes(sl.lifestyleType)) sl.lifestyleType = null;
    sl.sleepSuggestionsEnabled = sl.sleepSuggestionsEnabled !== false;
    s.sleep = sl;
    s.rests = (Array.isArray(s.rests) ? s.rests : []).filter(r => isObj(r) && typeof r.date === 'string' && REST_TYPES.includes(r.restType));
    if (s.dailyMode && !(isObj(s.dailyMode) && typeof s.dailyMode.date === 'string' && ['normal', 'rest'].includes(s.dailyMode.mode))) s.dailyMode = null;
    if (s.facPrefs && !(isObj(s.facPrefs) && typeof s.facPrefs.lat === 'number' && typeof s.facPrefs.lng === 'number')) s.facPrefs = null;
    if (s.plan && (!isObj(s.plan) || !Array.isArray(s.plan.slots))) s.plan = null;
    if (s.planned && (!isObj(s.planned) || s.planned.evId === undefined)) s.planned = null;
    s.schemaVersion = SCHEMA_VERSION;
    return s;
  }

  /* v1 → v2 */
  function migrateV1(old) {
    const s = Object.assign({}, old);
    s.profile = defaultProfile();
    s.profileAsked = !old.onboarded;          // 既存ユーザーには「プロフィールを教えて」の案内を出す
    s.events = [];
    s.records = (old.records || []).map(r => Object.assign({}, r, {
      sat: r.sat || (r.feeling === 'good' ? 3 : r.feeling === 'ok' ? 2 : r.feeling === 'meh' ? 1 : null),
      recType: r.recType || null
    }));
    s.later = (old.later || []).map(x => Object.assign({ at: null, recType: null }, x));
    s.plan = null;                             // 旧形式の「きょうの3つ」は日替わりのため破棄（再提案で復元）
    s.migratedFrom = 1;
    return s;
  }
  function migrate(raw) {
    let s = raw; const v = (isObj(s) && s.schemaVersion) || 1;
    if (v < 2) s = migrateV1(s);
    if (v < 3) { s = Object.assign({}, s); s.sleep = s.sleep || defaultSleep(); s.rests = s.rests || []; s.dailyMode = s.dailyMode || null; }
    if (v < 4) { s = Object.assign({}, s); s.facPrefs = s.facPrefs || null; s.tracking = Array.isArray(s.tracking) ? s.tracking : []; }
    return s;
  }

  function create(opts) {
    const storage = opts.storage; const defaults = opts.defaults;
    function read(key) { try { return storage.getItem(key); } catch (e) { return null; } }
    function write(key, val) { try { storage.setItem(key, val); return true; } catch (e) { return false; } }
    function load() {
      const info = { source: 'seed', warnings: [] };
      const rawNew = read(KEY);
      if (rawNew) {
        try {
          const obj = JSON.parse(rawNew);
          if (!isObj(obj)) throw new Error('not-object');
          if (obj.schemaVersion > SCHEMA_VERSION) info.warnings.push('newer-schema');
          info.source = 'v' + (obj.schemaVersion || 1);
          return { state: sanitize(migrate(obj), defaults), info };
        } catch (e) {
          write(KEY + '-corrupt-' + Date.now(), rawNew);   // 退避
          info.warnings.push('corrupt');
        }
      }
      const rawOld = read(LEGACY_KEY);
      if (rawOld) {
        try {
          const obj = JSON.parse(rawOld);
          if (!isObj(obj)) throw new Error('not-object');
          const st = sanitize(migrate(obj), defaults);
          info.source = info.warnings.length ? 'recovered-from-v1' : 'migrated-v1';
          write(KEY, JSON.stringify(st));                  // 旧キーは残したまま新キーに保存
          return { state: st, info };
        } catch (e) { info.warnings.push('legacy-corrupt'); }
      }
      if (info.warnings.length) info.source = 'recovered-seed';
      return { state: sanitize(defaults(), defaults), info };
    }
    function save(state) {
      if (state && Array.isArray(state.events) && state.events.length > MAX_EVENTS) state.events = state.events.slice(-MAX_EVENTS);
      return write(KEY, JSON.stringify(state));
    }
    return { load, save };
  }

  NS.storage = { KEY, LEGACY_KEY, SCHEMA_VERSION, MAX_EVENTS, defaultProfile, defaultSleep, REST_TYPES, sanitize, migrate, migrateV1, create };
  if (typeof module !== 'undefined' && module.exports) module.exports = NS.storage;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

 *     実在の施設情報として使用・表示しないでください（名称に「サンプル」を含めています）。

(function (global) {

  const TYPES = {
    pottery:     { label: '陶芸体験', category: '体験施設', tags: ['pottery', 'workshop'], price: [2500, 4800], reserve: true, age: '小学生以上（保護者同伴）' },

  const ALL_DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  function hours(open, close, closedDay) { const h = {}; ALL_DAYS.forEach(d => { h[d] = d === closedDay ? [] : [[open, close]]; }); return h; }

  const facilities = [];
  const campaigns = [];
  const today = new Date();
  const ymd = (d) => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
  const addDays = (n) => { const d = new Date(today); d.setDate(d.getDate() + n); return ymd(d); };
  const LETTERS = 'ABCDEFGH';
  let fid = 1000, aid = 5000;

  DEMO_AREAS.forEach((ar, ai) => {
    const r = rng(1234 + ai * 97);
    Object.keys(TYPES).forEach((tk, ti) => {

      for (let k = 0; k < n; k++) {
        const ang = r() * Math.PI * 2, distKm = 0.4 + r() * (k === 2 ? 14 : 6);
        const lat = ar.lat + (distKm / 111) * Math.cos(ang), lng = ar.lng + (distKm / (111 * Math.cos(ar.lat * Math.PI / 180))) * Math.sin(ang);
        const hasRating = r() > 0.15;

        const rating = hasRating ? Math.round((3.6 + r() * 1.4) * 10) / 10 : null;
        const hrsKnown = r() > 0.2;
        const id = 'F' + (++fid);

          service_area: ar.name, source: isAff ? 'nara_db' : 'demo_places', last_verified_at: addDays(-((ti + k) % 20)),
          status: 'active', demo: true, updated_at: addDays(-((ti + k) % 20))
        });

            affiliate_id: 'A' + (++aid), facility_id: id, asp: 'デモASP',
            affiliate_url: `https://example.com/demo/aff/${id}?ref=nara`, commission_type: ti % 2 ? 'fixed' : 'rate', commission_value: ti % 2 ? 300 + (ti % 5) * 100 : 5 + (ti % 4),
            contract_start: addDays(-120), contract_end: addDays(180), status: 'active', listing_allowed: true, label: 'NARAおすすめ｜PR・提携施設', updated_at: addDays(-3)
          });

    });
  });
  /* テスト用の状態：契約終了・掲載停止の案件 */
  const expired = campaigns.find(c => facilities.find(f => f.facility_id === c.facility_id && f.type === 'climbing' && f.area === '渋谷'));
  if (expired) expired.contract_end = addDays(-1);
  const paused = campaigns.find(c => facilities.find(f => f.facility_id === c.facility_id && f.type === 'cinema' && f.area === '渋谷'));
  if (paused) paused.status = 'paused';

  NS.facilityData = { DEMO_AREAS, TYPES, facilities, campaigns, DEMO_NOTICE: 'デモモード：表示している施設・評価・料金はすべて架空のサンプルです。' };
  if (typeof module !== 'undefined' && module.exports) module.exports = NS.facilityData;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ============================================================
 * NARA アフィリエイト案件DB（F32 / F38 / F39）と成果計測（F37）
 *  - facilities（施設）と affiliate_campaigns（契約）を別テーブルで保持
 *  - MVPでは localStorage（キー nara-affiliate-db）に保存。本番はサーバーDBに置き換える
 *  - クリックと成果（コンバージョン）は別管理。成果は ASP・提携先の成果データ取込でのみ計上
 * ============================================================ */
(function (global) {
  'use strict';
  const NS = global.NARA = global.NARA || {};
  const KEY = 'nara-affiliate-db';
  const DB_VERSION = 1;

  /* アフィリエイトURLに使用を許可するドメイン（本番では提携ASPのドメインを設定） */
  const ALLOWED_AFFILIATE_DOMAINS = ['example.com'];
  function allowedUrl(u, domains) {
    try { const x = new URL(u); if (x.protocol !== 'https:') return false; return (domains || ALLOWED_AFFILIATE_DOMAINS).some(d => x.hostname === d || x.hostname.endsWith('.' + d)); }
    catch (e) { return false; }
  }

  const FACILITY_FIELDS = ['facility_id', 'facility_name', 'category', 'type', 'experience_tags', 'description', 'address', 'area', 'latitude', 'longitude', 'price_min', 'price_max', 'rating', 'review_count', 'business_hours', 'official_url', 'maps_url', 'requires_reservation', 'target_age', 'conditions', 'service_area', 'source', 'last_verified_at', 'status', 'updated_at'];
  const CAMPAIGN_FIELDS = ['affiliate_id', 'facility_id', 'asp', 'affiliate_url', 'commission_type', 'commission_value', 'contract_start', 'contract_end', 'status', 'listing_allowed', 'label', 'updated_at'];
  /* CSV一括登録の列（施設＋案件を1行で） */
  const CSV_COLUMNS = ['facility_id', 'facility_name', 'category', 'experience_tags', 'description', 'address', 'area', 'latitude', 'longitude', 'price_min', 'price_max', 'business_hours_text', 'official_url', 'requires_reservation', 'target_age', 'conditions', 'status', 'affiliate_id', 'asp', 'affiliate_url', 'commission_type', 'commission_value', 'contract_start', 'contract_end', 'campaign_status'];

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const nowIso = () => new Date().toISOString();
  const num = (v) => (v === '' || v === null || v === undefined || isNaN(+v) ? null : +v);
  const DATE = /^\d{4}-\d{2}-\d{2}$/;

  function seed() {
    const fd = NS.facilityData;
    return { version: DB_VERSION, facilities: fd ? clone(fd.facilities) : [], campaigns: fd ? clone(fd.campaigns) : [], conversions: [], updated_at: nowIso() };
  }

  /* 入力値の検証（管理画面・CSV共通。本番ではサーバー側でも必ず検証する） */
  function validateFacility(f) {
    const e = [];
    if (!f.facility_id || !/^[\w-]{1,40}$/.test(f.facility_id)) e.push('施設IDは英数字・ハイフン40字以内');
    if (!f.facility_name || String(f.facility_name).length > 80) e.push('施設名は1〜80字');
    if (!Array.isArray(f.experience_tags) || !f.experience_tags.length) e.push('体験タグを1つ以上');
    if (f.latitude !== null && (f.latitude < -90 || f.latitude > 90)) e.push('緯度が不正');
    if (f.longitude !== null && (f.longitude < -180 || f.longitude > 180)) e.push('経度が不正');
    if (f.latitude === null || f.longitude === null) e.push('緯度・経度は必須');
    if (f.price_min !== null && f.price_min < 0) e.push('最低料金が不正');
    if (f.price_min !== null && f.price_max !== null && f.price_max < f.price_min) e.push('最高料金が最低料金より小さい');
    if (f.official_url && !/^https:\/\//.test(f.official_url)) e.push('公式URLは https:// で始めてください');
    if (!['active', 'paused', 'closed'].includes(f.status)) e.push('施設の掲載状態が不正');
    return e;
  }
  function validateCampaign(c, domains) {
    const e = [];
    if (!c.affiliate_id || !/^[\w-]{1,40}$/.test(c.affiliate_id)) e.push('案件IDは英数字・ハイフン40字以内');
    if (!c.facility_id) e.push('施設IDが必要');
    if (!allowedUrl(c.affiliate_url, domains)) e.push('アフィリエイトURLが許可ドメイン外、または https ではありません');
    if (!['rate', 'fixed'].includes(c.commission_type)) e.push('成果報酬方式は rate（料率%）か fixed（定額円）');
    if (c.commission_value === null || c.commission_value < 0) e.push('成果報酬額・料率が不正');
    if (!DATE.test(c.contract_start || '') || !DATE.test(c.contract_end || '')) e.push('契約期間は YYYY-MM-DD');
    else if (c.contract_end < c.contract_start) e.push('契約終了日が開始日より前');
    if (!['active', 'paused', 'ended'].includes(c.status)) e.push('案件の掲載状態が不正');
    return e;
  }
  function isCampaignValid(c, today, domains) {
    const t = today || new Date().toISOString().slice(0, 10);
    return !!c && c.status === 'active' && c.listing_allowed !== false && c.contract_start <= t && t <= c.contract_end && allowedUrl(c.affiliate_url, domains);
  }

  /* 営業時間テキスト（例：「10:00-18:00 月休」）⇔ 構造データ */
  const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const DAY_JA = { '日': 'sun', '月': 'mon', '火': 'tue', '水': 'wed', '木': 'thu', '金': 'fri', '土': 'sat' };
  function parseHoursText(t) {
    if (!t || !String(t).trim()) return null;
    const m = /(\d{1,2}:\d{2})\s*[-〜~]\s*(\d{1,2}:\d{2})/.exec(t); if (!m) return null;
    const closed = []; (String(t).match(/([日月火水木金土])休/g) || []).forEach(x => closed.push(DAY_JA[x[0]]));
    const h = {}; DAYS.forEach(d => { h[d] = closed.includes(d) ? [] : [[m[1].padStart(5, '0'), m[2].padStart(5, '0')]]; }); return h;
  }
  function hoursText(h) {
    if (!h) return '';
    const open = DAYS.map(d => h[d] && h[d][0]).find(Boolean); if (!open) return '';
    const closed = DAYS.filter(d => !h[d] || !h[d].length).map(d => Object.keys(DAY_JA).find(k => DAY_JA[k] === d) + '休');
    return open[0] + '-' + open[1] + (closed.length ? ' ' + closed.join('') : '');
  }

  /* CSV */
  function parseCSV(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }
  const csvCell = (v) => { const s = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

  function rowToRecords(o) {
    const f = {
      facility_id: (o.facility_id || '').trim(), facility_name: (o.facility_name || '').trim(), category: o.category || '', type: '',
      experience_tags: String(o.experience_tags || '').split(/[|;、\s]+/).map(s => s.trim()).filter(Boolean), description: o.description || '',
      address: o.address || '', area: o.area || '', latitude: num(o.latitude), longitude: num(o.longitude), price_min: num(o.price_min), price_max: num(o.price_max),
      rating: null, review_count: null, business_hours: parseHoursText(o.business_hours_text), official_url: o.official_url || '', maps_url: null,
      requires_reservation: /^(1|true|yes|要)$/i.test(String(o.requires_reservation || '').trim()), target_age: o.target_age || null, conditions: o.conditions || null,
      service_area: o.area || '', source: 'nara_db', last_verified_at: nowIso().slice(0, 10), status: o.status || 'active', updated_at: nowIso()
    };
    const c = o.affiliate_id ? {
      affiliate_id: o.affiliate_id.trim(), facility_id: f.facility_id, asp: o.asp || '', affiliate_url: (o.affiliate_url || '').trim(), commission_type: o.commission_type || 'rate',
      commission_value: num(o.commission_value), contract_start: o.contract_start || '', contract_end: o.contract_end || '', status: o.campaign_status || 'active', listing_allowed: true, label: 'NARAおすすめ｜PR・提携施設', updated_at: nowIso()
    } : null;
    return { f, c };
  }

  function create(opts) {
    opts = opts || {};
    const storage = opts.storage; const domains = opts.domains || ALLOWED_AFFILIATE_DOMAINS;
    let db = null;
    function load() {
      if (db) return db;
      try { const raw = storage && storage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && Array.isArray(o.facilities) && Array.isArray(o.campaigns)) { o.conversions = Array.isArray(o.conversions) ? o.conversions : []; db = o; return db; } } } catch (e) { /* 壊れていれば初期化 */ }
      db = seed(); return db;
    }
    function save() { db.updated_at = nowIso(); try { storage && storage.setItem(KEY, JSON.stringify(db)); return true; } catch (e) { return false; } }
    function upsertFacility(f) {
      const errs = validateFacility(f); if (errs.length) return { ok: false, errors: errs };
      const d = load(); const i = d.facilities.findIndex(x => x.facility_id === f.facility_id);
      const rec = Object.assign({}, i >= 0 ? d.facilities[i] : {}, f, { updated_at: nowIso() });
      if (i >= 0) d.facilities[i] = rec; else d.facilities.push(rec); save(); return { ok: true, record: rec };
    }
    function upsertCampaign(c) {
      const errs = validateCampaign(c, domains); const d = load();
      if (!d.facilities.some(f => f.facility_id === c.facility_id)) errs.push('紐づく施設が存在しません');
      if (errs.length) return { ok: false, errors: errs };
      const i = d.campaigns.findIndex(x => x.affiliate_id === c.affiliate_id);
      const rec = Object.assign({ listing_allowed: true, label: 'NARAおすすめ｜PR・提携施設' }, i >= 0 ? d.campaigns[i] : {}, c, { updated_at: nowIso() });
      if (i >= 0) d.campaigns[i] = rec; else d.campaigns.push(rec); save(); return { ok: true, record: rec };
    }
    function setCampaignStatus(id, status) { const c = load().campaigns.find(x => x.affiliate_id === id); if (!c) return false; c.status = status; c.updated_at = nowIso(); save(); return true; }
    function setFacilityStatus(id, status) { const f = load().facilities.find(x => x.facility_id === id); if (!f) return false; f.status = status; f.updated_at = nowIso(); save(); return true; }
    function importCSV(text) {
      const rows = parseCSV(text); if (!rows.length) return { ok: 0, errors: ['CSVが空です'] };
      const head = rows[0].map(h => h.trim()); const res = { ok: 0, errors: [] };
      rows.slice(1).forEach((r, i) => {
        const o = {}; head.forEach((h, j) => { o[h] = r[j] !== undefined ? r[j] : ''; });
        const { f, c } = rowToRecords(o);
        const a = upsertFacility(f); if (!a.ok) { res.errors.push(`${i + 2}行目：${a.errors.join('／')}`); return; }
        if (c) { const b = upsertCampaign(c); if (!b.ok) { res.errors.push(`${i + 2}行目（案件）：${b.errors.join('／')}`); return; } }
        res.ok++;
      });
      return res;
    }
    function exportCSV() {
      const d = load();
      const lines = [CSV_COLUMNS.join(',')];
      d.facilities.filter(f => f.source === 'nara_db').forEach(f => {
        const cs = d.campaigns.filter(c => c.facility_id === f.facility_id); (cs.length ? cs : [null]).forEach(c => {
          const o = Object.assign({}, f, { experience_tags: f.experience_tags.join('|'), business_hours_text: hoursText(f.business_hours) }, c ? { affiliate_id: c.affiliate_id, asp: c.asp, affiliate_url: c.affiliate_url, commission_type: c.commission_type, commission_value: c.commission_value, contract_start: c.contract_start, contract_end: c.contract_end, campaign_status: c.status } : {});
          lines.push(CSV_COLUMNS.map(k => csvCell(o[k])).join(','));
        });
      });
      return lines.join('\n');
    }
    /* 成果データ取込（ASP・提携先からの成果通知を想定）：affiliate_id, conversion_id, occurred_at, status(pending/approved/rejected), amount */
    function importConversions(text) {
      const rows = parseCSV(text); const head = (rows[0] || []).map(h => h.trim()); const res = { ok: 0, errors: [] }; const d = load();
      rows.slice(1).forEach((r, i) => {
        const o = {}; head.forEach((h, j) => { o[h] = (r[j] || '').trim(); });
        if (!d.campaigns.some(c => c.affiliate_id === o.affiliate_id)) { res.errors.push(`${i + 2}行目：案件IDが不明`); return; }
        if (!['pending', 'approved', 'rejected'].includes(o.status)) { res.errors.push(`${i + 2}行目：status は pending/approved/rejected`); return; }
        const rec = { conversion_id: o.conversion_id || ('C' + Date.now() + i), affiliate_id: o.affiliate_id, occurred_at: o.occurred_at || nowIso(), status: o.status, amount: num(o.amount) || 0, experience_category: o.experience_category || '' };
        const j = d.conversions.findIndex(x => x.conversion_id === rec.conversion_id); if (j >= 0) d.conversions[j] = rec; else d.conversions.push(rec); res.ok++;
      });
      save(); return res;
    }
    return { load, save, upsertFacility, upsertCampaign, setCampaignStatus, setFacilityStatus, importCSV, exportCSV, importConversions, reset: () => { db = seed(); save(); return db; } };
  }

  /* 計測イベントの集計（案件別）。売上は承認済みの成果データからのみ計算する */
  function summarize(events, db) {
    const by = {};
    const get = (id) => (by[id] = by[id] || { affiliate_id: id, impressions: 0, detail_clicks: 0, affiliate_clicks: 0, reservation_clicks: 0, conversions: 0, approved: 0, rejected: 0, pending: 0, confirmed_revenue: 0 });
    (events || []).forEach(e => {
      if (!e.affiliate_id) return; const s = get(e.affiliate_id);
      if (e.name === 'facility_impression') s.impressions++;
      if (e.name === 'facility_clicked') s.detail_clicks++;
      if (e.name === 'affiliate_clicked') s.affiliate_clicks++;
      if (e.name === 'reservation_clicked') s.reservation_clicks++;
    });
    ((db && db.conversions) || []).forEach(c => {
      const s = get(c.affiliate_id); s.conversions++; s[c.status]++;
      if (c.status === 'approved') s.confirmed_revenue += c.amount || 0;
    });
    Object.values(by).forEach(s => { s.ctr = s.impressions ? s.affiliate_clicks / s.impressions : 0; s.cvr = s.affiliate_clicks ? s.approved / s.affiliate_clicks : 0; });

  const res = await recService.recommend(recProfile(), ctxFrom(c, exclude), recHistory());
  const slots = res.slots.map(s => {

    const e = s.experience; if (!D.byId(e.id)) S.customEvs[e.id] = e;

  });

  const shown = (mode === 'reroll' && prev ? prev.shown : []).concat(ids);
  S.plan = { date: t, c, slots, shortage: res.shortage, shown, fresh: true, meta: { source: res.meta.source, mbtiWeight: res.meta.mbtiWeight, target: res.meta.targetMasakaLevel, eligible: res.meta.eligible } };
  if (mode === 'reroll') logEv('reroll', { prev: lastIds });

function viewLog() {

function defaultSchedule(evId, type) {
  const plan = todayPlan(); const c = plan && plan.slots.some(s => s.evId === evId) ? plan.c : null;
  const d = new Date(); let hh = 19;
  const ev = evById(evId);
  if (ev && ev.isRest) {   // 睡眠・休息は就寝目安（なければ 22:00）を初期値に。日付またぎは当日扱いのまま保存
    const bed = SLP.targetBedtime(S.sleep); const base = bed != null ? bed : 22 * 60; const t0 = ev.id === 'S003' || ev.id === 'S005' ? base - 30 : base;
    const tm = ((t0 % 1440) + 1440) % 1440; return { evId, type, d: SLP.jstYmd(), t: z2(Math.floor(tm / 60)) + ':' + z2(tm % 60) };
  }
  const slotH = { '朝': 8, '昼': 12, '夕方': 17, '夜': 19 };
  if (c && c.when === 'custom' && c.dt && !isNaN(new Date(c.dt))) { const x = new Date(c.dt); return { evId, type, d: ymd(x), t: z2(x.getHours()) + ':' + z2(x.getMinutes()) }; }
  if (c && c.slot) hh = slotH[c.slot];
  if (c && c.when === 'tomorrow') d.setDate(d.getDate() + 1);
  else if (c && c.when === 'weekend') { const add = (6 - d.getDay() + 7) % 7 || (d.getDay() === 6 ? 0 : 7); d.setDate(d.getDate() + add); hh = c.slot ? hh : 10; }
  else if (!c || c.when === 'now') { if (d.getHours() >= 18) { d.setDate(d.getDate() + 1); hh = 10; } else hh = Math.max(d.getHours() + 1, 10); }
  return { evId, type, d: ymd(d), t: z2(hh) + ':00' };
}

/* ============ events ============ */
async function handle(t) {
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'tab': tab = v; render(); break;
    /* home */
    case 'mood-pick': {
      const m = +v; S.moods[todayStr()] = m; save();
      if (isRestMode()) { render(); break; }   // 休息モード中はキャラクターを穏やかなまま
      setNara(document.getElementById('hero'), m); document.querySelectorAll('#moods .md').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === m)));
      const nm = document.getElementById('moodname'); if (nm) nm.textContent = MOOD[m].n; const sb = document.getElementById('startBtn'); if (sb) { sb.disabled = false; sb.classList.add('ready'); }
      root.style.setProperty('--accent', MOOD[m].c); root.style.setProperty('--on-accent', onColor(MOOD[m].c)); break;
    }
    case 'ask': openAsk(false); break;
    case 'ask-back': if (ci.step === 0) { ov = null; render(); } else { ci.step--; render(); } break;
    case 'ci-when': ci.when = v; if (v !== 'custom') ci.dt = ''; if (v === 'now') ci.slot = null; render(); break;
    case 'ci-slot': ci.slot = ci.slot === v ? null : v; render(); break;
    case 'ci-genre': { if (v === 'any') ci.genres = ci.genres.includes('any') ? [] : ['any']; else { ci.genres = ci.genres.filter(x => x !== 'any'); ci.genres = ci.genres.includes(v) ? ci.genres.filter(x => x !== v) : ci.genres.concat(v); } render(); break; }
    case 'ci-budget': ci.budget = +v; render(); break;
    case 'ci-time': ci.time = +v; render(); break;
    case 'ci-place': ci.place = v; render(); break;
    case 'ci-comp': ci.companion = v; render(); break;
    case 'ci-mode': ci.mode = v; render(); break;
    case 'ask-next': {
      if (ci.step < ASK_STEPS - 1) { ci.step++; render(); break; }
      if (busy) break; busy = true;
      try { await buildPlan('new'); } finally { busy = false; }
      ov = null; render(); const el = root.querySelector('.sugs'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    }
    case 'reroll': if (busy) break; busy = true; try { await buildPlan('reroll'); } finally { busy = false; } render(); toast('ほかの案に替えた'); break;
    case 'fix': {
      const plan = todayPlan(); if (v === 'difficulty') { tab = 'me'; ov = null; render(); toast('「ペース」を変えられます'); break; }
      const stepOf = { budget: 2, time: 2, genre: 1, place: 3, companion: 3, 'needs-planning': 0, 'late-night': 0, 'time-window': 0, 'night-far': 0, 'night-outdoor': 0, energy: 0 };
      if (plan) ci = Object.assign({}, plan.c); openAsk(true, stepOf[v] || 0); break;
    }
    case 'now': {
      const id = parseId(v); const ty = t.dataset.type || null; if (ty) logEv('select', { evId: id, recType: ty, via: 'now' });
      if (FAC.needsFacility(evById(id)) && !isRestMode()) { openFacility(id, ty, 'now'); break; }   // 施設が必要な体験は場所探しへ（スキップ可）
      startDoing(id, ty); break;
    }
    /* 施設検索（F30〜F37） */
    case 'fac-open': openFacility(parseId(v), t.dataset.type || null, 'browse'); break;
    case 'fac-close': fx = null; ov = null; render(); break;
    case 'fac-back': if (fx.step === 'results') { fx.step = 'where'; render(); } else { fx = null; ov = null; render(); } break;
    case 'fac-geo': {
      fx.geo = 'busy'; render();
      try { fx.loc = await FAC.getCurrentPosition(navigator.geolocation); fx.geo = 'ok'; fx.areaRes = null; }   // 現在地は保存しない
      catch (err) { fx.geo = err.message === 'denied' ? 'denied' : 'unavailable'; }
      render(); break;
    }
    case 'fac-area': {
      const inp = document.getElementById('fac-area'); fx.areaQ = inp ? inp.value.trim() : fx.areaQ; if (!fx.areaQ) break;
      try { fx.areaRes = await facSvc.geocode(fx.areaQ); } catch (err) { fx.areaRes = []; toast('エリアを検索できませんでした'); }
      if (fx.areaRes.length === 1) { fx.loc = fx.areaRes[0]; S.facPrefs = { label: fx.loc.label, lat: FAC.roundCoord(fx.loc.lat), lng: FAC.roundCoord(fx.loc.lng), source: 'area', range: fx.range }; save(); }
      render(); break;
    }
    case 'fac-area-pick': { const r = fx.areaRes[+v]; if (r) { fx.loc = r; S.facPrefs = { label: r.label, lat: FAC.roundCoord(r.lat), lng: FAC.roundCoord(r.lng), source: 'area', range: fx.range }; save(); } render(); break; }
    case 'fac-pref': if (S.facPrefs) fx.loc = { label: S.facPrefs.label, lat: S.facPrefs.lat, lng: S.facPrefs.lng, source: 'area' }; render(); break;
    case 'fac-range': fx.range = v; if (S.facPrefs) { S.facPrefs.range = v; save(); } render(); break;
    case 'fac-budget': fx.budget = +v; render(); break;
    case 'fac-search': if (fx.loc && !fx.busy) await runFacilitySearch(); break;
    case 'fac-sort': fx.sort = v; fx.items = FAC.sortItems(fx.items, v); fx.page = 0; trackImpressions(); render(); break;
    case 'fac-more': fx.page++; trackImpressions(); render(); break;
    case 'fac-fix': fx.step = 'where'; render(); if (v === 'when') toast('日時は提案の条件（いつ？）から変えられます'); break;
    case 'fac-detail': { const f = facById(v); if (!f) break; facDetail = f; track('facility_clicked', { evId: fx.evId, facility_id: f.facility_id, affiliate_id: f.campaign ? f.campaign.affiliate_id : null, kind: f.kind }); ov = 'facdetail'; render(); break; }
    case 'fac-detail-close': ov = 'fac'; render(); break;
    case 'fac-link': {
      const f = facById(v) || facDetail; if (!f) break; const ty = t.dataset.type;
      const url = ty === 'affiliate' ? f.campaign && f.campaign.affiliate_url : ty === 'maps' ? f.maps_url : f.official_url;
      if (!url) break;
      if (ty === 'affiliate' && !AFFDB.allowedUrl(url, _cfg.affiliateDomains)) { toast('このリンクは表示できません'); break; }
      const base = { evId: fx && fx.evId, facility_id: f.facility_id, affiliate_id: f.campaign ? f.campaign.affiliate_id : null, kind: f.kind };
      if (ty === 'affiliate') { track('affiliate_clicked', base); track('reservation_clicked', base); }   // クリック＝成果ではない（成果は提携先データで確定）
      else track(ty === 'maps' ? 'maps_clicked' : 'official_clicked', base);
      if (f.demo) toast('デモのため外部サイトには移動しません（クリックは記録しました）');
      else if (typeof window.open === 'function') window.open(url, '_blank', 'noopener,noreferrer');
      break;
    }
    case 'fac-use-now': { const f = facById(v) || facDetail; const e = fx; fx = null; startDoing(e.evId, e.recType, facSnap(f)); break; }
    case 'fac-use-later': { const f = facById(v) || facDetail; sch = defaultSchedule(fx.evId, fx.recType); sch.facility = facSnap(f); ov = 'sched'; render(); break; }
    case 'fac-nofac-now': { const e = fx; fx = null; startDoing(e.evId, e.recType, null); break; }
    case 'fac-nofac-later': { sch = defaultSchedule(fx.evId, fx.recType); ov = 'sched'; render(); break; }
    case 'fac-loc-clear': S.facPrefs = null; save(); render(); toast('保存していたエリアを削除しました'); break;
    case 'later-add': {
      const id = parseId(v); if (S.later.some(x => x.evId === id)) break;
      sch = defaultSchedule(id, t.dataset.type || null); ov = 'sched'; render(); break;
    }
    case 'sch-d': sch.d = v; render(); break;
    case 'sch-t': sch.t = v; render(); break;
    case 'sch-save': {
      const di = document.getElementById('sch-date'), ti = document.getElementById('sch-time'); if (di && di.value) sch.d = di.value; if (ti && ti.value) sch.t = ti.value;
      const at = new Date(sch.d + 'T' + (sch.t || '10:00')); if (isNaN(at)) { toast('日時を確認してください'); break; }

    case 'later-del': S.later = S.later.filter(x => x.id !== +v); save(); render(); break;
    case 'start-later': { const x = S.later.find(y => y.id === +v); if (x) { S.later = S.later.filter(y => y.id !== x.id); startDoing(x.evId, x.recType, x.facility || null); } break; }
    case 'later-back': if (S.planned) { S.later.push({ id: ++S.sid, evId: S.planned.evId, when: 'あとで', at: null, recType: S.planned.recType || null }); S.planned = null; save(); } ov = null; render(); toast('予定に戻した'); break;
    case 'doing': ov = 'doing'; render(); break;
    case 'ov-close': ov = null; render(); break;
    /* reflect */
    case 'reflect': rf = newRf(); ov = 'reflect'; render(); break;
    case 'mood-after': { captureNote(); rf.moodAfter = +v; setNara(document.getElementById('rhero'), rf.moodAfter); document.querySelectorAll('#rmoods .md').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === rf.moodAfter))); break; }
    case 'feel': captureNote(); rf.feeling = v; render(); break;
    case 'rsur': captureNote(); rf.surprise = rf.surprise === +v ? null : +v; render(); break;
    case 'rusual': captureNote(); rf.usual = rf.usual === v ? null : v; render(); break;
    case 'ragain': captureNote(); rf.again = rf.again === v ? null : v; render(); break;
    case 'pub': captureNote(); rf.pub = v; if (v === 'yes' && !rf.nameMode) rf.nameMode = S.nameMode; render(); break;
    case 'nm': captureNote(); rf.nameMode = v; render(); break;
    case 'reflect-save': { const pe = S.planned && evById(S.planned.evId); if (rf.feeling && (rf.pub || (pe && pe.isRest))) finishDone(); break; }
    case 'done-close': { const wasRest = dn && dn.rest; ov = null; tab = wasRest ? 'today' : 'log'; render(); fresh = null; break; }
    /* 今日は休む・休息モード（F26 / F27） */
    case 'rest-open': ov = 'rest'; render(); break;
    case 'rest-back': ov = null; render(); break;   // やっぱり何かやってみる（通常画面へ）
    case 'rest-slow': enterRest('free', null); ov = null; tab = 'today'; render(); break;
    case 'rest-choose': ov = 'restpick'; render(); break;
    case 'rest-pick': {
      const o = REST_OPTIONS.find(x => x[0] === v); if (!o) break;
      enterRest(o[0], o[2]); tab = 'today'; ov = o[2] ? 'restset' : null; render(); break;
    }
    case 'rest-reflect': {
      const n = document.getElementById('rest-note'); let r = todayRest();
      if (!r) { enterRest('free', null); r = todayRest(); }
      r.reflection = n ? n.value.trim() : r.reflection; r.status = 'completed'; logEv('rest-done', { restType: r.restType }); save(); render(); toast('きろくに残したよ'); break;
    }
    case 'rest-exit': S.dailyMode = { date: todayStr(), mode: 'normal' }; logEv('rest-exit'); save(); render(); break;
    /* 睡眠プロフィール（F23） */
    case 'sleep-open': ov = 'sleep'; render(); break;
    case 'sleep-close': ov = null; render(); await refreshAfterProfile(); break;
    case 'sl-set': {
      const k = t.dataset.k; let val = v;
      if (k === 'desiredSleepMinutes') val = +v; if (k === 'sleepSuggestionsEnabled') val = v === 'true';
      S.sleep[k] = (k !== 'sleepSuggestionsEnabled' && S.sleep[k] === val) ? null : val; profDirty = true; save(); render(); break;
    }
    case 'sl-clear': Object.assign(S.sleep, { usualBedtime: null, usualWakeTime: null, desiredSleepMinutes: null }); profDirty = true; save(); render(); break;
    case 'skip': rs = { why: null }; ov = 'skip'; render(); break;
    case 'why': rs.why = v; render(); break;
    case 'skip-save': if (rs.why) finishSkip(); break;
    /* feed */
    case 'filter': feedGenre = v; render(); break;
    case 'nice': { const on = !S.react[v]; if (on) S.react[v] = true; else delete S.react[v]; save(); t.setAttribute('aria-pressed', String(on)); if (on) { t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); burst(t, 'var(--accent)'); } break; }
    case 'tryit': {
      const p = allPosts().find(x => x.id === v); if (!p) break; const e = postToEv(p); S.customEvs[e.id] = e;
      if (!S.later.some(x => x.evId === e.id)) { S.later.push({ id: ++S.sid, evId: e.id, when: 'いつか', at: null, recType: null }); logEv('schedule', { evId: e.id, at: null, via: 'feed' }); } save();
      t.setAttribute('aria-pressed', 'true'); t.classList.add('on', 'pop'); t.innerHTML = ICO.check + '入れた'; burst(t, 'var(--accent)'); toast('予定に入れた', ['いまやる', 'now', e.id]); break;
    }
    case 'togglepub': { const r = S.records.find(x => x.id === +v); if (r) { r.pub = !r.pub; if (r.pub && !r.nameMode) r.nameMode = S.nameMode; save(); render(); toast(r.pub ? 'みんなに出した' : '非公開にした'); } break; }
    case 'logtype': logType = v; render(); break;
    /* goals */
    case 'goal': gid = v; ov = 'goal'; render(); break;
    /* me */
    case 'stage': S.stage = +v; save(); profDirty = true; render(); await refreshAfterProfile(); break;
    case 'fx': S.fx = +v; save(); render(); break;
    case 'char': S.char = v; save(); render(); break;
    case 'theme': S.theme = v; applyTheme(); save(); render(); break;
    case 'profile': ov = 'profile'; render(); break;
    case 'share': try { if (navigator.share) await navigator.share({ title: 'NARA', text: '気分に合わせて、きょうの「初めて」を決めるアプリ' }); else toast('共有はデモでは使えません'); } catch (e) { toast('共有はデモでは使えません'); } break;
    case 'reset': if (!window._ra) { window._ra = true; toast('もう一度押すと、最初からやり直します'); setTimeout(() => { window._ra = false; }, 3000); } else { window._ra = false; S = seed(); save(); applyTheme(); tab = 'today'; introStep = 0; splashT0 = Date.now(); splashSkipped = false; ov = 'intro'; render(); } break;
    /* profile (MBTI・性格傾向) */
    case 'pe-open': peKey = v; ov = 'pedit'; render(); break;
    case 'pe-close': ov = null; render(); await refreshAfterProfile(); break;
    case 'pf-mbti': {
      const p = S.profile;
      if (v === 'unknown' || v === 'none') { p.mbti = null; p.mbtiStatus = v === 'unknown' ? 'unknown' : 'declined'; }
      else if (p.mbti === v) { p.mbti = null; p.mbtiStatus = null; }
      else { p.mbti = v; p.mbtiStatus = 'set'; }
      profDirty = true; save(); render(); break;
    }
    case 'pf': { const k = t.dataset.k; const val = ['adventure', 'surpriseLevel'].includes(k) ? +v : v; if (k === 'surpriseLevel') setProf(k, val); else setProf(k, S.profile[k] === val ? null : val); render(); break; }
    case 'pf-multi': { const k = t.dataset.k; const arr = S.profile[k]; setProf(k, arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v)); render(); break; }
    case 'ps-open': psStep = 0; ov = 'psetup'; render(); break;
    case 'ps-dismiss': S.profileAsked = true; save(); render(); toast('「わたし」からいつでも設定できます'); break;
    case 'ps-back': if (psStep > 0) { psStep--; render(); } else { ov = null; render(); await refreshAfterProfile(); } break;
    case 'ps-skip': case 'ps-next':
      if (psStep < PROF_STEPS.length - 1) { psStep++; render(); }
      else { S.profileAsked = true; save(); ov = null; render(); await refreshAfterProfile(); toast('ありがとう。提案に反映します'); }
      break;
    /* avatar maker */
    case 'mk-tab': makerTab = v; document.getElementById('maker').innerHTML = makerHTML(S.av); break;
    case 'mk': { const key = t.dataset.key; S.av[key] = +v; save(); document.getElementById('maker').innerHTML = makerHTML(S.av); break; }
    /* intro */
    case 'intro-back': introStep = Math.max(0, introStep - 1); if (introStep === 0) splashSkipped = true; render(); break;
    case 'intro-skip': case 'intro-next':
      if (introStep === 0 && !splashSkipped && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && Date.now() - splashT0 < 3400) { splashSkipped = true; const el = document.getElementById('splash'); if (el) el.classList.add('skip'); break; }
      if (introStep === 1 && !(S.nickSet && S.nick.trim())) break;
      if (INTRO[introStep] === 'adventure') { S.profileAsked = true; save(); }
      if (introStep < INTRO.length - 1) { introStep++; render(); } else { S.onboarded = true; S.profileAsked = true; S.tutorialSeen = false; save(); tutStep = 0; ov = 'tutorial'; render(); } break;
    case 'q1': S.goalCat = v; save(); render(); break;
    case 'q2': S.block = v; save(); render(); break;
    case 'stage-intro': S.stage = +v; save(); render(); break;
    /* tutorial */
    case 'tut-next': if (tutStep < TUT.length - 1) { tutStep++; render(); } break;
    case 'tut-back': if (tutStep > 0) { tutStep--; render(); } break;
    case 'tut-skip': clearInterval(tutTimer); S.tutorialSeen = true; save(); ov = null; render(); break;
    case 'tut-plan': clearInterval(tutTimer); S.tutorialSeen = true; save(); ov = null; tab = 'today'; render(); break;
    case 'tut-replay': tutStep = 0; ov = 'tutorial'; render(); break;
  }
}
root.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.tagName === 'SUMMARY') return;
  return handle(t).catch(err => { busy = false; console.error(err); toast('うまく処理できませんでした。もう一度お試しください'); });
});
root.addEventListener('input', (e) => {
  if (e.target.id === 'nick') { S.nick = e.target.value.trim() || 'あなた'; S.nickSet = true; save(); }
  if (e.target.id === 'nick-intro') { const v = e.target.value.trim(); S.nick = v || 'あなた'; S.nickSet = !!v; save(); const b = root.querySelector('[data-act=intro-next]'); if (b) { b.disabled = !v; b.classList.toggle('ready', !!v); } }
  if (e.target.id === 'ci-dt') { ci.dt = e.target.value; const b = root.querySelector('[data-act=ask-next]'); if (b) b.disabled = !ci.dt; }
  if (e.target.id === 'sch-date' && sch) sch.d = e.target.value;
  if (e.target.id === 'sch-time' && sch) sch.t = e.target.value;
  if (e.target.id === 'fac-area' && fx) fx.areaQ = e.target.value;
  if (e.target.id === 'sl-bed' || e.target.id === 'sl-wake') {
    const k = e.target.id === 'sl-bed' ? 'usualBedtime' : 'usualWakeTime'; const val = e.target.value;
    S.sleep[k] = /^\d{1,2}:\d{2}$/.test(val) ? val : null; profDirty = true; save();
    const pv = document.getElementById('sl-preview'); if (pv) pv.innerHTML = sleepPreviewHTML();
  }
});
setInterval(() => { if (ov === 'doing') { const t = document.getElementById('tm'); if (t) t.textContent = elapsed(); } }, 1000);
if (!S.onboarded) ov = 'intro';
render();
if (loadInfo && loadInfo.warnings.includes('corrupt')) toast('保存データを読み込めなかったため、復旧しました');
else if (loadInfo && loadInfo.source === 'migrated-v1') toast('新しいバージョンにデータを引き継ぎました');

/* テスト・デバッグ用の窓口 */
window.NARA_APP = { get state() { return S; }, get fx() { return fx; }, facSvc, facDB, handle, render, buildPlan, save, isRestMode, nudgesAllowed, todayRest, get ci() { return ci; }, set ci(v) { ci = v; }, get ov() { return ov; }, get tab() { return tab; } };

</script>
</body>
</html>
