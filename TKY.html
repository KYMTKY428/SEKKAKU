<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}

  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}

<script>

function guessCat(text){ const t=String(text||''); let best='other',score=0; for(const [c,kws] of Object.entries(CAT_KW)){ const n=kws.reduce((a,k)=>a+(t.includes(k)?1:0),0); if(n>score){score=n;best=c;} } return best; }
function wishToT(title){ const t=title.trim(); if(/みたい$/.test(t)) return t.replace(/みたい$/,'みた'); if(/行きたい$/.test(t)) return t.replace(/行きたい$/,'行ってみた'); if(/たい$/.test(t)) return `「${t.replace(/たい$/,'')}」をやってみた`; return `${t}をやってみた`; }
function docsOf(r){ const arr = Array.isArray(r) ? r : (r && (r.docs || r.items || r.results || r.documents)) || []; return arr.map(d=>({id: d.id ?? (d.ref && d.ref.id) ?? (typeof d.path==='string' ? d.path.split('/').pop() : undefined), data: typeof d.data==='function' ? d.data() : (d.data !== undefined ? d.data : (d.value !== undefined ? d.value : d))})); }
function dataOf(r){ if(!r) return null; if(typeof r.data==='function') return r.data(); if(r.exists===false) return null; return r.data!==undefined ? r.data : (r.value!==undefined ? r.value : r); }

async function flushLogs(){

async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    B.user=user;
    try{ B.isAdmin = !!(user && (user.canEdit ? await user.canEdit() : (user.isOwner ? await user.isOwner() : false))); }catch(e){}
    if(!db||!user||!user.id) { render(); return; }
    const id=await user.id(); if(!id) return;
    B.db=db; B.uid=id;
    B.stateRef=db.doc(`data/users/${id}/state`);
    let remote=null; try{ remote=dataOf(await B.stateRef.get()); }catch(e){}
    if(remote&&Array.isArray(remote.entries)){
      S=Object.assign(blank(),remote,{settings:Object.assign(blank().settings,remote.settings||{}),profile:Object.assign(blank().profile,remote.profile||{})});
      try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
    } else if(S.entries.length||S.wishes.length||S.profile.set){ B.stateRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{}); }
    try{ const l=dataOf(await db.doc(`logs/${id}`).get()); if(l&&Array.isArray(l.events)) LOGS=l.events; }catch(e){}
    logsLoaded=true; flushLogs();
    B.ready=true; render();
    if(!S.profile.set) setTimeout(()=>openProfile(true),400);
  }catch(e){ render(); }
}
async function getSample(){ if(B.sampleTried) return B.sample; B.sampleTried=true; try{ B.sample=window.claude&&window.claude.use?await window.claude.use('sample'):null; }catch(e){ B.sample=null; } return B.sample; }

function pickSuggestion(){
  const now=new Date(),h=now.getHours(),dow=now.getDay(),holiday=dow===0||dow===6;
  const durs=holiday?['min5','min30','holiday']:(h>=17?['min5','min30']:['min5']);
  const skipped=new Set(S.events.filter(e=>e.action==='skip'&&daysAgo(e.on)<30).map(e=>e.sid));
  const wished=new Set(S.wishes.filter(w=>w.suggestion_id).map(w=>w.suggestion_id));
  const done=new Set(S.entries.filter(e=>e.suggestion_id).map(e=>e.suggestion_id));
  const pool=SUGGESTIONS.filter(s=>durs.includes(s.duration)&&!skipped.has(s.id)&&!wished.has(s.id)&&!done.has(s.id));
  if(!pool.length) return null;
  const cc={}; S.entries.forEach(e=>cc[e.category_code]=(cc[e.category_code]||0)+1); const avg=S.entries.length/CATS.length;
  const w=pool.map(s=>(cc[s.cat]||0)<avg?1.5:1); const tot=w.reduce((a,b)=>a+b,0);
  const seed=[...today()].reduce((a,c)=>(a*31+c.charCodeAt(0))%100003,7); const rr=(seed%1000)/1000*tot;
  let acc=0; for(let i=0;i<pool.length;i++){ acc+=w[i]; if(rr<=acc) return pool[i]; } return pool[0];
}

function niceMax(n){ if(n<=4) return 4; const p=10**Math.floor(Math.log10(n)); for(const m of [1,2,2.5,5,10]) if(m*p>=n) return m*p; return n; }
function stackChart(range){
  const list=[...S.entries].sort((a,b)=>a.done_on.localeCompare(b.done_on));
  const t=today(); const y0=t.slice(0,4)+'-01-01';
  const src = range==='year' ? list.filter(e=>e.done_on>=y0) : list;
  if(!src.length) return `<div class="empty small">記録すると、ここに積み上がっていきます</div>`;
  let start = range==='year' ? y0 : src[0].done_on;
  if(dayN(t)-dayN(start)<6){ const d=new Date(t+'T00:00:00'); d.setDate(d.getDate()-6); start=iso(d); }
  const s0=dayN(start), s1=dayN(t), span=s1-s0;
  const per={}; src.forEach(e=>{ const k=dayN(e.done_on); per[k]=(per[k]||0)+1; });
  const pts=[]; let c=0; for(let d=s0; d<=s1; d++){ c+=per[d]||0; pts.push([d,c]); }
  const total=c, ymax=niceMax(total);
  const W=340,H=200,L=28,R=58,T=14,Bm=28, pw=W-L-R, ph=H-T-Bm;
  const X=d=>L+(d-s0)/span*pw, Y=v=>T+ph-(v/ymax)*ph;
  const line=pts.map(([d,v],i)=>`${i?'L':'M'}${X(d).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  // step look: stacked feels like stairs
  let step=''; pts.forEach(([d,v],i)=>{ const x=X(d).toFixed(1), y=Y(v).toFixed(1); if(!i) step=`M${x} ${y}`; else { step+=`H${x}V${y}`; } });
  const area=`${step}V${Y(0)}H${X(s0)}Z`;
  const ticks=[0,ymax/2,ymax];
  // month labels
  const ml=[]; const sd=new Date(start+'T00:00:00'); let m=new Date(sd.getFullYear(),sd.getMonth()+1,1);
  while(dayN(iso(m))<=s1){ ml.push(iso(m)); m=new Date(m.getFullYear(),m.getMonth()+1,1); }
  const every=Math.ceil(ml.length/5)||1;
  const xl=(ml.length?ml.filter((_,i)=>i%every===0).map(d=>[dayN(d),`${Number(d.slice(5,7))}月`]):[[s0,md(start)]]);
  const ex=X(s1), ey=Y(total);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="これまでのやってみたの積み重ね、合計${total}個">
    ${ticks.map(v=>`<line x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--sub)">${v}</text>`).join('')}
    <path d="${area}" fill="var(--marker)" opacity=".55"/>
    <path d="${step}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
    ${xl.map(([d,l])=>`<line x1="${X(d)}" x2="${X(d)}" y1="${T+ph}" y2="${T+ph+4}" stroke="var(--sub)"/><text x="${X(d)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--sub)">${l}</text>`).join('')}

function monthChart(){
  const t=today(); const cur=new Date(Number(t.slice(0,4)),Number(t.slice(5,7))-1,1);
  const first=S.entries.length?S.entries.map(e=>e.done_on).sort()[0].slice(0,7):t.slice(0,7);
  const months=[]; for(let i=11;i>=0;i--){ const d=new Date(cur.getFullYear(),cur.getMonth()-i,1); months.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }
  let ms=months.filter(m=>m>=first); if(ms.length<6) ms=months.slice(-6);
  const counts=ms.map(m=>entriesIn(m).length); const ymax=niceMax(Math.max(1,...counts));
  if(!S.entries.length) return `<div class="empty small">記録すると、月ごとの数がここに並びます</div>`;
  const W=340,H=190,L=10,R=10,T=22,Bm=26,pw=W-L-R,ph=H-T-Bm; const slot=pw/ms.length, bw=Math.min(30,slot*.62);

    <line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line)"/>
    ${ms.map((m,i)=>{ const n=counts[i], h=n?Math.max(4,n/ymax*ph):0, x=L+slot*i+(slot-bw)/2, y=T+ph-h, isCur=m===t.slice(0,7);
      const lab=Number(m.slice(5)); const yr=(i===0||m.slice(5)==='01')?`<tspan font-size="8.5" dx="1">'${m.slice(2,4)}</tspan>`:'';
      return `${n?`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${isCur?'var(--blue)':'var(--marker)'}" stroke="var(--ink)" stroke-width="2"/>`:''}
      ${n?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${n}</text>`:''}
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${isCur?'var(--ink)':'var(--sub)'}" font-weight="${isCur?700:400}">${lab}月${yr}</text>`; }).join('')}
  </svg>`;
}

function heuristic(text){
  const parts=text.replace(/\s+/g,'').split(/[。！!？?\n]/).filter(Boolean);
  const kIdx=parts.findIndex(p=>/(から|ので|なんとなく|せっかく|誘われ|すすめ|気になって|見て)/.test(p));
  const t=parts[0]||text, k=kIdx>0?parts[kIdx]:'', y=parts.length>1&&parts.length-1!==kIdx?parts[parts.length-1]:'';
  let mood=null; if(/最高|すごくよかった|めっちゃ/.test(y)) mood=5; else if(/楽しかった|よかった|嬉しかった|おいしかった|美味しかった|意外と/.test(y)) mood=4; else if(/まあまあ|普通/.test(y)) mood=3; else if(/微妙|イマイチ/.test(y)) mood=2; else if(/合わなかった|疲れた|しんどかった/.test(y)) mood=1;
  const trg=TRIGGERS.filter(([c,l])=>k.includes(l.replace('だから',''))||(c==='sasowareta'&&/誘われ/.test(k))||(c==='susumerareta'&&/すすめ|勧め/.test(k))||(c==='sns'&&/SNS|インスタ|Instagram|TikTok/.test(k))).map(x=>x[0]);
  return {t_text:t.replace(/^(今日|昨日)(、)?/,'').slice(0,40),k_trigger_codes:trg,k_text:k,y_mood:mood,y_text:y,y_tags:/またやりたい/.test(y)?['mata_yaritai']:[],category_code:guessCat(text),is_wish:/やってみたい$|行ってみたい$/.test(parts.at(-1)||''),done_on_hint:/昨日/.test(text)?'yesterday':'today',_fallback:true};
}
async function structure(text){
  const out=$('#tout'); $('#tgo').disabled=true; out.innerHTML=`<div class="thinking"><span class="dot"></span>ちょっと整理中…</div>`;
  const t0=Date.now(); let r=null; const s=await getSample();
  if(s){
    const prompt=`あなたは「とりあえずやってみたこと」を短く整理する係です。次の話をJSONだけで返してください。
ルール：本人の言葉をできるだけ残し、言っていないことは足さない。t_text は「〜してみた」「〜に行った」の形で30字以内。k・y の情報が話になければ null（推測で埋めない）。「挑戦」「成長」「目標」「成功」「失敗」「努力」「習慣」は使わない。反省や次のアクションは書かない。
k_trigger_codes は次から該当するものだけ：${TRIGGERS.map(t=>t[0]+'='+t[1]).join(', ')}
y_mood は 5=かなりよかった 4=よかった 3=まあまあ 2=微妙 1=合わなかった、読めなければ null。y_tags は mata_yaritai / igai_to / ikkai_de_manzoku / awanakatta から。category_code は ${CATS.map(c=>c[0]+'='+c[1]).join(', ')} から1つ。done_on_hint は today / yesterday。まだやっていない「やってみたい」話なら is_wish=true。
形式：{"t_text":"","k_trigger_codes":[],"k_text":null,"y_mood":null,"y_text":null,"y_tags":[],"category_code":"other","done_on_hint":"today","is_wish":false}
話：${text}`;
    try{ r=typeof s.json==='function'?await s.json(prompt,{modelTier:'quick'}):null; if(!r){ const tt=await s(prompt,{modelTier:'quick'}); const m=(tt.text||'').match(/\{[\s\S]*\}/); r=m?JSON.parse(m[0]):null; } }catch(e){ r=null; }
  }
  if(!r||!r.t_text) r=heuristic(text);
  log('ai_structured',{fallback:!!r._fallback,aiMs:Date.now()-t0,len:text.length});
  const d=new Date(); if(r.done_on_hint==='yesterday') d.setDate(d.getDate()-1);
  draft={t_text:softenNG(r.t_text||''),k_trigger_codes:(r.k_trigger_codes||[]).filter(c=>TL[c]),k_text:softenNG(r.k_text||''),y_mood:[1,2,3,4,5].includes(r.y_mood)?r.y_mood:null,y_text:softenNG(r.y_text||''),y_tags:r.y_tags||[],category_code:CL[r.category_code]?r.category_code:guessCat(text),done_on:iso(d),kind:'spontaneous',input_method:'voice',transcript:text,shared:S.settings.shareDefault,_fb:!!r._fallback};
  if(r.is_wish){
    out.innerHTML=`<div class="card confirm"><div>これはまだ「やってみたい」かも。</div><div class="row"><button class="pill primary" id="asw">やってみたいに入れとく</button><button class="pill" id="asr">やってみたとして残す</button></div></div>`;
    $('#asw').addEventListener('click',()=>{ addWish({title:(r.t_text||text).replace(/してみた$/,'してみたい').slice(0,60),trigger_text:draft.k_text},'talk'); closeSheet(); render(); toast('','やってみたいに入れました'); });
    $('#asr').addEventListener('click',()=>drawConfirm(out,text)); return;
  }
  drawConfirm(out,text);
}

  sheet(`<div class="sheettop"><h3>${first?'はじめまして':'アイコンを選ぶ'}</h3><button class="x" data-close aria-label="閉じる">×</button></div>
  ${first?'<div class="note">「みんな」タブでほかの人に見えるアイコンとニックネームです。あとから変えられます。</div>':''}
  <div style="display:flex;justify-content:center" id="pv">${avatarSVG(av,'av lg')}</div>
  <div class="avgrid">${AVATARS.map(a=>`<button class="avopt ${a.id===av?'on':''}" data-av="${a.id}" aria-pressed="${a.id===av}">${avatarSVG(a.id)}${a.name}</button>`).join('')}</div>
  <div class="q"><label class="qq" for="nn" style="font-size:14px">ニックネーム</label><input class="field" id="nn" maxlength="16" placeholder="ななしのTKY" value="${esc(S.profile.nickname)}"></div>
  <button class="save" id="psave">これにする</button>`);
  $('#sheetRoot').querySelectorAll('[data-av]').forEach(b=>b.addEventListener('click',()=>{ av=b.dataset.av; $('#pv').innerHTML=avatarSVG(av,'av lg'); $('#sheetRoot').querySelectorAll('[data-av]').forEach(x=>{ x.classList.toggle('on',x.dataset.av===av); x.setAttribute('aria-pressed',x.dataset.av===av); }); }));
  $('#psave').addEventListener('click',()=>{ S.profile.avatar=av; S.profile.nickname=$('#nn').value.trim().slice(0,16); S.profile.set=true; persist(); syncFeed(); log('avatar_set',{avatar:av}); closeSheet(); render(); toast('よろしく！','アイコンを変えました'); });
}

/* ---- samples ---- */
function loadSamples(){
  const t=new Date(); const dd=n=>{ const d=new Date(t); d.setDate(d.getDate()-n); return iso(d); };
  const mk=(n,T,kc,K,m,Y,cat)=>({id:uid(),t_text:T,k_trigger_codes:kc,k_text:K,y_mood:m,y_text:Y,y_tags:/またやりたい/.test(Y)?['mata_yaritai']:[],category_code:cat,category_source:'ai',kind:'spontaneous',wish_id:null,suggestion_id:null,input_method:'text',transcript:null,done_on:dd(n),created_at:Date.now()-n*864e5,updated_at:Date.now(),sample:true,shared:false});
  const data=[[0,'初めて朝カフェに行った',['jikan'],'少し早く起きたから',4,'思ったより落ち着いた','taberu'],[2,'一駅歩いてみた',['nantonaku'],'天気がよくて',5,'またやりたい','undou'],[4,'ChatGPTで資料を作ってみた',['hitsuyou'],'締切が近かった',4,'思ったより簡単だった','shigoto'],[6,'同僚に誘われてボルダリング',['sasowareta'],'',3,'腕がパンパン','undou'],[9,'行ったことのない駅で降りた',['sekkaku'],'せっかくの休みだったから',5,'いい古本屋があった','iku'],[12,'いつもと違うコーヒーを頼んだ',['nantonaku'],'',2,'一回で満足','taberu'],
   [19,'一人で焼肉に行った',['nantonaku'],'',4,'意外と平気','taberu'],[26,'陶芸体験に行った',['kininatteta'],'前から気になってた',5,'またやりたい','tsukuru'],[33,'朝ヨガをやってみた',['sns'],'',3,'',"undou"],[38,'久しぶりの友だちに連絡した',['nantonaku'],'',5,'今度ごはん','hito'],[45,'知らないジャンルの本を買った',['chikaku'],'本屋の前を通ったから',4,'','kau'],[52,'カラオケで新曲を歌った',['sasowareta'],'',4,'楽しかった','asobu'],[60,'美術館に行った',['sekkaku'],'',5,'またやりたい','iku'],[71,'AIで旅行プランを作った',['jikan'],'',4,'便利','shigoto'],[83,'キムチ鍋を作った',['nantonaku'],'',4,'','tsukuru'],[95,'サウナに初めて入った',['sasowareta'],'',5,'ととのった','asobu']];
  data.forEach(a=>S.entries.push(mk(...a)));
  addWish({title:'韓国料理を作ってみたい',temperature:'soon',sample:true});
  addWish({title:'上野の展示に行きたい',trigger_codes:['kininatteta'],temperature:'planned',sample:true});
  addWish({title:'一人旅をしてみたい',trigger_codes:['sns'],trigger_text:'Instagramで見て気になった',temperature:'someday',sample:true});
  log('sample_loaded',{}); persist(); render(); toast('見本です','自分のグラフで消せます');
}

/* ================= events ================= */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button'); if(!b||b.disabled) return; const D=b.dataset;
  if(D.close!==undefined){ closeSheet(); return; }
  if(D.tab){ tab=D.tab; try{ localStorage.setItem('tky-tab',tab); }catch(e){} log('tab_view',{tab}); if(tab==='feed'&&!FEED.loading) loadFeed(); render(); window.scrollTo(0,0); return; }
  if(D.open==='form'){ openForm({},'button'); return; }
  if(D.open==='talk'){ openTalk(); return; }
  if(D.open==='wish'){ openWishForm(); return; }
  if(D.edit){ openForm({editId:D.edit}); return; }
  if(D.wdone){ wishDone(D.wdone); return; }
  if(D.wlet){ const w=S.wishes.find(x=>x.id===D.wlet); if(w){ w.status='let_go'; w.closed_at=Date.now(); log('wish_let_go',{}); persist(); render(); toast('','そっと置いておきました'); } return; }
  if(D.sugg){ log('sugg_open',{sid:D.sugg}); openSugg(D.sugg); return; }
  if(D.bannerx){ S.settings.bannerOffOn=today(); S.events.push({sid:D.bannerx,action:'skip',on:today(),where:'banner'}); log('sugg_action',{sid:D.bannerx,action:'skip',where:'banner'}); persist(); renderFloat(); return; }
  if(D.try){ const s=SUGGESTIONS.find(x=>x.id===D.try); S.events.push({sid:s.id,action:'try_now',on:today()}); log('sugg_action',{sid:s.id,action:'try_now'}); persist(); closeSheet(); tab='home'; render(); window.scrollTo(0,0); toast('いってらっしゃい','やったら教えてね'); return; }
  if(D.doneSugg){ const s=SUGGESTIONS.find(x=>x.id===D.doneSugg); openForm({t_text:s.t,kind:'suggested',suggestion_id:s.id,category_code:s.cat},'suggestion'); return; }
  if(D.swish){ const s=SUGGESTIONS.find(x=>x.id===D.swish); addWish({title:s.text,source:'suggestion',suggestion_id:s.id,category_code:s.cat},'suggestion'); S.events.push({sid:s.id,action:'saved',on:today()}); log('sugg_action',{sid:s.id,action:'saved'}); persist(); closeSheet(); render(); toast('','やってみたいに入れました'); return; }
  if(D.skip){ S.events.push({sid:D.skip,action:'skip',on:today(),where:D.where}); if(D.where==='banner') S.settings.bannerOffOn=today(); log('sugg_action',{sid:D.skip,action:'skip'}); persist(); closeSheet(); render(); toast('','また今度'); return; }
  if(D.sample){ loadSamples(); return; }
  if(D.clearsample){ S.entries=S.entries.filter(e=>!e.sample); S.wishes=S.wishes.filter(w=>!w.sample); persist(); render(); toast('','見本を消しました'); return; }
  if(D.rf){ view.recFilter=D.rf; render(); return; }
  if(D.chart){ view.chart=D.chart; log('chart_view',{chart:D.chart}); render(); return; }
  if(D.range){ view.range=D.range; render(); return; }
  if(D.rm){ view.refMode=D.rm; render(); return; }
  if(D.rp){ const st=Number(D.rp); if(view.refMode==='month'){ const [y,m]=view.refMonth.split('-').map(Number); const d=new Date(y,m-1+st,1); view.refMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; } else view.refYear=String(Number(view.refYear)+st); render(); return; }
  if(D.profile){ openProfile(); return; }
  if(D.feedreload){ loadFeed(); return; }
  if(D.rx){ const key=D.key, code=D.rx, prev=S.myReacts[key]; const agg=FEED.reacts[key]=FEED.reacts[key]||{};
    if(prev){ agg[prev]=Math.max(0,(agg[prev]||1)-1); }
    if(prev===code){ delete S.myReacts[key]; } else { S.myReacts[key]=code; agg[code]=(agg[code]||0)+1; }
    log('reaction',{code:prev===code?'remove':code}); persist(); syncReacts(); render();
    if(code==='yaritai'&&prev!==code){ addWish({title:D.t.replace(/てみた$/,'てみたい').replace(/(行った|やった)$/,'$1みたい'),trigger_text:'みんなのTKYで見た',trigger_codes:['kininatteta']},'feed'); toast('いいね','やってみたいにも入れました'); }
    return; }
  if(D.adminload){ loadAdmin(); return; }
  if(D.copytsv){ const txt=toTable(ADM.rows||[],'\t'); try{ await navigator.clipboard.writeText(txt); toast('コピーした','スプレッドシートに貼り付けてね'); }catch(e){ sheet(`<div class="sheettop"><h3>手動でコピー</h3><button class="x" data-close aria-label="閉じる">×</button></div><textarea class="field" id="tsv" style="min-height:240px;font-size:12px">${esc(txt)}</textarea>`); const t=$('#tsv'); t.focus(); t.select(); } return; }
  if(D.csv){ const txt='﻿'+toTable(ADM.rows||[],','); try{ if(!B.downloads) B.downloads=await window.claude.use('downloads'); if(!B.downloads) throw 0; const name=`tky-beta-logs-${today()}.csv`; try{ await B.downloads.save({filename:name,data:new Blob([txt],{type:'text/csv'})}); }catch(e1){ await B.downloads.save({filename:name,data:txt}); } }catch(e){ toast('','保存できなかったので「コピー」を使ってください'); } return; }
  if(b.id==='digest'){ S.settings.monthlyDigest=!S.settings.monthlyDigest; log('setting',{monthlyDigest:S.settings.monthlyDigest}); persist(); render(); return; }
  if(b.id==='shareDef'){ S.settings.shareDefault=!S.settings.shareDefault; persist(); render(); return; }
});
$('#fab').addEventListener('click',()=>openForm({},'fab'));
$('#meBtn').addEventListener('click',()=>openProfile());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

loadLocal(); render(); log('session_start',{tab}); connect();
if(tab==='feed') setTimeout(loadFeed,1500);
})();
</script>
