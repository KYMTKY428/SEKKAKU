<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F8F3">
<title>セッカク（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F4F8F3; --surface: #FFFFFF; --ink: #33261D; --muted: #75665A;
  --mint: #82CC9F; --mint-deep: #2F6F62; --mint-tint: #E2F2EA; --on-mint: #1F4A41;
  --pink: #F9A99F; --pink-tint: #FCE6E0; --sun: #F7C948; --sun-tint: #FDF1C9;
  --leaf: #6BAE45; --bark: #7A4B2E; --line: #E1E8DF; --shadow: 0 6px 20px rgba(47,111,98,.10);
  --page: #E6EEE7; --btn: #2F6F62; --btn-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15201C; --surface: #1F2C27; --ink: #F2EDE5; --muted: #A9B8AF;
    --mint: #6FBF9D; --mint-deep: #8FD9B7; --mint-tint: #243A31; --on-mint: #D6F2E6;
    --pink: #E58D7C; --pink-tint: #3B2A27; --sun: #F3C340; --sun-tint: #3A3420;
    --leaf: #86C45A; --bark: #C89A6C; --line: #2F3E37; --shadow: 0 6px 20px rgba(0,0,0,.35);
    --page: #0F1714; --btn: #2B7A65; --btn-ink: #FFFFFF;
  }
}
:root[data-theme="dark"] {
  --bg: #15201C; --surface: #1F2C27; --ink: #F2EDE5; --muted: #A9B8AF;
  --mint: #6FBF9D; --mint-deep: #8FD9B7; --mint-tint: #243A31; --on-mint: #D6F2E6;
  --pink: #E58D7C; --pink-tint: #3B2A27; --sun: #F3C340; --sun-tint: #3A3420;
  --leaf: #86C45A; --bark: #C89A6C; --line: #2F3E37; --shadow: 0 6px 20px rgba(0,0,0,.35);
  --page: #0F1714; --btn: #2B7A65; --btn-ink: #FFFFFF;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--page); color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.65; font-weight: 500; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 12px; }
img { display: block; }

.phone { position: relative; width: 100%; max-width: 430px; height: 100%; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 520px) {
  body { display: flex; align-items: center; justify-content: center; }
  .phone { height: min(880px, 100%); border-radius: 34px; box-shadow: 0 24px 70px rgba(31,74,65,.25); border: 1px solid var(--line); }
}

/* ---- top bar ---- */
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 6px; flex: none; }
.wordmark { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; letter-spacing: .04em; color: var(--mint-deep); }
.wordmark img { height: 30px; width: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--mint-tint); color: var(--on-mint); min-height: 32px; }
.chip.sun { background: var(--sun-tint); }
.chip.pink { background: var(--pink-tint); }
.chip.plain { background: var(--surface); border: 1px solid var(--line); color: var(--muted); }

.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 24px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; min-height: 56px; font-size: 12px; font-weight: 700; color: var(--muted); border-radius: 16px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--mint-deep); background: var(--mint-tint); }

/* ---- hero ---- */
.hero { position: relative; margin-top: 6px; padding: 22px 18px 18px; border-radius: 34px 34px 34px 10px; background: var(--mint-tint); display: grid; grid-template-columns: 1fr 140px; gap: 6px; align-items: end; overflow: hidden; }
.hero .say { align-self: center; }
.bubble { position: relative; background: var(--surface); border-radius: 22px 22px 22px 6px; padding: 14px 16px; box-shadow: var(--shadow); font-weight: 700; font-size: 16px; line-height: 1.6; }
.bubble small { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.hero img { width: 140px; height: auto; margin-bottom: -4px; }
.hero .sun-mark { position: absolute; right: -26px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--sun-tint); }

.cta { width: 100%; margin-top: 14px; min-height: 58px; border-radius: 22px; background: var(--btn); color: var(--btn-ink); font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 18px rgba(47,111,98,.28); }
.cta.sun { background: var(--sun); color: #3A2A1A; box-shadow: 0 8px 18px rgba(247,201,72,.35); }
.cta.ghost { background: var(--surface); color: var(--mint-deep); border: 2px solid var(--mint); box-shadow: none; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 16px; font-weight: 700; background: var(--surface); border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.main { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.btn.sun { background: var(--sun); color: #3A2A1A; border-color: transparent; }
.btn.block { width: 100%; }

.h2 { font-size: 17px; font-weight: 900; margin: 26px 0 10px; }
.sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* segmented stage control */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; background: var(--surface); border-radius: 20px; border: 1px solid var(--line); }
.seg button { min-height: 46px; border-radius: 15px; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.25; padding: 4px 2px; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }

/* planned card */
.plan { border-radius: 26px; background: var(--sun-tint); padding: 16px; }
.plan .t { font-size: 19px; font-weight: 900; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.meta span { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface); color: var(--muted); }

/* week dots */
.week { display: flex; justify-content: space-between; }
.week div { text-align: center; font-size: 11px; color: var(--muted); }
.week i { display: block; width: 30px; height: 30px; margin: 0 auto 4px; border-radius: 50%; background: var(--line); }
.week i.on { background: var(--leaf); }
.week i.today { box-shadow: 0 0 0 3px var(--sun); }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--sun); border-radius: 999px; transition: width .5s; }

/* overlays */
.overlay { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 20; }
.ohead { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
.ohead .back { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; }
.ohead img { height: 38px; width: auto; }
.ohead .ttl { font-weight: 900; font-size: 16px; line-height: 1.3; }

/* chat */
.chat { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; animation: pop .28s ease-out both; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg img.av { width: 38px; height: auto; flex: none; }
.msg .b { background: var(--surface); padding: 11px 15px; border-radius: 20px 20px 20px 6px; box-shadow: var(--shadow); font-weight: 700; }
.msg.me .b { background: var(--btn); color: var(--btn-ink); border-radius: 20px 20px 6px 20px; box-shadow: none; }
.typing .b { display: flex; gap: 5px; padding: 15px 16px; }
.typing .b i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: blink 1s infinite both; }
.typing .b i:nth-child(2) { animation-delay: .15s; } .typing .b i:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.choices { flex: none; padding: 10px 16px 16px; background: var(--bg); border-top: 1px solid var(--line); }
.choices .grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { min-height: 48px; padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 2px solid var(--mint); color: var(--mint-deep); font-weight: 900; }
.pick:active { background: var(--mint-tint); }
.txt { width: 100%; min-height: 48px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; font: inherit; }
textarea.txt { resize: none; min-height: 84px; }

/* proposals */
.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 10px; margin: 0 -2px; }
.car::-webkit-scrollbar { display: none; }
.card { flex: 0 0 82%; scroll-snap-align: center; background: var(--surface); border-radius: 26px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.card .top2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 { margin: 0; font-size: 19px; line-height: 1.45; font-weight: 900; }
.reason { font-weight: 700; background: linear-gradient(transparent 58%, var(--sun-tint) 58%); padding: 0 2px; }
.card ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.card li::before { content: "✓ "; color: var(--leaf); font-weight: 900; }
.pr { font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 6px; background: var(--pink-tint); color: var(--pink); border: 1px solid var(--pink); }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--mint-deep); width: 22px; border-radius: 6px; }

/* sheets */
.scrim { position: absolute; inset: 0; background: rgba(30,24,18,.45); z-index: 30; display: flex; align-items: flex-end; animation: fade .2s both; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); animation: up .26s ease-out both; }
.sheet .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 46px; padding: 6px 16px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; }
.opt[aria-pressed="true"] { border-color: var(--mint-deep); background: var(--mint-tint); color: var(--on-mint); }

/* log */
.tree { background: var(--mint-tint); border-radius: 30px; padding: 12px 12px 8px; }
.tree svg { width: 100%; height: auto; display: block; }
.sprout { transform-box: fill-box; transform-origin: 0 50%; animation: sprout 1.1s .25s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes sprout { from { transform: scale(0); } to { transform: scale(1); } }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
.legend div { text-align: center; font-size: 12px; font-weight: 700; padding: 6px 2px; border-radius: 12px; background: var(--surface); }
.legend b { display: block; font-size: 15px; color: var(--mint-deep); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tl .d { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.3; }
.tl .tt { font-weight: 900; line-height: 1.4; }
.tl .skip .tt { color: var(--muted); font-weight: 700; }
.badge { display: grid; place-items: center; text-align: center; gap: 4px; padding: 10px 6px; border-radius: 18px; background: var(--sun-tint); font-size: 12px; font-weight: 700; min-height: 86px; }
.badge.off { background: var(--line); opacity: .55; }
.badge em { font-style: normal; font-size: 24px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.note { border-radius: 18px; background: var(--sun-tint); padding: 12px 14px; font-weight: 700; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 8px; background: var(--line); color: var(--muted); margin-left: 4px; }

/* radio-like cards */
.choice { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 14px; min-height: 64px; border-radius: 20px; background: var(--surface); border: 2px solid var(--line); }
.choice[aria-pressed="true"] { border-color: var(--mint-deep); background: var(--mint-tint); }
.choice .ck { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.choice[aria-pressed="true"] .ck { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.choice b { display: block; font-size: 15px; }
.choice span { font-size: 13px; color: var(--muted); line-height: 1.4; }

/* done */
.done { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
.done img.big { height: 200px; width: auto; margin: 6px auto 0; }
.confetti { position: absolute; top: -10px; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.8s ease-in forwards; z-index: 50; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 60; animation: pop .25s both; max-width: 90%; text-align: center; }
.intro { flex: 1; overflow-y: auto; padding: 24px 24px 28px; display: flex; flex-direction: column; }
.intro .big { font-size: 30px; line-height: 1.35; font-weight: 900; color: var(--mint-deep); margin: 8px 0 8px; }
.pages { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
.pages i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.pages i.on { background: var(--mint-deep); width: 22px; border-radius: 6px; }


.post { background: var(--surface); border-radius: 24px; padding: 14px; box-shadow: var(--shadow); }
.post + .post { margin-top: 12px; }
.post .who { display: flex; gap: 10px; align-items: center; }
.post .who img { height: 42px; width: auto; flex: none; }
.post .cover { height: 8px; border-radius: 6px; margin: 10px 0 8px; background: var(--mint-tint); }
.post h3 { margin: 0; font-size: 17px; line-height: 1.45; font-weight: 900; }
.post p { margin: 6px 0 0; }
.react { min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); font-weight: 700; background: var(--surface); }
.react[aria-pressed="true"] { background: var(--sun-tint); border-color: var(--sun); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin: 0 -2px; }
.filters::-webkit-scrollbar { display: none; }
.filters .opt { flex: none; min-height: 40px; padding: 4px 14px; }
.choice .grow { flex: 1; min-width: 0; }
.stepcard { background: var(--surface); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
.stepcard + .stepcard { margin-top: 10px; }
.stepcard.done { opacity: .75; background: var(--mint-tint); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

:root { --bg: #F1F3F0; --surface: #FFFFFF; --ink: #16222B; --muted: #5E6B77; --mint: #38B38A; --mint-deep: #12604E; --mint-tint: #E4F0EA; --on-mint: #0E4B3C;
  --pink: #E0705C; --pink-tint: #FAE8E3; --sun: #F2A93B; --sun-tint: #FCEFD6; --leaf: #4C9A3A; --bark: #6B4A2F; --line: #DCE2DE; --btn: #17303B; --btn-ink: #FFFFFF; --page: #E3E8E4;
  --shadow: 0 1px 2px rgba(22,34,43,.06), 0 4px 14px rgba(22,34,43,.06); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1519; --surface: #17222A; --ink: #EDF1EF; --muted: #9AA9B3; --mint: #4CC59B; --mint-deep: #7FD8B8; --mint-tint: #1A2B27; --on-mint: #D2F1E5; --pink: #E58D7C; --pink-tint: #3A2824; --sun: #F2B04A; --sun-tint: #3A3020; --line: #26343D; --btn: #2B5B6B; --page: #0A1013; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); } }
:root[data-theme="dark"] { --bg: #0E1519; --surface: #17222A; --ink: #EDF1EF; --muted: #9AA9B3; --mint: #4CC59B; --mint-deep: #7FD8B8; --mint-tint: #1A2B27; --on-mint: #D2F1E5; --pink: #E58D7C; --pink-tint: #3A2824; --sun: #F2B04A; --sun-tint: #3A3020; --line: #26343D; --btn: #2B5B6B; --page: #0A1013; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); }
.panel, .card, .post, .stepcard, .tree, .plan, .note, .coach { border-radius: 16px; }
.chip { border-radius: 8px; } .chip.plain { border-radius: 8px; }
.cta { border-radius: 14px; min-height: 56px; box-shadow: none; }
.btn { border-radius: 12px; } .opt, .pick, .react { border-radius: 12px; }
.seg { border-radius: 14px; } .seg button { border-radius: 10px; }
.choice { border-radius: 14px; } .tab[aria-current="page"] { border-radius: 12px; }
.tabbar { border-top: 1px solid var(--line); } .tab { border-radius: 12px; }
.wordmark { letter-spacing: .02em; font-weight: 900; color: var(--ink); }
.wordmark img { height: 26px; }
.coach { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; }
.coach img { height: 40px; width: auto; flex: none; }
[data-char="normal"] .coach img { height: 62px; }
[data-char="off"] .chr { display: none !important; }
.init { display: none; width: 34px; height: 34px; border-radius: 50%; background: var(--mint-tint); color: var(--on-mint); place-items: center; font-weight: 900; flex: none; }
[data-char="off"] .init { display: grid; }
.done img.big { height: 120px; }
.mood5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood5 button { min-height: 66px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 2px; }
.mood5 button i { width: 22px; height: 22px; border-radius: 50%; display: block; }
.mood5 button[aria-pressed="true"] { border-color: var(--ink); background: var(--mint-tint); }
.pi { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.pi:first-of-type { border-top: 0; }
.pi .ck2 { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-weight: 900; color: #fff; margin-top: 2px; }
.pi.on .ck2 { background: var(--mint-deep); border-color: var(--mint-deep); }
.pi.on .pt { text-decoration: line-through; color: var(--muted); }
.pi .pt { font-weight: 900; font-size: 16px; line-height: 1.45; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .w { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; }
.cal i { display: block; }
.cal-d { position: relative; aspect-ratio: 1; border-radius: 9px; background: var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #16222B; }
.cal-d.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal-d b { position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.legend2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
.legend2 span { display: inline-flex; align-items: center; gap: 4px; }
.legend2 u { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.pi .row .btn { padding: 0 12px; white-space: nowrap; font-size: 14px; }
.big-n { font-size: 34px; font-weight: 900; color: var(--mint-deep); line-height: 1.1; }

.avs { display: inline-block; border-radius: 50%; overflow: hidden; flex: none; vertical-align: middle; }
.avs svg { display: block; width: 100%; height: 100%; }
.avgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; justify-items: center; }
.avgrid button { border-radius: 50%; padding: 3px; border: 3px solid transparent; line-height: 0; min-width: 48px; min-height: 48px; }
.avgrid button[aria-pressed="true"] { border-color: var(--ink); }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; justify-items: center; }
.swatches button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }

.splash { background: #14212B; color: #fff; padding: 0; }
.splash .box { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 30px 20px; gap: 30px; }
.splash .ln { opacity: 0; animation: lnIn .95s cubic-bezier(.2,.7,.2,1) forwards; font-weight: 700; line-height: 1.6; }
.splash .l1 { font-size: 27px; font-weight: 900; line-height: 1.5; animation-delay: .4s; }
.splash .l2 { font-size: 17px; color: #B9C6CF; animation-delay: 1.9s; }
.splash .l3 { font-size: 21px; animation-delay: 3.5s; }
.splash .brand { color: #F2A93B; font-weight: 900; white-space: nowrap; }
.splash .ctaw { opacity: 0; animation: lnIn .8s ease forwards; animation-delay: 5s; padding: 0 24px calc(26px + env(safe-area-inset-bottom, 0px) * 0); }
.splash .cta { background: #F2A93B; color: #14212B; margin-top: 0; }
.splash.skip .ln, .splash.skip .ctaw { animation: none; opacity: 1; transform: none; filter: none; }
@keyframes lnIn { from { opacity: 0; transform: translateY(14px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .splash .ln, .splash .ctaw { animation: none !important; opacity: 1; transform: none; filter: none; } }
.introtop { display: flex; align-items: center; min-height: 44px; margin: -6px 0 4px -8px; }
.introtop button { min-height: 44px; padding: 0 12px 0 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; border-radius: 12px; color: var(--muted); }

.tut { background: var(--bg); }
.tuttop { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0; min-height: 52px; }
.tuttop button { min-height: 44px; padding: 0 12px; font-weight: 700; color: var(--muted); border-radius: 12px; }
.tutbody { flex: 1; overflow-y: auto; padding: 4px 22px 12px; }
.tutchar { display: flex; justify-content: center; margin: 6px 0 4px; }
.tutchar img { height: 150px; width: auto; }
.tutchar.big img { height: 210px; }
.tutbub { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-weight: 700; font-size: 16px; line-height: 1.7; box-shadow: var(--shadow); position: relative; }
.tutbub::before { content: ""; position: absolute; top: -8px; left: 50%; width: 14px; height: 14px; background: var(--surface); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.tutstep { font-size: 13px; font-weight: 700; color: var(--mint-deep); margin: 10px 2px 6px; text-align: center; }
.tuttitle { font-size: 22px; font-weight: 900; text-align: center; margin: 0 0 12px; line-height: 1.4; }
.mock { pointer-events: none; user-select: none; margin-top: 14px; }
.mock .opt { display: inline-flex; align-items: center; }
.mock.tree svg { max-height: 190px; width: auto; margin: 0 auto; }
.traits { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.tutfoot { flex: none; padding: 8px 22px calc(18px + env(safe-area-inset-bottom, 0px) * 0); }
</style>

function missions() {

    <div class="mood5">${MOOD5.map(o => `<button data-act="ci" data-key="mood" data-v="${o.k}" aria-pressed="${ci.mood === o.k}"><i style="background:${MOOD_COL[o.k - 1]}"></i>${o.n}</button>`).join('')}</div>
    ${row('使える時間', 'time', TIMES)}${row('場所', 'place', PLACES)}${row('予算', 'budget', BUDGETS)}
    <h2 class="h2" style="margin:16px 0 8px;font-size:15px">ひとこと（任意）</h2>
    <input id="cihint" class="txt" maxlength="60" value="${esc(ci.text)}" placeholder="例：たまたま空いた、雨っぽい、ひとりで" aria-label="ひとこと">
    <button class="cta" data-act="ci-go" ${ci.mood ? '' : 'disabled style="opacity:.5"'}>プランを作る</button>
  </div></div>`;
}
function renderSheet() {
  if (sheet.type === 'checkin') return sheetCheckin();
  if (sheet.type === 'detail') {
    const e = sheet.ev, ctx = todayPlan() ? todayPlan().ctx : (chat ? chat.ctx : { time: 60, place: 'any', mood: 2, hint: {} });
    return `<div class="scrim" data-act="sheet-close"><div class="sheet" data-stop="1">
      <div class="grip"></div>
      <div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn" style="min-height:40px" data-act="sheet-close">閉じる</button></div>
      <div class="row"><span class="chip">${GENRES[e.g].e} ${GENRES[e.g].n}</span>${e.pr ? '<span class="pr">PR</span>' : ''}${lvChip(e.lv)}</div>
      <h3 style="font-size:21px;margin:10px 0 6px;font-weight:900;line-height:1.45">${esc(e.t)}</h3>
      <div class="reason">${esc(hook(e, ctx))}</div>
      <p style="margin:12px 0 0">${esc(e.d)}</p>
      <div class="meta"><span>${timeLabel(e.min)}</span><span>${PLACE_N[e.pl]}</span><span>${costLabel(e.cost)}</span></div>
      <div class="note" style="margin-top:12px">ヒント：${esc(e.tip)}</div>
      ${e.pr ? '<p class="sub" style="margin:10px 0 0">紹介枠のイメージです。デモのため、予約サイトには移動しません。</p>' : ''}
      <button class="cta" data-act="choose" data-v="${e.id}">これにする</button>
      <button class="cta sun" data-act="now" data-v="${e.id}" style="margin-top:10px">いまやる</button>
    </div></div>`;
  }
  const w = sheet.when || {};
  return `<div class="scrim" data-act="sheet-close"><div class="sheet" data-stop="1">
    <div class="grip"></div>
    <div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn" style="min-height:40px" data-act="sheet-close">閉じる</button></div>
    <div class="row"><img class="chr" src="${IMG.p_go}" alt="" style="height:70px;width:auto"><div><div style="font-weight:900;font-size:19px">いつやる？</div><div class="sub">${esc(sheet.ev.t)}</div></div></div>
    <button class="cta sun" data-act="now" data-v="${sheet.ev.id}" style="margin-top:14px">いまやる</button>
    <p class="sub" style="text-align:center;margin:8px 0 0">または、日時を決める</p>
    <h2 class="h2" style="margin-top:12px">日にち</h2>
    <div class="opts">${['今日', '明日', '今週末', 'あとで決める'].map(d => `<button class="opt" data-act="when-day" data-v="${d}" aria-pressed="${w.day === d}">${d}</button>`).join('')}</div>
    <h2 class="h2">時間帯</h2>
    <div class="opts">${['朝', '昼', '夕方', '夜'].map(d => `<button class="opt" data-act="when-time" data-v="${d}" aria-pressed="${w.time === d}">${d}</button>`).join('')}</div>
    <button class="cta" data-act="plan-save" ${w.day ? '' : 'disabled style="opacity:.5"'}>仮の予定に入れる</button>
    <p class="sub" style="text-align:center;margin:8px 0 0">仮なので、あとで日時を変えても大丈夫</p>
  </div></div>`;
}

/* ============ chat engine ============ */
function newChat() { return { step: 0, ctx: { mood: 2, time: 30, place: 'near', budget: 1000, hint: {} }, msgs: [], busy: true, shown: [], redraws: 0 }; }
function botSay(text, face, delay = 650) {
  chat.msgs.push({ typing: true }); chat.busy = true; render();
  return new Promise(res => setTimeout(() => {
    chat.msgs = chat.msgs.filter(m => !m.typing); chat.msgs.push({ bot: text, face }); chat.busy = false; render(); res();
  }, delay));
}
async function startChat() {
  chat = newChat(); ov = 'chat'; S.lastChat = ymd(new Date()); save(); render();
  await botSay('こんにちは！いまの気分はどんな感じ？');
}
const Q = [null, 'いま、どれくらい時間ある？', 'どこでできそう？', 'お金は、どのくらいまでOK？', 'ほかに、いまの様子はある？ たとえば「たまたま空いた」「雨っぽい」「ひとりで」。なければ飛ばしてね。'];
async function answer(key, v) {
  const c = chat; const list = { mood: MOODS, time: TIMES, place: PLACES, budget: BUDGETS }[key];
  const o = list.find(x => String(x.k) === String(v));
  c.ctx[key] = typeof o.k === 'number' ? o.k : o.k;
  c.msgs.push({ me: (o.e ? o.e + ' ' : '') + o.n }); c.step++;
  if (c.step <= 4) await botSay(Q[c.step], c.step === 4 ? IMG.f_wink : IMG.f_normal);
}
async function search(hintText) {
  const c = chat;
  c.ctx.hint = parseHint(hintText || '');
  if (hintText) c.msgs.push({ me: hintText });
  c.step = 5;
  await botSay('ふむふむ。ちょっと探してくるね。', IMG.f_surprise, 500);
  showCards();
}
async function showCards() {
  const c = chat;
  const r = pick(c.ctx, c.shown, 3);
  if (!r.items.length) { await botSay('いまの条件だと見つからなかった…。条件を変えてみよう。', IMG.f_relief); return; }
  r.items.forEach(e => c.shown.push(e.id));
  await botSay(c.redraws ? 'ほかにも探してきたよ。' : 'せっかくだし、こんなのどう？', IMG.f_smile, 450);
  c.msgs.push({ cards: r.items, ctx: JSON.parse(JSON.stringify(c.ctx)), relaxed: r.relaxed }); render();
}

/* ============ actions ============ */
function toast(t) { clearTimeout(toastTimer); const old = document.querySelector('.toast'); if (old) old.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; root.appendChild(d); toastTimer = setTimeout(() => d.remove(), 2200); }
function confetti() {
  if (S.fx < 4) return; const cols = ['#F7C948', '#8FD1B3', '#F2A494', '#6FA33C', '#2F6F62'];
  for (let i = 0; i < 28; i++) { const s = document.createElement('span'); s.className = 'confetti'; s.style.left = Math.random() * 100 + '%'; s.style.background = cols[i % 5]; s.style.animationDelay = Math.random() * .5 + 's'; s.style.transform = 'rotate(' + Math.random() * 180 + 'deg)'; root.appendChild(s); setTimeout(() => s.remove(), 2600); }
}
function savePlan(ev, when) { S.planned = { evId: ev.id, when, createdAt: ymd(new Date()), moodBefore: S.moods[ymd(new Date())] || null }; save(); }
function finishDone() {
  const p = S.planned; const e = evById(p.evId);
  const prevBadges = BADGES.filter(b => b.test(S)).map(b => b.k);
  const prevLv = lvXp().lv;
  S.records.push({ id: ++S.sid, evId: e.id, t: e.t, g: e.g, lv: e.lv, date: ymd(new Date()), kind: 'done', feeling: rf.feeling, note: (document.getElementById('note') || {}).value || rf.note || '', pub: rf.pub === 'yes', nameMode: rf.nameMode || S.nameMode, moodBefore: p.moodBefore || null, moodAfter: rf.moodAfter || null });
  if (rf.moodAfter) S.moods[ymd(new Date())] = rf.moodAfter;
  if (rf.pub === 'yes' && rf.nameMode) S.nameMode = rf.nameMode;
  S.xp += 10 + 10 * e.lv; S.planned = null; S.nextAdjust = null; save();
  const cnt = counts(); fresh = e.g;
  const newBadges = BADGES.filter(b => b.test(S) && !prevBadges.includes(b.k));
  const lvUp = lvXp().lv > prevLv;
  let line = 'お疲れさま。「はじめて」が1つ増えた。'; let extra = '';
  if (S.fx === 1) { line = 'きろくしたよ。'; }
  if (S.fx >= 2) { line = `${GENRES[e.g].n}の枝に、若葉が1枚増えた。`; extra = `<div class="tree" style="margin-top:14px">${antlerSVG(cnt, e.g)}</div>`; }
  if (S.fx >= 3) { extra += `<div class="note" style="margin-top:12px;text-align:left">${lvUp ? `<b>Lv ${lvXp().lv} にアップ！</b> ` : ''}経験値 +${10 + 10 * e.lv}${newBadges.length ? '<br>バッジ：' + newBadges.map(b => b.e + ' ' + b.n).join('、') : ''}</div>`; }
  if (rf.pub === 'yes') line += ' 「みんなの初めて」にも出したよ。';
  dn = { img: IMG.p_done, title: S.fx === 1 ? '記録した' : '完了', line, extra, cta: 'きろくを見る', goLog: true };
  ov = 'done'; rf = { feeling: null, note: '', pub: null, nameMode: null, moodAfter: null }; render(); confetti();
}
function finishSkip() {
  const p = S.planned; const e = evById(p.evId);
  S.records.push({ id: ++S.sid, evId: e.id, t: e.t, g: e.g, lv: e.lv, date: ymd(new Date()), kind: 'skip', skipReason: rs.why });
  if (S.fx >= 3) S.xp += 5;
  S.nextAdjust = (rs.why === 'time') ? 'shorter' : (rs.why === 'hurdle' || rs.why === 'mood') ? 'lighter' : null;
  S.planned = null; save();
  const hurdle = rs.why === 'hurdle' && S.stage > 1;
  const lines = { time: '次は短い時間でできるものにするね。', mood: '気分はそういう日もあるよ。次は軽めにするね。', hurdle: '高かったんだね。次はもう少しやさしいのにするね。', weather: '天気や体調は大事。無理しないでね。', other: 'ほかのことができたなら、それもいい日だね。' };
  dn = { img: IMG.p_learn, title: '1回休み、きろくしたよ', line: (lines[rs.why] || '') + ' 減ったものはないよ。', extra: '', cta: 'ホームにもどる', stageDown: hurdle };
  rs = { why: null }; ov = 'done'; render();
}

root.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  if (t.classList.contains('scrim') && ev.target.closest('[data-stop]')) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'tab': tab = v; sheet = null; render(); break;
    case 'stage': S.stage = +v; S.dismissSuggest = false; save(); render(); toast('ペース：' + stageN()); break;
    case 'stage-intro': S.stage = +v; save(); render(); break;
    case 'fx': S.fx = +v; save(); render(); toast('演出：' + FX[S.fx - 1].n); break;
    case 'fx-intro': S.fx = +v; save(); render(); break;
    case 'theme': S.theme = v; applyTheme(); save(); render(); break;
    case 'dismiss': S.dismissSuggest = true; save(); render(); break;
    case 'tut-next': if (tutStep < TUT.length - 1) { tutStep++; render(); } else { ov = null; tutStep = 0; tab = 'today'; render(); } break;
    case 'tut-back': if (tutStep > 0) { tutStep--; render(); } else if (S.onboarded && introStep === 5 && window._tutFromIntro) { window._tutFromIntro = false; ov = 'intro'; render(); } else { ov = null; render(); } break;
    case 'tut-skip': ov = null; tutStep = 0; tab = 'today'; render(); break;
    case 'tut-open': tutStep = 0; window._tutFromIntro = false; ov = 'tutorial'; render(); break;
    case 'intro-back': introStep = Math.max(0, introStep - 1); if (introStep === 0) splashSkipped = true; render(); break;
    case 'intro-next': if (introStep === 0 && !splashSkipped && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && Date.now() - splashT0 < 5600) { splashSkipped = true; const el = document.getElementById('splash'); if (el) el.classList.add('skip'); break; } if (introStep === 1 && !(S.nickSet && S.nick.trim())) break; if (introStep < 5) { introStep++; render(); } else { S.onboarded = true; save(); tutStep = 0; window._tutFromIntro = true; ov = 'tutorial'; render(); } break;
    case 'chat': startChat(); break;
    case 'chat-close': ov = null; sheet = null; chat = null; render(); break;
    case 'ans': if (!chat.busy) await answer(t.dataset.key, v); break;
    case 'hint-skip': if (!chat.busy) { chat.msgs.push({ me: 'とくになし' }); await search(''); } break;
    case 'hint-go': if (!chat.busy) { const h = (document.getElementById('hint') || {}).value || ''; await search(h.trim()); } break;
    case 'redraw': if (!chat.busy) { chat.redraws++; await showCards(); } break;
    case 'restart': chat = newChat(); render(); await botSay('もう一度、いまの気分を教えてね。'); break;
    case 'detail': sheet = { type: 'detail', ev: evById(parseId(v)) }; render(); break;
    case 'choose': sheet = { type: 'when', ev: evById(parseId(v)), when: {} }; render(); break;
    case 'sheet-close': sheet = null; render(); break;
    case 'when-day': sheet.when.day = v; render(); break;
    case 'when-time': sheet.when.time = v; render(); break;
    case 'plan-save': { if (!sheet.when.day) break; const w = sheet.when.day + (sheet.when.time ? '・' + sheet.when.time : ''); savePlan(sheet.ev, w); sheet = null; ov = null; chat = null; tab = 'today'; render(); toast('仮の予定に入れたよ。いってらっしゃい！'); break; }
    case 'reflect': rf = { feeling: null, note: '', pub: null, nameMode: null, moodAfter: null }; ov = 'reflect'; render(); break;
    case 'feel': captureNote(); rf.feeling = v; render(); break;
    case 'pub': captureNote(); rf.pub = v; if (v === 'yes' && !rf.nameMode) rf.nameMode = S.nameMode; render(); break;
    case 'nm': captureNote(); rf.nameMode = v; render(); break;
    case 'nm-set': S.nameMode = v; save(); render(); break;
    case 'avatar': S.avatar = v; save(); render(); break;
    case 'avbg': S.avBg = +v; save(); render(); break;
    case 'filter': feedGenre = v; render(); break;
    case 'react': { const r = S.react[v] || (S.react[v] = {}); r[t.dataset.k] = !r[t.dataset.k]; save(); render(); break; }
    case 'tryit': { const p = allPosts().find(x => x.id === v); if (!p) break; const e = postToEv(p); S.customEvs[e.id] = e; save(); sheet = { type: 'when', ev: e, when: {} }; render(); break; }
    case 'goal': gid = v; ov = 'goal'; render(); break;
    case 'q1': S.goalCat = v; save(); render(); break;
    case 'q2': S.block = v; save(); render(); break;
    case 'char-intro': S.char = v; save(); render(); break;
    case 'char-set': S.char = v; save(); render(); break;
    case 'mood-after': captureNote(); rf.moodAfter = +v; render(); break;
    case 'checkin': ci = { mood: S.moods[ymd(new Date())] || null, time: 30, place: 'any', budget: 3000, text: '' }; sheet = { type: 'checkin' }; render(); break;
    case 'ci': captureCi(); ci[t.dataset.key] = (t.dataset.key === 'mood' || t.dataset.key === 'time' || t.dataset.key === 'budget') ? +v : v; render(); break;
    case 'ci-go': captureCi(); if (!ci.mood) break; buildPlan(false); sheet = null; render(); toast('きょうのプランを作りました'); break;
    case 'reroll': buildPlan(true); render(); toast('ほかの案に替えました'); break;
    case 'share': try { if (navigator.share) { await navigator.share({ title: 'セッカク', text: '気分に合わせて、きょうの「初めて」を決めるアプリ' }); } else { toast('共有はデモでは使えません'); } } catch (e) { toast('共有はデモでは使えません'); } break;
    case 'replan': if (S.planned) { sheet = { type: 'when', ev: evById(S.planned.evId), when: {} }; render(); } break;
    case 'togglepub': { const r = S.records.find(x => x.id === +v); if (r) { r.pub = !r.pub; if (r.pub && !r.nameMode) r.nameMode = S.nameMode; save(); render(); toast(r.pub ? '「みんなの初めて」に出したよ' : '非公開に戻したよ'); } break; }
    case 'reflect-save': if (rf.feeling) finishDone(); break;
    case 'skip': rs = { why: null }; ov = 'skip'; render(); break;
    case 'why': rs.why = v; render(); break;
    case 'skip-save': if (rs.why) finishSkip(); break;
    case 'ov-close': ov = null; render(); break;
    case 'now': { const e = evById(parseId(v)); S.planned = { evId: e.id, when: 'いま', startedAt: Date.now(), createdAt: ymd(new Date()), moodBefore: S.moods[ymd(new Date())] || null }; S.lastChat = S.lastChat || ymd(new Date()); save(); sheet = null; chat = null; tab = 'today'; ov = 'doing'; render(); break; }
    case 'doing': ov = 'doing'; render(); break;
    case 'later': if (S.planned) { S.planned.when = '今日・あとで'; delete S.planned.startedAt; save(); } ov = null; render(); toast('予定に残したよ。気が向いたらどうぞ'); break;
    case 'done-close': { const go = dn && dn.goLog; ov = null; if (go) tab = 'log'; dn = null; render(); fresh = null; break; }
    case 'stage-down': S.stage = Math.max(1, S.stage - 1); save(); ov = null; dn = null; render(); toast('ペース：' + stageN()); break;
    case 'reset': if (!window._ra) { window._ra = true; toast('もう一度押すと、最初の状態に戻ります'); setTimeout(() => { window._ra = false; }, 3000); } else { window._ra = false; S = seed(); save(); applyTheme(); tab = 'today'; introStep = 0; splashT0 = Date.now(); splashSkipped = false; ov = 'intro'; render(); } break;
  }
});
root.addEventListener('input', (e) => {
  if (e.target.id === 'nick') { S.nick = e.target.value.trim() || 'あなた'; S.nickSet = true; save(); }
  if (e.target.id === 'nick-intro') { const v = e.target.value.trim(); S.nick = v || 'あなた'; S.nickSet = !!v; save(); const b = root.querySelector('[data-act=intro-next]'); if (b) { b.disabled = !v; b.style.opacity = v ? '' : '.5'; } }
});
root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'hint' && chat && !chat.busy) search(e.target.value.trim()); });
/* carousel dots */
root.addEventListener('scroll', (e) => {
  if (e.target.id !== 'car') return; const c = e.target; const i = Math.round(c.scrollLeft / (c.firstElementChild.offsetWidth + 12));
  document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
}, true);

setInterval(() => { if (ov === 'doing') { const t = document.getElementById('tm'); if (t) t.textContent = elapsed(); } }, 1000);
/* start */
if (!S.onboarded) { ov = 'intro'; }
render();
</script>
</body>
