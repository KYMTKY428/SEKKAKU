<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ヤッテミタ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* NARAの白黒＋気分カラーを継承。1画面アプリ：上=積み上げ、中=進行中リスト、下=タブ */
:root {
  --bg: #FFFFFF; --ink: #111418; --muted: #858C95; --soft: #F4F5F7; --line: #E9EBEE; --btn: #111418; --btn-ink: #FFFFFF; --page: #ECEEF1;
  --want: #2F6FD6; --doing: #2E9E7A; --done: #F28A2E; --cant: #7D86D4; --warn: #D9543F;
  --add-bar: #BFD3F2; --done-bar: #F28A2E;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1013; --ink: #F2F4F6; --muted: #8B929B; --soft: #181B1F; --line: #24282D; --btn: #F2F4F6; --btn-ink: #111418; --page: #07080A; --want: #6E9EF0; --doing: #4CC79E; --done: #F6A35A; --cant: #9DA5E6; --warn: #F07A66; --add-bar: #2D4570; --done-bar: #F6A35A; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1013; --ink: #F2F4F6; --muted: #8B929B; --soft: #181B1F; --line: #24282D; --btn: #F2F4F6; --btn-ink: #111418; --page: #07080A; --want: #6E9EF0; --doing: #4CC79E; --done: #F6A35A; --cant: #9DA5E6; --warn: #F07A66; --add-bar: #2D4570; --done-bar: #F6A35A; color-scheme: dark; }
html { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.65; font-weight: 500; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--want); outline-offset: 2px; }
.app { position: relative; width: 100%; max-width: 480px; height: 100%; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 560px) { body { display: flex; align-items: center; } .app { height: min(900px, 100%); border-radius: 32px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(17,20,24,.14); } }
.top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); min-height: 48px; }
.wm { font-weight: 900; font-size: 13px; letter-spacing: .3em; color: var(--muted); }
.sync { font-size: 11px; color: var(--muted); font-weight: 700; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 110px max(20px, env(safe-area-inset-left, 0px)); }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px 12px 6px; border-top: 1px solid var(--line); background: var(--bg); }
.tab { min-height: 54px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--muted); position: relative; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--done); }
.fab { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 80px; height: 58px; padding: 0 24px 0 20px; border-radius: 29px; background: var(--btn); color: var(--btn-ink); font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 28px rgba(17,20,24,.22); z-index: 5; transition: transform .15s; }
.fab:active { transform: scale(.94); }
.fab b { font-size: 24px; line-height: 1; margin-top: -2px; }

/* hero */
.hero { display: flex; align-items: center; gap: 16px; padding: 8px 0 4px; }
.hero .n { font-size: 58px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .l { color: var(--muted); font-weight: 700; font-size: 13px; }
.hero .msg { font-weight: 900; font-size: 15px; margin-top: 4px; }
.mini-stats { display: flex; gap: 8px; margin-top: 14px; }
.ms { flex: 1; background: var(--soft); border-radius: 16px; padding: 10px 12px; }
.ms b { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; display: block; line-height: 1.3; }
.ms span { font-size: 11px; color: var(--muted); font-weight: 700; }

/* character */
.nara { display: block; overflow: visible; flex: none; }
.nara .cb { fill: var(--c); } .nara .cs { fill: var(--s); } .nara .cst { stroke: var(--c); }
.nara.idle { animation: bob 3.4s ease-in-out infinite; }
.nara .tail { transform-origin: 90px 38px; animation: tailw 2.6s ease-in-out infinite; }
.nara .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.nara.hop { animation: hop .7s cubic-bezier(.3,.8,.4,1); }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes tailw { 50% { transform: rotate(8deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes hop { 25% { transform: scale(1.1,.88); } 55% { transform: translateY(-14px) scale(.94,1.08); } 80% { transform: scale(1.05,.95); } }

/* sections + cards */
.sec { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin: 34px 0 10px; }
.sec i { font-style: normal; font-variant-numeric: tabular-nums; }
.card { background: var(--soft); border-radius: 22px; padding: 16px 16px 12px; display: grid; gap: 6px; }
.cards { display: grid; gap: 10px; }
.card .h { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; }
.card h3 { margin: 0; font-size: 17px; font-weight: 900; line-height: 1.45; flex: 1; min-width: 0; }
.pill { flex: none; font-size: 11px; font-weight: 900; padding: 2px 10px; border-radius: 10px; color: #fff; background: var(--pc); letter-spacing: .04em; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
.meta .late { color: var(--warn); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; background: var(--cc); margin-right: 5px; vertical-align: 1px; }
.cur { font-size: 13px; line-height: 1.6; }
.cur b { font-weight: 900; }
.lastlog { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
.qa { display: flex; gap: 6px; margin-top: 6px; }
.qa button { flex: 1; min-height: 40px; border-radius: 13px; font-weight: 700; font-size: 13px; background: var(--bg); transition: transform .15s; }
.qa button:active { transform: scale(.95); }
.qa .go { background: var(--btn); color: var(--btn-ink); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1.5px dashed var(--line); border-radius: 22px; font-size: 14px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chp { min-height: 40px; padding: 0 14px; border-radius: 14px; background: var(--soft); font-weight: 700; font-size: 14px; position: relative; transition: transform .15s, background .2s, color .2s; }
.chp:active { transform: scale(.94); }
.chp[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.chp.pred { box-shadow: inset 0 0 0 2px var(--done); }
.chp.pred::after { content: "予測"; position: absolute; top: -8px; right: -4px; font-size: 9px; font-weight: 900; background: var(--done); color: #fff; border-radius: 6px; padding: 0 5px; line-height: 15px; }
.chp.sm { min-height: 32px; padding: 0 11px; font-size: 12px; border-radius: 11px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 16px; }
.seg button { flex: 1; min-height: 42px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 2px 8px rgba(17,20,24,.08); }

/* sheet */
.sheet-bg { position: absolute; inset: 0; background: rgba(10,12,15,.38); z-index: 20; animation: fade .2s both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 94%; background: var(--bg); border-radius: 26px 26px 0 0; z-index: 21; display: flex; flex-direction: column; animation: up .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.shead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 4px max(20px, env(safe-area-inset-left, 0px)); }
.shead b { font-size: 16px; font-weight: 900; }
.x { min-width: 44px; min-height: 44px; font-weight: 700; color: var(--muted); }
.sbody { flex: 1; overflow-y: auto; padding: 4px max(20px, env(safe-area-inset-right, 0px)) 16px max(20px, env(safe-area-inset-left, 0px)); }
.sfoot { flex: none; padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.cta { flex: 1; min-height: 54px; border-radius: 18px; background: var(--btn); color: var(--btn-ink); font-size: 16px; font-weight: 900; }
.cta:disabled { opacity: .2; cursor: default; }
.ghost { min-height: 54px; padding: 0 16px; border-radius: 18px; font-weight: 700; color: var(--muted); background: var(--soft); }
.lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin: 22px 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.lab small { letter-spacing: 0; font-weight: 500; }
.txt { width: 100%; min-height: 50px; border-radius: 15px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px 14px; font: inherit; font-size: 16px; }
textarea.txt { min-height: 80px; resize: vertical; line-height: 1.6; }
.title-in { font-size: 19px; font-weight: 900; min-height: 56px; }
.sub-box { background: var(--soft); border-radius: 18px; padding: 4px 14px 14px; margin-top: 10px; }
.sub-box .lab { margin-top: 12px; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.logs li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.logs time { color: var(--muted); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 2px; }
.danger { color: var(--warn); font-weight: 700; min-height: 44px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
.confirm button { min-height: 40px; padding: 0 14px; border-radius: 12px; background: var(--warn); color: #fff; font-weight: 700; }

/* つみあげ */
.big { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 16px; }
.big b { font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.tile { aspect-ratio: 1; border-radius: 28%; background: var(--cc); }
.tile.pop { animation: tp .8s cubic-bezier(.3,1.8,.5,1) .15s both; }
@keyframes tp { from { transform: scale(0) rotate(-20deg); } }
.month-h { font-size: 13px; font-weight: 900; margin: 28px 0 4px; display: flex; justify-content: space-between; }
.month-h span { color: var(--muted); font-weight: 700; }
.done-row { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; width: 100%; text-align: left; }
.done-row .t { font-weight: 900; display: flex; gap: 8px; align-items: baseline; }
.done-row .t span { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 700; flex: none; }
.done-row q { quotes: none; font-size: 14px; }
.feel { font-size: 11px; font-weight: 900; padding: 1px 8px; border-radius: 8px; background: var(--soft); color: var(--muted); flex: none; }

/* グラフ */
.navp { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
.navp b { font-size: 18px; font-weight: 900; }
.navp button { width: 44px; height: 44px; border-radius: 14px; background: var(--soft); font-size: 18px; font-weight: 900; }
.navp button:disabled { opacity: .25; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 4px; }
.kpi { background: var(--soft); border-radius: 14px; padding: 8px 6px; text-align: center; }
.kpi b { display: block; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 9px; font-family: inherit; font-weight: 700; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ba { fill: var(--add-bar); } .chart .bd { fill: var(--done-bar); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hb { display: grid; grid-template-columns: 88px 1fr 46px; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; }
.hb .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .tr { position: relative; height: 14px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.hb .tr .a { position: absolute; inset: 0 auto 0 0; background: var(--add-bar); border-radius: 5px; }
.hb .tr .d { position: absolute; inset: 0 auto 0 0; background: var(--done-bar); border-radius: 5px; }
.hb .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; font-size: 12px; }
.split { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--soft); }
.split i { display: block; height: 100%; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }

.voice { background: var(--soft); border-radius: 20px; padding: 12px 14px 14px; display: grid; gap: 10px; }
.voice .vh { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; }
.voice .vh small { font-weight: 500; color: var(--muted); font-size: 12px; }
.mic { width: 30px; height: 30px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; flex: none; }
.voice textarea.txt { min-height: 92px; background: var(--bg); }
.auto { min-height: 46px; border-radius: 14px; background: var(--done); color: #fff; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.auto:disabled { opacity: .45; cursor: default; }
.auto.busy::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.filled { box-shadow: 0 0 0 2px var(--done) !important; transition: box-shadow 1.2s; }
.res-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.res-row .k { width: 52px; font-size: 13px; font-weight: 700; flex: none; }
.res-row .tot { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 72px; }
.res-row .clr { font-size: 12px; color: var(--muted); min-height: 32px; padding: 0 6px; }
.res-tag { display: inline-flex; gap: 8px; }
.chart .area { fill: var(--done-bar); opacity: .16; }
.chart .ln { fill: none; stroke: var(--done-bar); stroke-width: 2.5; stroke-linejoin: round; }
.chart .pt { fill: var(--bg); stroke: var(--done-bar); stroke-width: 2; }
.chart .end { fill: var(--done-bar); }
.chart .endt { fill: var(--ink); font-size: 13px; font-weight: 900; }
.chart .mc { fill: var(--ink); font-size: 10px; font-weight: 900; }
.chart .today { stroke: var(--muted); stroke-dasharray: 2 3; }
.hb.click { width: 100%; text-align: left; }
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; white-space: nowrap; animation: tin .3s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 12px); } }
.confetti { position: absolute; top: -12px; width: 9px; height: 13px; border-radius: 3px; animation: fall 1.7s ease-in forwards; z-index: 50; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .confetti { display: none; } }
</style>

<div class="app" id="app">
  <header class="top"><span class="wm">ヤッテミタ</span><span class="sync" id="sync">読み込み中…</span></header>
  <main class="scroll" id="main"></main>
  <button class="fab" data-act="add" aria-label="やってみたいことを追加"><b>＋</b>やってみたい</button>
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-act="tab" data-v="now">いま</button>
    <button class="tab" data-act="tab" data-v="pile">つみあげ</button>
    <button class="tab" data-act="tab" data-v="graph">グラフ</button>
  </nav>
</div>

<script>
/* ========= 定数 ========= */
const STATUS = {
  want:  { n: 'やりたい', c: 'var(--want)' },
  doing: { n: 'やってる', c: 'var(--doing)' },
  done:  { n: 'やった', c: 'var(--done)' },
  cant:  { n: 'やれなかった', c: 'var(--cant)' }
};
const CATS = [
  { k: 'learn', n: '学び', c: '#2F6FD6', kw: ['本', '読', '勉強', '学', '講座', '資格', '英語', '語学', 'セミナー', '研究', '調べ'] },
  { k: 'make', n: '発信・創作', c: '#E0705C', kw: ['配信', 'podcast', 'ポッドキャスト', 'ブログ', 'note', '動画', 'youtube', '書く', '描', '写真', '作る', '作曲', 'diy', '投稿', 'デザイン', '陶芸', '手作り'] },
  { k: 'body', n: '体・健康', c: '#2E9E7A', kw: ['睡眠', '寝', '走', 'ラン', '筋トレ', 'ヨガ', 'ジム', 'ダイエット', '健康', 'サウナ', 'ストレッチ', '歩', '瞑想', '早起き', '体調', '体重'] },
  { k: 'food', n: '食', c: '#E8B84A', kw: ['料理', 'カフェ', '食', '飲', 'レストラン', 'ランチ', 'ワイン', '酒', 'パン', 'スイーツ', 'ラーメン', '自炊'] },
  { k: 'ent', n: 'エンタメ', c: '#A86FD9', kw: ['映画', 'ライブ', 'ドラマ', 'アニメ', 'ゲーム', '漫画', 'マンガ', '鑑賞', '観', '展', '美術', '舞台', '音楽', 'フェス', '推し'] },
  { k: 'trip', n: 'おでかけ・旅', c: '#3BA3C9', kw: ['旅', '温泉', 'キャンプ', '海', '登山', '山', '散歩', '駅', '旅行', 'ドライブ', '公園', '行く'] },
  { k: 'work', n: '仕事・キャリア', c: '#5B6573', kw: ['仕事', '副業', '転職', '企画', 'ai', 'ツール', '営業', '登壇', 'プレゼン', '業務', 'claude'] },
  { k: 'people', n: '人・つながり', c: '#F28A2E', kw: ['友', '会う', '誘', 'イベント', 'コミュニティ', '飲み会', '交流', '家族', '仲間', 'ボランティア'] },
  { k: 'life', n: '暮らし', c: '#8A9A5B', kw: ['部屋', '掃除', '片付', '植物', '家', '買', '節約', '整理', '習慣', '日記'] }
];
const CATM = Object.fromEntries(CATS.map(c => [c.k, c]));
const TRIGS = [
  { k: 'rec', n: '人にすすめられた', kw: ['すすめ', '勧め', '薦め', '教え', '紹介'] },
  { k: 'talk', n: '会話のノリ', kw: ['話', '会話', 'ノリ', '盛り上が', 'やってみたら'] },
  { k: 'media', n: '本・記事・番組', kw: ['本', '読', '記事', '番組', 'テレビ', 'ニュース', '先生'] },

/* ========= 画面：グラフ（その年の1月からの積み上げ） ========= */
function yearDone(y) {
  const g = S.g;
  return list().filter(x => x.status === 'done' && x.doneAt && x.doneAt.startsWith(String(y)))
    .filter(x => g.dim === 'cat' && g.val ? x.cat === g.val : g.dim === 'trig' && g.val ? (x.trig || []).includes(g.val) : true)

}
function cumChart(items, y) {
  const W = 340, H = 196, L = 26, R = 30, T = 16, B = 40;

  const isCur = y === new Date().getFullYear();
  const last = isCur ? new Date() : end;
  const days = Math.round((end - start) / 864e5) + 1;
  const dayOf = (s) => Math.round((pd(s) - start) / 864e5);
  const total = items.length;
  const top = total <= 4 ? Math.max(4, total) : Math.ceil(total * 1.15 / 5) * 5;
  const iw = W - L - R, ih = H - T - B;
  const x = (d) => L + (d / (days - 1)) * iw, yv = (v) => T + ih - (v / top) * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${y}年の1月からのやった数の積み上げ">`;
  const ticks = top <= 4 ? [0, 1, 2, 3, 4] : [0, top / 2, top];
  ticks.forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yv(t)}" y2="${yv(t)}"/><text x="${L - 6}" y="${yv(t) + 3}" text-anchor="end">${t}</text>`; });
  // 階段状の累積ライン
  let c = 0, pts = [[x(0), yv(0)]];
  items.forEach(it => { const d = dayOf(it.doneAt); pts.push([x(d), yv(c)]); c++; pts.push([x(d), yv(c)]); });
  const lx = x(Math.min(days - 1, Math.round((last - start) / 864e5)));
  pts.push([lx, yv(c)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  s += `<path class="area" d="${path}L${lx.toFixed(1)} ${yv(0)}Z"/><path class="ln" d="${path}"/>`;
  c = 0; items.forEach(it => { c++; s += `<circle class="pt" cx="${x(dayOf(it.doneAt)).toFixed(1)}" cy="${yv(c).toFixed(1)}" r="3"><title>${md(it.doneAt)} ${esc(it.title)}</title></circle>`; });
  if (isCur) s += `<line class="today" x1="${lx}" x2="${lx}" y1="${T}" y2="${T + ih}"/>`;
  s += `<circle class="end" cx="${lx}" cy="${yv(total)}" r="4.5"/><text class="endt" x="${Math.min(lx + 7, W - 4)}" y="${yv(total) - 8}" text-anchor="${lx + 7 > W - R ? 'end' : 'start'}">${total}</text>`;
  // 月ラベルと月ごとの件数
  for (let m = 0; m < 12; m++) {
    const d0 = dayOf(y + '-' + z2(m + 1) + '-01'), d1 = dayOf(ymd(new Date(y, m + 1, 0)));
    const cx = (x(d0) + x(d1)) / 2;
    const n = items.filter(it => it.doneAt.slice(5, 7) === z2(m + 1)).length;
    s += `<text x="${cx}" y="${H - B + 14}" text-anchor="middle">${m + 1}</text>`;
    if (n) s += `<text class="mc" x="${cx}" y="${H - B + 30}" text-anchor="middle">+${n}</text>`;
  }
  return s + '</svg>';
}

}
function editBody(d) {
  const presets = STATE_PRESETS[d.status] || [];
  let s = (d._new ? voiceBox('f-voice', 'v-auto', d._voice, '例：仲間にすすめられて、11月中にPodcastを配信してみたい。今は企画中。', d._busy, '話して入力') + '<div class="lab" style="margin-top:18px">内容 <small>自動で入ったものを直すだけ</small></div>' : '') + `<input class="txt title-in" id="f-title" placeholder="例：Podcastを配信してみる" value="${esc(d.title)}" autocomplete="off">
    <div class="lab">カテゴリ <small>タイトルから予測します</small></div><div class="chips" id="catchips">${catChips(d)}</div>
    <div class="lab">キッカケ <small>複数OK</small></div><div class="chips" id="trigchips">${trigChips(d)}</div>
    <input class="txt" id="f-trigNote" style="margin-top:10px" placeholder="誰から・何で？（任意）" value="${esc(d.trigNote)}">

    <div class="lab">いまの状態</div><div class="seg">${['want', 'doing', 'done', 'cant'].map(k => `<button data-act="f-status" data-v="${k}" aria-pressed="${d.status === k}">${STATUS[k].n}</button>`).join('')}</div>`;
  if (d.status === 'want') {

      <input class="txt" id="f-stateNote" style="margin-top:10px" placeholder="例：友達とやるか1人でやるか検討中" value="${esc(d.stateNote)}">`;
  }

      <div class="lab">感想</div><textarea class="txt" id="f-impression" placeholder="思ったこと、気づいたこと">${esc(d.impression)}</textarea>
      <div class="sugs">${IMP_PHRASES.map(p => chip('f-imp', p, p, false, 'sm')).join('')}</div>`;
  }

      <ul class="logs">${(d.logs || []).slice().reverse().map(l => `<li><time>${md(l.d)}</time><span>${esc(l.t)}</span></li>`).join('') || '<li><time></time><span class="note">まだありません</span></li>'}</ul>
      <div class="meta" style="margin-top:12px"><span>登録 ${md(d.created)}</span>${d.doneAt && d.status === 'done' ? `<span>やった ${md(d.doneAt)}</span>` : ''}</div>
      <div style="margin-top:18px">${S.confirmDel ? `<div class="confirm">この記録を削除しますか？<button data-act="del-yes">削除する</button><button data-act="del-no" style="background:var(--soft);color:var(--ink)">やめる</button></div>` : '<button class="danger" data-act="del">この記録を削除</button>'}</div>`;
  }

}
function logBody(d) {
  return `<div class="cur" style="font-weight:900;font-size:17px">${esc(d.title)}</div>
    <div style="margin-top:12px">${voiceBox('l-text', 'l-auto', d._log, '例：3日目。7時間寝ても眠い。本を1冊買った、1,500円', d._busy, 'きょうのメモ')}</div>
    <div class="sugs">${LOG_PHRASES.map(p => chip('l-phrase', p, p, false, 'sm')).join('')}</div>
    <div class="lab">現状も更新する <small>任意</small></div><div class="chips">${(STATE_PRESETS[d.status] || STATE_PRESETS.want).map(p => chip('l-state', p, p, d._stateTag === p, 'sm')).join('')}</div>
    <div class="lab">進んだ？ <small>任意</small></div><div class="chips">${d.status === 'want' ? chip('l-start', '1', 'やり始めた', d._start) : ''}${chip('l-done', '1', 'やった！にする', d._done)}</div>
    ${resBox(d, '今回使った分を足す（合計が更新されます）')}`;
}
function logChanged(d) { return !!((d._log || '').trim() || d._stateTag !== d.stateTag || d._start || d._done || d.res.min !== d._res0.min || d.res.yen !== d._res0.yen || d.res.other !== d._res0.other); }
function logRule(t) {
  const o = {};
  const st = [...STATE_PRESETS.want, ...STATE_PRESETS.doing].find(p => t.includes(p.replace(/段階|中$/, '')));
  if (st) o.stateTag = st;
  if (/始めた|スタートした|やり始め/.test(t)) o.start = true;
  if (/(やった|完了|終わった|できた|達成|行ってきた|観てきた)(。|$|！|、|よ)/.test(t)) o.done = true;
  const r = parseRes(t); o.resMin = r.min; o.resYen = r.yen;
  return o;
}
function applyLog(d, o, base) {
  if (o.stateTag && [...STATE_PRESETS.want, ...STATE_PRESETS.doing].includes(o.stateTag)) d._stateTag = o.stateTag;
  if (o.start && d.status === 'want') d._start = true;
  if (o.done) d._done = true;
  d.res.min = base.min + Math.max(0, Math.round(+o.resMin || 0));
  d.res.yen = base.yen + Math.max(0, Math.round(+o.resYen || 0));
  if (typeof o.resOther === 'string' && o.resOther.trim()) d.res.other = [base.other, o.resOther.trim()].filter(Boolean).join('・');

}
async function runAuto(kind) {
  const d = S.draft; if (!d || d._busy) return; readFields();

  let filled = [];
  if (kind === 'edit') { applyParsed(d, ruleParse(text)); filled = d._filled.slice(); }
  else applyLog(d, logRule(text), d._res0);
  d._busy = true; renderSheet();
  const v = await aiParse(text, kind);
  if (S.draft !== d) return;
  d._busy = false;
  if (v) {

    filled.forEach(k => { const e = document.getElementById({ title: 'f-title', trigNote: 'f-trigNote', stateNote: 'f-stateNote', impression: 'f-impression', res: 'f-yen' }[k] || ''); if (e) { e.classList.add('filled'); setTimeout(() => e.classList.remove('filled'), 1600); } });
    toast(`${filled.length}項目を入れました。違うところだけ直してください`);
  } else toast(v ? 'メモを整えて、項目に反映しました' : '項目に反映しました');
  const b = $('.sfoot .cta'); if (b && kind === 'log') b.disabled = !logChanged(d);
  if (b && kind === 'edit') b.disabled = !d.title.trim();
}
function doneBody(d) {
  return `<div style="display:flex;justify-content:center;margin:4px 0 2px">${naraSVG(5, 64, 'hop')}</div>
    <div class="c" style="text-align:center;font-weight:900;font-size:18px">${esc(d.title)}</div>
    <div class="lab">どうだった？</div><div class="chips">${FEELS.map(f => chip('f-feel', f.k, f.n, d.feel === f.k)).join('')}</div>
    <div class="lab">誰と？</div><div class="chips">${STATE_PRESETS.done.map(p => chip('f-state', p, p, d.stateTag === p, 'sm')).join('')}</div>
    <div class="lab">感想 <small>あとからでもOK</small></div><textarea class="txt" id="f-impression" placeholder="思ったこと、気づいたこと">${esc(d.impression)}</textarea>
    <div class="sugs">${IMP_PHRASES.map(p => chip('f-imp', p, p, false, 'sm')).join('')}</div>

function cantBody(d) {
  return `<div class="cur" style="font-weight:900;font-size:17px">${esc(d.title)}</div>
    <div class="note">理由を残しておくと、グラフで「物理的／気持ち的」の傾向が見えます。</div>${blockBox(d, 'どちらに近い？')}`;
}

/* ========= 操作 ========= */
let toastT;
function toast(t) { document.querySelectorAll('.toast').forEach(e => e.remove()); $('#app').insertAdjacentHTML('beforeend', `<div class="toast" role="status">${esc(t)}</div>`); clearTimeout(toastT); toastT = setTimeout(() => document.querySelectorAll('.toast').forEach(e => e.remove()), 2400); }
function confetti() {
  const app = $('#app'); const cs = ['#2F6FD6', '#38B28A', '#F2C230', '#F28A2E', '#A86FD9'];
  for (let i = 0; i < 36; i++) { const e = document.createElement('i'); e.className = 'confetti'; e.style.left = Math.random() * 100 + '%'; e.style.background = cs[i % 5]; e.style.animationDelay = Math.random() * .4 + 's'; app.appendChild(e); setTimeout(() => e.remove(), 2400); }
}
function readFields() {
  const d = S.draft; if (!d) return;
  const v = (id) => { const e = document.getElementById(id); return e ? e.value : undefined; };
  [['f-title', 'title'], ['f-trigNote', 'trigNote'], ['f-stateNote', 'stateNote'], ['f-blockNote', 'blockNote'], ['f-impression', 'impression'], ['f-due', 'due'], ['f-doneAt', 'doneAt'], ['f-startAt', 'startAt'], ['l-text', '_log'], ['f-voice', '_voice']].forEach(([id, k]) => { const x = v(id); if (x !== undefined) d[k] = x; });
  const yen = v('f-yen'); if (yen !== undefined) d.res.yen = Math.max(0, parseInt(yen, 10) || 0);
  const oth = v('f-resOther'); if (oth !== undefined) d.res.other = oth;
}
function draftOf(it) { return JSON.parse(JSON.stringify(normalize(it))); }
function clean(d) { const o = {}; Object.keys(d).forEach(k => { if (!k.startsWith('_')) o[k] = d[k]; }); return o; }

document.addEventListener('input', (e) => {
  if (!S.draft) return; readFields();
  const d = S.draft;
  if (e.target.id === 'f-title') { const c = $('#catchips'); if (c) { if (!d._catManual) { const p = predictCat(d.title); if (p) d.cat = p; } c.innerHTML = catChips(d); } const b = $('.sfoot .cta'); if (b) b.disabled = !d.title.trim(); }
  if (e.target.id === 'f-trigNote') { const c = $('#trigchips'); if (c) c.innerHTML = trigChips(d); }
  if (S.sheet === 'log') { const b = $('.sfoot .cta'); if (b) b.disabled = !logChanged(d); }
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id; const it = id ? S.items[id] : null;
  if (S.draft) readFields();
  const d = S.draft;
  switch (act) {
    case 'tab': S.tab = v; $('#main').scrollTop = 0; render(); break;
    case 'add': openSheet('edit', Object.assign(draftOf({ id: uid(), title: '', cat: '', when: 'month', due: dueFor('month') }), { _new: true })); break;
    case 'open': openSheet('edit', draftOf(it)); break;
    case 'log': { const x = draftOf(it); openSheet('log', Object.assign(x, { _log: '', _stateTag: it.stateTag, _res0: Object.assign({}, x.res) })); break; }
    case 'done': openSheet('done', Object.assign(draftOf(it), { doneAt: today() })); break;
    case 'cant': openSheet('cant', draftOf(it)); break;
    case 'start': { const x = draftOf(it); x.status = 'doing'; x.startAt = today(); x.stateTag = '実験中'; x.logs.push({ d: today(), t: 'やり始めた' }); persist(x); toast('「やってる」にしました'); break; }
    case 'retry': { const x = draftOf(it); x.status = 'want'; x.when = 'someday'; x.due = null; x.logs.push({ d: today(), t: 'もう一度やりたいに戻した' }); persist(x); toast('「やりたい」に戻しました'); break; }
    case 'archive': { const x = draftOf(it); x.archived = true; x.logs.push({ d: today(), t: '手放した' }); persist(x); toast('手放しました。グラフには残ります'); break; }
    case 'close': closeSheet(); break;
    case 'f-cat': d.cat = v; d._catManual = true; renderSheet(); break;
    case 'f-trig': d.trig = d.trig.includes(v) ? d.trig.filter(x => x !== v) : [...d.trig, v]; renderSheet(); break;
    case 'f-note': d.trigNote = d.trigNote ? d.trigNote : v; if (!d.trig.length) { const p = predictTrig(v); if (p) d.trig = [p]; } renderSheet(); { const n = $('#f-trigNote'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } } break;
    case 'f-status': d.status = v; if (v === 'done' && !d.doneAt) d.doneAt = today(); if (v === 'doing' && !d.startAt) d.startAt = today(); if (!(STATE_PRESETS[v] || []).includes(d.stateTag)) d.stateTag = ''; renderSheet(); break;
    case 'f-when': d.when = v; d.due = v === 'date' ? (d.due || today()) : dueFor(v); if (v !== 'someday' && d.status === 'want') { d.block = null; d.blockTags = []; } renderSheet(); break;
    case 'f-block': if (d.block !== v) d.blockTags = []; d.block = d.block === v ? null : v; renderSheet(); break;
    case 'f-btag': d.blockTags = d.blockTags.includes(v) ? d.blockTags.filter(x => x !== v) : [...d.blockTags, v]; renderSheet(); break;
    case 'f-state': d.stateTag = d.stateTag === v ? '' : v; renderSheet(); break;
    case 'f-feel': d.feel = d.feel === v ? '' : v; renderSheet(); break;
    case 'f-imp': d.impression = (d.impression ? d.impression.replace(/\s+$/, '') + '。' : '') + v; renderSheet(); break;
    case 'l-phrase': d._log = (d._log ? d._log.replace(/\s+$/, '') + '。' : '') + v; renderSheet(); break;
    case 'l-state': d._stateTag = d._stateTag === v ? d.stateTag : v; renderSheet(); break;

    case 'savecant': { const x = clean(d); x.status = 'cant'; x.cantAt = today(); x.logs = [...x.logs, { d: today(), t: 'やれなかった' + (x.blockTags.length ? '（' + x.blockTags.join('・') + '）' : '') }]; persist(x); closeSheet(); toast('記録しました。理由が分かるのも前進です'); break; }
    case 'del': S.confirmDel = true; renderSheet(); break;
    case 'del-no': S.confirmDel = false; renderSheet(); break;
    case 'del-yes': { const i = d.id; closeSheet(); remove(i); toast('削除しました'); break; }
    case 'pilecat': S.pileCat = v; render(); break;

    case 'gval': S.g.val = v; render(); break;

function celebrate(x) {

}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

/* ========= 起動 ========= */
cacheLoad(); render(); setSync('この端末に保存');
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use('db');
    if (!db) return;
    setSync('同期中…');
    const col = db.collection('items');
    const apply = (snap) => { const map = {}; docsOf(snap).forEach(x => { if (x && x.id && x.title) map[x.id] = normalize(x); }); S.items = map; cacheSave(); render(); setSync('クラウドに保存済み'); };
    if (typeof col.onSnapshot === 'function') col.onSnapshot(apply, () => setSync('オフライン（この端末に保存）'));
